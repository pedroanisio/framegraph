  # ─── SLIDE 09 — What We Refuse to Ship (uses taboo_card symbol) ────────────
  - slide: 9
    id: s9_taboos
    title: "What We Will Refuse to Ship"
    description: "Six taboos via taboo_card symbol. 3×2 grid. Phase 3."
    notes: "Six refusals, but the cultural-commitment band at the bottom is the actual point. Read the slide title, then pause and read the band first. The six cards are evidence; the band is the commitment."
    tokens:
      text_styles:
        cult_h:        {font: primary, size: 12,  weight: 700, color: white,       align: left,   line_height: 16, wrap: true}
        cult_b:        {font: primary, size: 10,  weight: 400, color: white,       align: left,   line_height: 14, wrap: true}
    visual:
      layers:
        - id: chrome
          z: 0
          objects:
            - {type: use, id: v.ch, decorative: true, symbol: chrome, box: [0,0,960,540],
               slide_title: "What We Will Refuse to Ship",
               slide_num: "09", params: {phase_color: phase3}}
        - id: taboos
          z: 10
          objects:
            - type: use
              id: v.t1
              decorative: true
              symbol: taboo_card
              box: [40, 68, 440, 108]
              number: "01"
              title: "No dark patterns."
              body: "No infinite-scroll, no hidden cancel, no fake urgency, no manipulative copy. The path out of any state is as obvious as the path in."
            - type: use
              id: v.t2
              decorative: true
              symbol: taboo_card
              box: [40, 184, 440, 108]
              number: "02"
              title: "No attention-capture UX."
              body: "No notification bursts to drive re-engagement. No streak counters, no read-receipt anxiety. The product earns attention by being useful, never by extracting it."
            - type: use
              id: v.t3
              decorative: true
              symbol: taboo_card
              box: [40, 300, 440, 108]
              number: "03"
              title: "No training without consent."
              body: "Per-source explicit consent. Family data is opt-in only. Default is no-train. The user can inspect, edit, export, and delete any memory at any time."
            - type: use
              id: v.t4
              decorative: true
              symbol: taboo_card
              box: [496, 68, 440, 108]
              number: "04"
              title: "No engagement metrics as North Star."
              body: "DAU, time-spent, queries-served are operational metrics, never goals. Internal North Star: hours of cognition offloaded. We measure what the user got back, not what we captured."
            - type: use
              id: v.t5
              decorative: true
              symbol: taboo_card
              box: [496, 184, 440, 108]
              number: "05"
              title: "No hidden Core configurability."
              body: "The Core's commitments are constitutional and non-negotiable. They are not behind feature flags. The cancel-subscription path is the user's only response to fundamental disagreement."
            - type: use
              id: v.t6
              decorative: true
              symbol: taboo_card
              box: [496, 300, 440, 108]
              number: "06"
              title: "No soft-refusal that relents."
              body: "A hard limit that softens under user pressure is not a limit. The system does not negotiate. \"Sleep on it\" is the user's cool-down hatch — not the system's reconsideration loop."
        - id: cultural_commitment
          z: 20
          objects:
            - {type: rect, id: v.cc, decorative: true, box: [40,424,896,80], fill: text, radius: 6}
            - {type: rect, id: v.cca, decorative: true, box: [40,424,4,80], fill: accent_warm}
            - {type: text, id: v.cch, decorative: true, text: "When growth metrics demand we ship these, we will refuse.", box: [60,442,860,18], style: cult_h}
            - {type: text, id: v.ccb, decorative: true,
               text: "This list will be defended at every quarterly product review. Every PM, every engineer, every designer who joins this company will read it on day one. The cultural enforcement is the work — not the architecture.",
               box: [60,466,860,32], style: cult_b}

  # ─── SLIDE 10 — The Founder Commitment ─────────────────────────────────────
  - slide: 10
    id: s10_commitment
    title: ""
    description: "Closing slide. The single sentence that drives every product decision for the next decade. Phase 3 close."
    notes: "Read the line. Stop. Do not say anything else. Let the silence do the work. If the room is uncomfortable, that is the correct response."
