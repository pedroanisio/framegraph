name: CI

on:
  push:
    branches: [main, "release/**"]
    tags:     ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group:  ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Regression: golden-snapshot suite ──────────────────────────────────────
  golden-snapshots:
    name: Golden snapshots (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (cairo)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev libglib2.0-dev pkg-config

      - name: Install framegraph + test extras
        run: pip install -e ".[test]"

      - name: Run golden-snapshot regression suite
        run: python tests/run_tests.py --verbose

      - name: Upload diff artefacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs-py${{ matrix.python-version }}
          path: tests/goldens/
          retention-days: 7

  # ── Pytest contract suite ──────────────────────────────────────────────────
  # Runs the unit + integration suite configured in [tool.pytest.ini_options].
  # The configured `--cov-fail-under=90` gate becomes a real CI guard here,
  # not just a local convention. Golden snapshots run in their own job above;
  # this job covers the public CLI/API contract surface that golden PNGs do
  # not exercise.
  pytest:
    name: Pytest (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (cairo)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev libglib2.0-dev pkg-config

      - name: Install framegraph + test extras
        run: pip install -e ".[test]"

      - name: Run pytest (unit + integration, coverage-gated)
        run: python -m pytest

  # ── Lint ───────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev extras
        run: pip install -e ".[dev]"

      # Ruff is enforcing. The configured ruleset (see pyproject.toml)
      # is curated — the codebase is clean under it as of Step 5 of the
      # python-code-style enhancement.
      - name: ruff check
        run: ruff check framegraph/

      - name: ruff format --check
        run: ruff format --check framegraph/

      # Mypy strict mode — enforcing. The pyproject.toml [tool.mypy]
      # section enables `strict = true` and the `pydantic.mypy` plugin;
      # `types-PyYAML` is pulled in via the [dev] extra. The codebase
      # is currently 0 errors under this configuration.
      - name: mypy (strict)
        run: mypy framegraph/

  # ── PR-time wheel smoke ────────────────────────────────────────────────────
  # Drift-risk-map Finding #7: package-data drift only fails the publish job,
  # which runs on tag push. By then the regression has merged. This job builds
  # the wheel on every push/PR and installs it into a clean venv, then runs a
  # CLI smoke command that exercises the packaged-data loaders. Failures here
  # are caught at PR time, not at release time.
  wheel-smoke:
    name: Wheel install smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system deps (cairo)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2-dev libpango1.0-dev libglib2.0-dev pkg-config

      - name: Install build tools
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/fg-smoke-venv
          /tmp/fg-smoke-venv/bin/pip install --upgrade pip
          # Install from the freshly-built wheel — not the source tree —
          # so packaged data inclusion is genuinely exercised.
          /tmp/fg-smoke-venv/bin/pip install dist/*.whl

      - name: Smoke — patterns list (exercises packaged catalog)
        run: |
          /tmp/fg-smoke-venv/bin/framegraph patterns list --has-sidecar --json \
            | python -c "import json, sys; d = json.load(sys.stdin); assert isinstance(d, list) and len(d) > 0, 'patterns list returned no items'; print(f'OK: {len(d)} sidecared patterns from installed wheel')"

      - name: Smoke — render a packaged example (exercises packaged fills)
        run: |
          /tmp/fg-smoke-venv/bin/framegraph patterns example 10 -o /tmp/swot.fill.yml
          /tmp/fg-smoke-venv/bin/framegraph patterns build 10 --fill /tmp/swot.fill.yml -o /tmp/swot.svg
          test -s /tmp/swot.svg || (echo "rendered SVG is empty" && exit 1)
          echo "OK: rendered $(wc -c < /tmp/swot.svg) bytes from installed wheel"

      - name: Smoke — version subcommand matches wheel metadata
        run: |
          INSTALLED=$(/tmp/fg-smoke-venv/bin/framegraph version)
          echo "$INSTALLED"
          # `framegraph version` prints "framegraph X.Y.Z"; verify it parses.
          test "$(echo "$INSTALLED" | awk '{print $1}')" = "framegraph"

  # ── Build + publish (tag-triggered) ────────────────────────────────────────
  publish:
    name: Publish to PyPI
    needs: [golden-snapshots, pytest, lint, wheel-smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url:  https://pypi.org/p/framegraph
    permissions:
      id-token: write   # required for trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install build

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
