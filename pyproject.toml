[build-system]
requires      = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

# ── Project metadata ──────────────────────────────────────────────────────────
[project]
name        = "framegraph"
version     = "2.0.0.dev0"
description = "YAML-first hybrid semantic-visual diagram DSL — renders to SVG"
readme      = "README.md"
license     = {text = "MIT"}
requires-python = ">=3.10"

authors = [
    {name = "Ginga One", email = "eng@ginganone.com.br"},
]

keywords = [
    "diagram", "svg", "yaml", "presentation",
    "consulting", "visualization", "dsl",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]

# ── Runtime dependencies ──────────────────────────────────────────────────────
# Core renderer: PyYAML for ingest, Pydantic for the document schema.
# Optional extras declared below.
dependencies = [
    "PyYAML>=6.0",
    "pydantic>=2.7",
]

# ── Optional extras ───────────────────────────────────────────────────────────
[project.optional-dependencies]

# Required for the golden-snapshot test harness (SP-6) and the unit/integration suite
test = [
    "cairosvg>=2.7",
    "Pillow>=10.0",
    "numpy>=1.26",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
]

# Candidate for v1.4: accurate glyph advance widths from TTF files
# (replaces per-char-class heuristic tables in text_svg)
metrics = [
    "fonttools>=4.50",
]

# Convenience bundle
dev = [
    "framegraph[test,metrics]",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

# ── CLI entry points ──────────────────────────────────────────────────────────
[project.scripts]
framegraph = "framegraph.cli:main"

# ── Package data ──────────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["framegraph*"]

[tool.setuptools.package-data]
framegraph = [
    "lib/tokens/*.yml",
    "lib/symbols/**/*.yml",
    "py.typed",
]

# ── Semver policy (documented here, enforced in CHANGELOG.md) ────────────────
# MAJOR (X.0.0) — schema-breaking change: a v1.x YAML no longer renders
#                 correctly under the new version within the tolerance
#                 defined in tests/tolerance.cfg.
# MINOR (1.X.0) — new YAML keys/object types/renderer features, fully
#                 backward-compatible with all prior MINOR versions in
#                 the same MAJOR series.
# PATCH (X.Y.Z+1) — bug fixes, renderer corrections, documentation updates.
#                 No new YAML surface. Must pass all existing golden snapshots
#                 within tolerance before release.
#
# Release checklist:
#   1. python tests/run_tests.py         — all goldens must pass
#   2. bump version in pyproject.toml + framegraph/__init__.py
#   3. update CHANGELOG.md
#   4. git tag v<VERSION>
#   5. gh release create v<VERSION>      — CI pushes to PyPI on tag push

# ── Ruff (linter + formatter) ────────────────────────────────────────────────
# Rule selection is deliberately tighter than the project default. Notes:
#   D (pydocstyle, Google convention) — enforced on the public package
#     surface; private helpers and the embedded library-composer CLI are
#     opted out via per-file-ignores (see below).
#   PL/PLR/PLW are NOT enabled. The renderer pipeline has legitimate
#     long functions and many literal SVG dimensions; the heuristic
#     pylint-class warnings are noisy on this codebase. Keeping them
#     out of CI lets us re-evaluate per-rule later if a real defect
#     pattern emerges.
#   PLC0415 (import-outside-top-level) is also NOT enabled: cli.py and
#     renderer.py use deferred imports deliberately to keep startup fast.
[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "D"]
ignore = [
    "E501",   # line length — handled by the formatter
    "D203",   # incompatible with D211 (we keep D211: no blank line before class)
    "D213",   # incompatible with D212 (we keep D212: multi-line summary on first line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# `_helpers.py` is the internal pure-helpers module — every export is
# documented at module level, so the per-function D rules add only
# noise. Also exempt from F401 since `Box`/`Point` re-exports are
# legitimate public re-exports for plug-in authors.
"framegraph/_helpers.py" = ["D"]
# `library.py` ships an embedded composer CLI (`cmd_compose`,
# `cmd_list_themes`, …) plus helper functions that we deliberately
# did NOT document in Step 4. Until that work happens, exempt it from D.
"framegraph/library.py" = ["D"]
# Test fixtures and harness scripts: D rules are overkill.
"tests/**" = ["D"]

# ── Mypy ──────────────────────────────────────────────────────────────────────
# Strict mode is enabled. The v2.0 modular-split regression that previously
# blocked it was repaired in commit 1bc5547; the four Protocol delegates
# (`text_svg`, `render_rect`, `eval_length`, `effect_filter_attrs`) are
# implemented on `FrameGraphRenderer`, and per-attribute types in
# `framegraph._types.RendererContext` match the concrete renderer's
# mutable `dict` shapes. Loosening this back to non-strict requires
# explaining what regressed.
[tool.mypy]
python_version         = "3.10"
strict                 = true
ignore_missing_imports = true
warn_unused_ignores    = true

# ── Pytest ────────────────────────────────────────────────────────────────────
# `tests/run_tests.py` is the standalone golden-snapshot harness; it is not
# discovered by pytest so it can keep running independently as
# `python tests/run_tests.py`. Unit + integration tests live under their own
# subdirectories and are the only pytest-discovered tree.
[tool.pytest.ini_options]
testpaths    = ["tests/unit", "tests/integration"]
python_files = ["test_*.py"]
addopts = [
    "-v",
    "--tb=short",
    "--cov=framegraph",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
branch = true
source = ["framegraph"]
omit   = [
    "framegraph/__main__.py",
    "tests/*",
]

[tool.coverage.report]
fail_under   = 90
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]
