# nginx server block for the framegraph documentation portal.
#
# MkDocs renders directory-style URLs (use_directory_urls, the default):
# /guides/manual/ is served from /guides/manual/index.html. The try_files
# rule below resolves those, falling back to the theme's custom 404 page.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    # Compress text assets on the fly.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 256;
    gzip_proxied    any;
    gzip_types      text/plain
                    text/css
                    text/xml
                    application/javascript
                    application/json
                    application/xml+rss
                    image/svg+xml;

    # Resolve directory-style URLs, then fall through to the 404 page.
    location / {
        try_files $uri $uri/ =404;
    }

    # Fingerprinted theme assets are immutable — cache them aggressively.
    location /assets/ {
        expires    30d;
        add_header  Cache-Control "public, max-age=2592000, immutable";
        try_files  $uri =404;
    }

    error_page 404 /404.html;
}
