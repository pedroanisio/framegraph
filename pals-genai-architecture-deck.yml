            - {type: text, id: rs1_r, decorative: true,
               text: "Adversarial consistency testing (ask the same question in multiple framings); calibration benchmarks comparing model outputs to ground truth on a held-out corpus; red-teaming with contrastive prompts designed to elicit agreement.",
