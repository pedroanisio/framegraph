               text: "ERR_CALIBRATION", box: [710, 212, 172, 28], style: tag_w}
            - {type: text, id: rs2_def, decorative: true,
               text: "Expressed confidence misaligned with actual reliability.",
               box: [710, 250, 510, 44], style: body}
            - {type: text, id: rs2_req, decorative: true,
               text: "What reduces (not eliminates) it:",
               box: [710, 304, 510, 22], style: sm_b}
            - {type: text, id: rs2_r, decorative: true,
