               box: [1212, 258, 6, 160], fill: red}
            - {type: rect, id: e3_pill, decorative: true,
               box: [1236, 272, 124, 28], fill: dark, radius: 6}
            - {type: text, id: e3_pillt, decorative: true,
               text: "ERR_SCHEMA", box: [1236, 272, 124, 28], style: tag_w}
            - {type: text, id: e3_def, decorative: true,
               text: "Output does not conform to any declared structural contract. Field names, types, or cardinality are wrong. Most trivially eliminated by moving to the structured channel.",
               box: [1236, 308, 510, 96], style: sm_ink}

            # ERR_TRUNCATION
            - {type: rect, id: e4_bg, decorative: true,
               box: [80, 440, 546, 160], fill: panel, radius: 10}
            - {type: rect, id: e4_bar, decorative: true,
               box: [80, 440, 6, 160], fill: red}
            - {type: rect, id: e4_pill, decorative: true,
               box: [104, 454, 158, 28], fill: dark, radius: 6}
            - {type: text, id: e4_pillt, decorative: true,
               text: "ERR_TRUNCATION", box: [104, 454, 158, 28], style: tag_w}
            - {type: text, id: e4_def, decorative: true,
               text: "Output cut short without any signal. No error code. No continuation prompt. The downstream consumer cannot distinguish a complete response from a truncated one.",
               box: [104, 490, 510, 96], style: sm_ink}

            # ERR_SYCOPHANCY
            - {type: rect, id: e5_bg, decorative: true,
               box: [646, 440, 546, 160], fill: panel, radius: 10}
            - {type: rect, id: e5_bar, decorative: true,
               box: [646, 440, 6, 160], fill: red}
            - {type: rect, id: e5_pill, decorative: true,
               box: [670, 454, 160, 28], fill: dark, radius: 6}
            - {type: text, id: e5_pillt, decorative: true,
               text: "ERR_SYCOPHANCY", box: [670, 454, 160, 28], style: tag_w}
            - {type: text, id: e5_def, decorative: true,
               text: "Output shaped by perceived user preference rather than truth. The model optimizes for approval. Not detectable by schema, logic, or range checks — ever.",
               box: [670, 490, 510, 96], style: sm_ink}

            # ERR_INSTRUCTION
            - {type: rect, id: e6_bg, decorative: true,
               box: [1212, 440, 546, 160], fill: panel, radius: 10}
            - {type: rect, id: e6_bar, decorative: true,
               box: [1212, 440, 6, 160], fill: red}
            - {type: rect, id: e6_pill, decorative: true,
               box: [1236, 454, 162, 28], fill: dark, radius: 6}
            - {type: text, id: e6_pillt, decorative: true,
               text: "ERR_INSTRUCTION", box: [1236, 454, 162, 28], style: tag_w}
            - {type: text, id: e6_def, decorative: true,
               text: "Explicit prompt constraints violated. The model produced something it was told not to, or failed to produce something it was told to produce.",
               box: [1236, 490, 510, 96], style: sm_ink}

            # ERR_CALIBRATION
            - {type: rect, id: e7_bg, decorative: true,
               box: [80, 622, 546, 160], fill: panel, radius: 10}
            - {type: rect, id: e7_bar, decorative: true,
               box: [80, 622, 6, 160], fill: red}
            - {type: rect, id: e7_pill, decorative: true,
               box: [104, 636, 172, 28], fill: dark, radius: 6}
            - {type: text, id: e7_pillt, decorative: true,
               text: "ERR_CALIBRATION", box: [104, 636, 172, 28], style: tag_w}
            - {type: text, id: e7_def, decorative: true,
               text: "Expressed confidence misaligned with actual reliability. The model says it is certain; it is not. ε not computable in general for this class.",
               box: [104, 672, 510, 96], style: sm_ink}

            # ERR_REASONING
            - {type: rect, id: e8_bg, decorative: true,
               box: [646, 622, 546, 160], fill: panel, radius: 10}
            - {type: rect, id: e8_bar, decorative: true,
               box: [646, 622, 6, 160], fill: red}
            - {type: rect, id: e8_pill, decorative: true,
               box: [670, 636, 162, 28], fill: dark, radius: 6}
            - {type: text, id: e8_pillt, decorative: true,
               text: "ERR_REASONING", box: [670, 636, 162, 28], style: tag_w}
            - {type: text, id: e8_def, decorative: true,
               text: "Correct facts, invalid composition. The logical steps do not support the conclusion. Partially catchable only when cross-field constraints are explicitly declared.",
               box: [670, 672, 510, 96], style: sm_ink}

            # ERR_SEMANTIC
            - {type: rect, id: e9_bg, decorative: true,
               box: [1212, 622, 546, 160], fill: panel, radius: 10}
            - {type: rect, id: e9_bar, decorative: true,
               box: [1212, 622, 6, 160], fill: red}
            - {type: rect, id: e9_pill, decorative: true,
               box: [1236, 636, 148, 28], fill: dark, radius: 6}
            - {type: text, id: e9_pillt, decorative: true,
               text: "ERR_SEMANTIC", box: [1236, 636, 148, 28], style: tag_w}
            - {type: text, id: e9_def, decorative: true,
               text: "Correct surface form, wrong meaning. The output is schema-valid and logically consistent but fails to represent the intended referent. Resistant to full automation.",
               box: [1236, 672, 510, 96], style: sm_ink}

        - id: verdict
          z: 4
          objects:
            - {type: rect, id: v_bg, decorative: true,
               box: [80, 816, 1760, 82], fill: red_s, radius: 8}
            - {type: text, id: v_t, decorative: true,
               text: "Human review is not a fallback — it is the only verification layer. All nine error classes carry the same detection cost. No error class is cheaper to detect on the free form channel than any other.",
               box: [110, 830, 1710, 54], style: body}

  # ═══════════════════════════════════════════════════════════════════════
  # 4  STRUCTURED CHANNEL — SCHEMA + INSTANCE
  # ═══════════════════════════════════════════════════════════════════════
  - slide: 4
    id: structured_channel
    title: "Structured Channel — Instance + Schema"
    notes: "Schema conformance narrows the error space but does not close it. The word 'constrains' is precise: it moves the error problem from the structural layer to the semantic layer. ERR_HALLUCINATION, ERR_REASONING, and ERR_SEMANTIC persist regardless of schema quality."
    visual:
      layers:
        - id: bg
          z: 0
          objects:
            - {type: rect, id: bg_fill,  decorative: true, box: [0, 0, 1920, 1080], fill: bg}
            - {type: rect, id: left_bar, decorative: true, box: [0, 0, 8, 1080],    fill: amber}
            - {type: rect, id: channel_band, decorative: true,
               box: [0, 0, 1920, 8], fill: amber}

        - id: header
          z: 1
          objects:
            - {type: text, id: stitle, decorative: true,
               text: "Structured Channel — Instance + Schema",
               box: [80, 56, 1400, 58], style: stitle}
            - {type: rect, id: rule, decorative: true,
               box: [80, 116, 56, 3], fill: amber}
            - {type: rect, id: status_pill, decorative: true,
               box: [1500, 58, 340, 44], fill: amber, radius: 22}
            - {type: text, id: status_t, decorative: true,
               text: "Error space constrained to semantic layer",
               box: [1500, 58, 340, 44], style: lbl_w}

        - id: description
          z: 2
          objects:
            - {type: rect, id: desc_bg, decorative: true,
               box: [80, 136, 1760, 90], fill: amber_s, radius: 10}
            - {type: rect, id: desc_bar, decorative: true,
               box: [80, 136, 6, 90], fill: amber}
            - {type: text, id: desc_t, decorative: true,
               text: "Schema conformance eliminates ERR_SCHEMA by construction and reduces exposure to ERR_OMISSION, ERR_TRUNCATION, and ERR_INSTRUCTION when constraints are explicitly declared. Deviations are constrained to the semantic level. Machine readability narrows the error space; it does not close it.",
               box: [110, 150, 1710, 62], style: body}

        - id: two_cols
          z: 3
          objects:
            # LEFT: what schema eliminates / reduces
            - {type: rect, id: elim_bg, decorative: true,
               box: [80, 258, 840, 700], fill: panel, radius: 12}
            - {type: rect, id: elim_topbar, decorative: true,
               box: [80, 258, 840, 64], fill: green, radius: 8}
            - {type: text, id: elim_h, decorative: true,
               text: "What schema conformance removes or reduces",
               box: [104, 258, 800, 64], style: ctr_w}

            - {type: rect, id: ee1, decorative: true, box: [104, 342, 790, 110], fill: green_s, radius: 8}
            - {type: rect, id: ee1b, decorative: true, box: [104, 342, 5, 110], fill: green}
            - {type: rect, id: ee1_pill, decorative: true, box: [120, 356, 124, 26], fill: green, radius: 6}
            - {type: text, id: ee1_pt, decorative: true,
               text: "ERR_SCHEMA", box: [120, 356, 124, 26], style: tag_w}
            - {type: text, id: ee1_t, decorative: true,
               text: "Eliminated by construction. A schema-valid instance cannot carry ERR_SCHEMA. This is the one class the structured channel removes categorically.",
               box: [120, 390, 760, 54], style: sm_ink}

            - {type: rect, id: ee2, decorative: true, box: [104, 462, 790, 110], fill: green_s, radius: 8}
            - {type: rect, id: ee2b, decorative: true, box: [104, 462, 5, 110], fill: green}
            - {type: rect, id: ee2_pill, decorative: true, box: [120, 476, 140, 26], fill: green, radius: 6}
            - {type: text, id: ee2_pt, decorative: true,
               text: "ERR_OMISSION", box: [120, 476, 140, 26], style: tag_w}
            - {type: text, id: ee2_t, decorative: true,
               text: "Reduced when required fields are declared. Missing required fields produce schema validation failures — but schema-optional fields remain invisible if omitted.",
               box: [120, 510, 760, 54], style: sm_ink}

            - {type: rect, id: ee3, decorative: true, box: [104, 582, 790, 110], fill: green_s, radius: 8}
            - {type: rect, id: ee3b, decorative: true, box: [104, 582, 5, 110], fill: green}
            - {type: rect, id: ee3_pill, decorative: true, box: [120, 596, 158, 26], fill: green, radius: 6}
            - {type: text, id: ee3_pt, decorative: true,
               text: "ERR_TRUNCATION", box: [120, 596, 158, 26], style: tag_w}
            - {type: text, id: ee3_t, decorative: true,
               text: "Reduced when completeness is declared via required fields with minimum-length constraints. Structural completeness checks catch output cut short at the field level.",
               box: [120, 630, 760, 54], style: sm_ink}

            - {type: rect, id: ee4, decorative: true, box: [104, 702, 790, 110], fill: green_s, radius: 8}
            - {type: rect, id: ee4b, decorative: true, box: [104, 702, 5, 110], fill: green}
            - {type: rect, id: ee4_pill, decorative: true, box: [120, 716, 162, 26], fill: green, radius: 6}
            - {type: text, id: ee4_pt, decorative: true,
               text: "ERR_INSTRUCTION", box: [120, 716, 162, 26], style: tag_w}
            - {type: text, id: ee4_t, decorative: true,
               text: "Partially reduced when prompt constraints are encoded as schema rules (e.g. enums, allowed values, pattern constraints). Constraints not expressible in the schema remain undetectable.",
               box: [120, 750, 760, 54], style: sm_ink}

            # RIGHT: what persists
            - {type: rect, id: pers_bg, decorative: true,
               box: [1000, 258, 840, 700], fill: panel, radius: 12}
            - {type: rect, id: pers_topbar, decorative: true,
               box: [1000, 258, 840, 64], fill: red, radius: 8}
            - {type: text, id: pers_h, decorative: true,
               text: "What persists regardless of schema quality",
               box: [1024, 258, 800, 64], style: ctr_w}

            - {type: rect, id: pe1, decorative: true, box: [1024, 342, 790, 110], fill: red_s, radius: 8}
            - {type: rect, id: pe1b, decorative: true, box: [1024, 342, 5, 110], fill: red}
            - {type: rect, id: pe1_pill, decorative: true, box: [1040, 356, 186, 26], fill: dark, radius: 6}
            - {type: text, id: pe1_pt, decorative: true,
               text: "ERR_HALLUCINATION", box: [1040, 356, 186, 26], style: tag_w}
            - {type: text, id: pe1_t, decorative: true,
               text: "A schema-valid instance can carry fabricated values in every field. ERR_HALLUCINATION is orthogonal to structural conformance. The schema says nothing about whether values are true.",
               box: [1040, 390, 760, 54], style: sm_ink}

            - {type: rect, id: pe2, decorative: true, box: [1024, 462, 790, 110], fill: red_s, radius: 8}
            - {type: rect, id: pe2b, decorative: true, box: [1024, 462, 5, 110], fill: red}
            - {type: rect, id: pe2_pill, decorative: true, box: [1040, 476, 162, 26], fill: dark, radius: 6}
            - {type: text, id: pe2_pt, decorative: true,
               text: "ERR_REASONING", box: [1040, 476, 162, 26], style: tag_w}
            - {type: text, id: pe2_t, decorative: true,
               text: "Internally contradictory fields can all be individually schema-valid. Cross-field logical consistency is not a schema-level property — it requires a validator with domain rules.",
               box: [1040, 510, 760, 54], style: sm_ink}

            - {type: rect, id: pe3, decorative: true, box: [1024, 582, 790, 110], fill: red_s, radius: 8}
            - {type: rect, id: pe3b, decorative: true, box: [1024, 582, 5, 110], fill: red}
            - {type: rect, id: pe3_pill, decorative: true, box: [1040, 596, 148, 26], fill: dark, radius: 6}
            - {type: text, id: pe3_pt, decorative: true,
               text: "ERR_SEMANTIC", box: [1040, 596, 148, 26], style: tag_w}
            - {type: text, id: pe3_t, decorative: true,
               text: "Correct surface form, wrong meaning. Schema-valid fields can describe the wrong referent entirely. ε is not computable in general for this class.",
               box: [1040, 630, 760, 54], style: sm_ink}

            - {type: rect, id: pe4, decorative: true, box: [1024, 702, 790, 110], fill: red_s, radius: 8}
            - {type: rect, id: pe4b, decorative: true, box: [1024, 702, 5, 110], fill: red}
            - {type: rect, id: pe4_pill, decorative: true, box: [1040, 716, 160, 26], fill: dark, radius: 6}
            - {type: text, id: pe4_pt, decorative: true,
               text: "ERR_SYCOPHANCY", box: [1040, 716, 160, 26], style: tag_w}
            - {type: text, id: pe4_t, decorative: true,
               text: "Schema-valid sycophantic output is indistinguishable from schema-valid truthful output at the structural level. This class is permanently invisible to schema validation.",
               box: [1040, 750, 760, 54], style: sm_ink}

        - id: verdict
          z: 4
          objects:
            - {type: rect, id: v_bg, decorative: true,
               box: [80, 980, 1760, 68], fill: amber_s, radius: 8}
            - {type: text, id: v_t, decorative: true,
               text: "Machine readability enables verification. Schema conformance bounds the error space to the semantic layer. It does not close it.",
               box: [110, 992, 1710, 44], style: body}

  # ═══════════════════════════════════════════════════════════════════════
  # 5  VALIDATOR — THE VERIFICATION BOUNDARY
  # ═══════════════════════════════════════════════════════════════════════
  - slide: 5
    id: validator
    title: "Validator — The Verification Boundary"
    notes: "The validator is the only node in this architecture capable of programmatically rejecting GenAI output. Emphasise 'programmatically' — human review can also reject, but the validator is the only automated boundary. The residual (ERR_SEMANTIC, ERR_SYCOPHANCY, ERR_CALIBRATION) is not a validator limitation — it is a theoretical limit."
    visual:
      layers:
        - id: bg
          z: 0
          objects:
            - {type: rect, id: bg_fill,  decorative: true, box: [0, 0, 1920, 1080], fill: bg}
            - {type: rect, id: left_bar, decorative: true, box: [0, 0, 8, 1080],    fill: green}
            - {type: rect, id: channel_band, decorative: true,
               box: [0, 0, 1920, 8], fill: green}

        - id: header
          z: 1
          objects:
            - {type: text, id: stitle, decorative: true,
               text: "Validator — The Verification Boundary",
               box: [80, 56, 1300, 58], style: stitle}
            - {type: rect, id: rule, decorative: true,
               box: [80, 116, 56, 3], fill: green}
            - {type: rect, id: status_pill, decorative: true,
               box: [1540, 58, 300, 44], fill: green, radius: 22}
            - {type: text, id: status_t, decorative: true,
               text: "Only automated boundary",
               box: [1540, 58, 300, 44], style: lbl_w}

        - id: definition
          z: 2
          objects:
            - {type: rect, id: def_bg, decorative: true,
               box: [80, 136, 1760, 90], fill: green_s, radius: 10}
            - {type: rect, id: def_bar, decorative: true,
               box: [80, 136, 6, 90], fill: green}
            - {type: text, id: def_t, decorative: true,
               text: "The Validator is the only node in this architecture capable of programmatically rejecting GenAI output. By encoding domain rules, cross-field constraints, and value-range checks, it extends coverage into classes that schema alone cannot reach. It produces auditable output — not provably correct output.",
               box: [110, 150, 1710, 62], style: body}

        - id: coverage_table
          z: 3
          objects:
            # LEFT: what validator covers
            - {type: rect, id: cov_bg, decorative: true,
               box: [80, 258, 760, 710], fill: panel, radius: 12}
            - {type: rect, id: cov_top, decorative: true,
               box: [80, 258, 760, 64], fill: green, radius: 8}
            - {type: text, id: cov_h, decorative: true,
               text: "Coverage added by the Validator",
               box: [104, 258, 720, 64], style: ctr_w}

            - {type: rect, id: cv1, decorative: true, box: [104, 342, 710, 100], fill: green_s, radius: 8}
            - {type: rect, id: cv1b, decorative: true, box: [104, 342, 5, 100], fill: green}
            - {type: rect, id: cv1_pill, decorative: true, box: [120, 356, 162, 26], fill: green, radius: 6}
            - {type: text, id: cv1_pt, decorative: true,
               text: "ERR_INSTRUCTION", box: [120, 356, 162, 26], style: tag_w}
            - {type: text, id: cv1_t, decorative: true,
               text: "Fully covered when prompt constraints are encoded as validator rules. The validator can programmatically reject outputs that violate declared constraints.",
               box: [120, 390, 680, 44], style: sm_ink}

            - {type: rect, id: cv2, decorative: true, box: [104, 452, 710, 100], fill: green_s, radius: 8}
            - {type: rect, id: cv2b, decorative: true, box: [104, 452, 5, 100], fill: green}
            - {type: rect, id: cv2_pill, decorative: true, box: [120, 466, 186, 26], fill: green, radius: 6}
            - {type: text, id: cv2_pt, decorative: true,
               text: "ERR_HALLUCINATION (partial)", box: [120, 466, 186, 26], style: tag_w}
            - {type: text, id: cv2_t, decorative: true,
               text: "Enum and value-range checks catch obvious fabrications. A validator can reject outputs where a field value is not in the declared allowed set. The semantic core remains unreachable.",
               box: [120, 500, 680, 44], style: sm_ink}

            - {type: rect, id: cv3, decorative: true, box: [104, 562, 710, 100], fill: green_s, radius: 8}
            - {type: rect, id: cv3b, decorative: true, box: [104, 562, 5, 100], fill: green}
            - {type: rect, id: cv3_pill, decorative: true, box: [120, 576, 162, 26], fill: green, radius: 6}
            - {type: text, id: cv3_pt, decorative: true,
               text: "ERR_REASONING (partial)", box: [120, 576, 162, 26], style: tag_w}
            - {type: text, id: cv3_t, decorative: true,
               text: "Cross-field logical consistency rules can catch detectable contradictions: a start date after an end date, a total that does not sum its parts.",
               box: [120, 610, 680, 44], style: sm_ink}

            - {type: rect, id: cv4, decorative: true, box: [104, 672, 710, 100], fill: green_s, radius: 8}
            - {type: rect, id: cv4b, decorative: true, box: [104, 672, 5, 100], fill: green}
            - {type: rect, id: cv4_pill, decorative: true, box: [120, 686, 140, 26], fill: green, radius: 6}
            - {type: text, id: cv4_pt, decorative: true,
               text: "ERR_OMISSION", box: [120, 686, 140, 26], style: tag_w}
            - {type: text, id: cv4_t, decorative: true,
               text: "Completeness rules extended beyond schema-required fields. The validator can enforce domain-level completeness not expressible in a structural schema.",
               box: [120, 720, 680, 44], style: sm_ink}

            - {type: rect, id: cv5, decorative: true, box: [104, 782, 710, 100], fill: green_s, radius: 8}
            - {type: rect, id: cv5b, decorative: true, box: [104, 782, 5, 100], fill: green}
            - {type: rect, id: cv5_pill, decorative: true, box: [120, 796, 124, 26], fill: green, radius: 6}
            - {type: text, id: cv5_pt, decorative: true,
               text: "ERR_SCHEMA", box: [120, 796, 124, 26], style: tag_w}
            - {type: text, id: cv5_t, decorative: true,
               text: "Structural conformance re-confirmed at the validation boundary, even when schema enforcement is not enforced upstream. The validator is authoritative.",
               box: [120, 830, 680, 44], style: sm_ink}

            # RIGHT: permanent residual
            - {type: rect, id: res_bg, decorative: true,
               box: [900, 258, 940, 710], fill: panel, radius: 12}
            - {type: rect, id: res_top, decorative: true,
               box: [900, 258, 940, 64], fill: red, radius: 8}
            - {type: text, id: res_h, decorative: true,
               text: "Permanent residual — not addressable by any validator",
               box: [924, 258, 900, 64], style: ctr_w}

            - {type: text, id: res_intro, decorative: true,
               text: "These three classes are resistant to full automation regardless of validator sophistication. The error predicate ε is not computable in general for any of them. This is not an engineering gap — it is a theoretical limit.",
               box: [924, 342, 890, 90], style: body}

            - {type: rect, id: rr1, decorative: true, box: [924, 448, 890, 130], fill: red_s, radius: 8}
            - {type: rect, id: rr1b, decorative: true, box: [924, 448, 5, 130], fill: red}
            - {type: rect, id: rr1_pill, decorative: true, box: [940, 462, 148, 26], fill: dark, radius: 6}
            - {type: text, id: rr1_pt, decorative: true,
               text: "ERR_SEMANTIC", box: [940, 462, 148, 26], style: tag_w}
            - {type: text, id: rr1_t, decorative: true,
               text: "A validator can confirm that a field contains a valid string that matches a pattern. It cannot confirm that the string refers to the correct real-world entity. Meaning is not decidable from structure.",
               box: [940, 496, 860, 70], style: sm_ink}

            - {type: rect, id: rr2, decorative: true, box: [924, 590, 890, 130], fill: red_s, radius: 8}
            - {type: rect, id: rr2b, decorative: true, box: [924, 590, 5, 130], fill: red}
            - {type: rect, id: rr2_pill, decorative: true, box: [940, 604, 160, 26], fill: dark, radius: 6}
            - {type: text, id: rr2_pt, decorative: true,
               text: "ERR_SYCOPHANCY", box: [940, 604, 160, 26], style: tag_w}
            - {type: text, id: rr2_t, decorative: true,
               text: "A validator has no access to the optimization objective that shaped the model's output. It cannot distinguish approval-seeking from truth-seeking outputs. Requires adversarial probing or domain-expert review.",
               box: [940, 638, 860, 70], style: sm_ink}

            - {type: rect, id: rr3, decorative: true, box: [924, 732, 890, 130], fill: red_s, radius: 8}
            - {type: rect, id: rr3b, decorative: true, box: [924, 732, 5, 130], fill: red}
            - {type: rect, id: rr3_pill, decorative: true, box: [940, 746, 172, 26], fill: dark, radius: 6}
            - {type: text, id: rr3_pt, decorative: true,
               text: "ERR_CALIBRATION", box: [940, 746, 172, 26], style: tag_w}
            - {type: text, id: rr3_t, decorative: true,
               text: "Confidence is an intrinsic property of the model's output distribution. A validator receives only the output token, not the distribution it was drawn from. Misaligned confidence is invisible at the output boundary.",
