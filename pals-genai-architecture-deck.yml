            # ERR_CALIBRATION
            - {type: rect, id: rs2, decorative: true,
               box: [686, 196, 546, 260], fill: purple_s, radius: 12}
            - {type: rect, id: rs2b, decorative: true, box: [686, 196, 6, 260], fill: purple}
