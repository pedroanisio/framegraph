            - {type: text, id: c5_pt, decorative: true,
               text: "Corollary 5", box: [1016, 572, 150, 26], style: tag_w}
            - {type: text, id: c5_t, decorative: true,
               text: "Deploying a more capable model without upgrading the verifier is an architectural regression. More capable models produce more plausible outputs in the hardest-to-detect classes. The residual widens unless the verifier is co-evolved with the model.",
