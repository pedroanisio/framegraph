dsl: FrameGraph
version: '1.2'
kind: presentation-deck
deck:
  canvas:
    size:
    - 1280
    - 1000
    units: px
  tokens:
    colors:
      bg: '#FFFFFF'
      title_color: '#1A2B3E'
      kicker_color: '#9A9A9A'
      dot_primary: '#E51A4C'
      dot_secondary: '#1A2B3E'
      dot_tertiary: '#C8C8C8'
      header_fill: '#1A56B0'
      leaf_fill: '#FFFFFF'
      outline_core: '#1A56B0'
      outline_extended: '#7FBA3A'
      outline_future: '#7FBA3A'
      header_text_color: '#FFFFFF'
      leaf_text_color: '#1A2B3E'
      page_number_color: '#9A9A9A'
    fonts:
      primary: Century Gothic, Avenir Next, Avenir, Futura, Arial, sans-serif
    text_styles:
      honeycomb_title:
        font: primary
        size: 32
        weight: 400
        color: title_color
        align: left
        v_align: top
        line_height: 38
        wrap: true
      honeycomb_kicker:
        font: primary
        size: 18
        weight: 400
        color: kicker_color
        align: left
        v_align: middle
      honeycomb_header_text:
        font: primary
        size: 13
        weight: 700
        color: header_text_color
        align: center
        v_align: middle
        line_height: 16
        wrap: true
      honeycomb_leaf_text:
        font: primary
        size: 12
        weight: 400
        color: leaf_text_color
        align: center
        v_align: middle
        line_height: 14
        wrap: true
      honeycomb_page_number:
        font: primary
        size: 11
        weight: 400
        color: page_number_color
        align: center
        v_align: middle
  symbols:
    hex_header:
      box:
      - 0
      - 0
      - 150
      - 130
      slots:
      - label
      objects:
      - type: path
        id: hex
        d: M 150 65 L 112.5 130 L 37.5 130 L 0 65 L 37.5 0 L 112.5 0 Z
        fill: $header_fill
        stroke:
          color: $header_fill
          width: 1
      - type: text
        id: label_text
        box:
        - 22
        - 28
        - 106
        - 76
        text: $label
        style: honeycomb_header_text
    hex_leaf_solid:
      box:
      - 0
      - 0
      - 150
      - 130
      slots:
      - label
      objects:
      - type: path
        id: hex
        d: M 150 65 L 112.5 130 L 37.5 130 L 0 65 L 37.5 0 L 112.5 0 Z
        fill: $leaf_fill
        stroke:
          color: $outline_color
          width: 3
      - type: text
        id: label_text
        box:
        - 22
        - 28
        - 106
        - 76
        text: $label
        style: honeycomb_leaf_text
    hex_leaf_dashed:
      box:
      - 0
      - 0
      - 150
      - 130
      slots:
      - label
      objects:
      - type: path
        id: hex
        d: M 150 65 L 112.5 130 L 37.5 130 L 0 65 L 37.5 0 L 112.5 0 Z
        fill: $leaf_fill
        stroke:
          color: $outline_color
          width: 3
          dash:
          - 6
          - 4
      - type: text
        id: label_text
        box:
        - 22
        - 28
        - 106
        - 76
        text: $label
        style: honeycomb_leaf_text
slides:
- slide: 1
  id: s_honeycomb
  title: Expected Functional and Technical Coverage of the Solution
  description: Overall Scope
  visual:
    layers:
    - id: honeycomb
      z: 10
      objects:
      - type: ellipse
        id: dot_primary
        box:
        - 22
        - 14
        - 18
        - 18
        fill: dot_primary
      - type: ellipse
        id: dot_secondary
        box:
        - 22
        - 44
        - 18
        - 18
        fill: dot_secondary
      - type: ellipse
        id: dot_tertiary
        box:
        - 22
        - 92
        - 18
        - 18
        fill: dot_tertiary
      - type: text
        id: title
        box:
        - 60
        - 12
        - 1200
        - 56
        text: Expected Functional and Technical Coverage of the Solution
        style: honeycomb_title
      - type: text
        id: kicker
        box:
        - 60
        - 88
        - 1200
        - 24
        text: Overall Scope
        style: honeycomb_kicker
