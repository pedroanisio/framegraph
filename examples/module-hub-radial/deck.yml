        - 50
        - 40
        fill: '#FFFFFF'
        stroke:
          color: $outline_color
          width: 0.5
        radius: 2
      - type: text
        id: icon_glyph
        box:
        - 50
        - 45
        - 50
        - 40
        text: €
        style: module_icon_money
