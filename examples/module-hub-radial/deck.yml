dsl: FrameGraph
version: '1.2'
kind: presentation-deck
deck:
  canvas:
    size:
    - 1280
    - 900
    units: px
  tokens:
    colors:
      bg: '#FFFFFF'
      title_color: '#1A2B3E'
      kicker_color: '#9A9A9A'
      dot_primary: '#E51A4C'
      dot_secondary: '#1A2B3E'
      dot_tertiary: '#C8C8C8'
      edge_color: '#C8C8C8'
      page_number_color: '#9A9A9A'
      _c_17273: '#9E1A8C'
      _c_89053: '#E58938'
      _c_02524: '#1F7A1F'
      _c_11783: '#2B5C2B'
      _c_27214: '#1C6B8A'
      _c_88850: '#9A9A9A'
      _c_26559: '#6B2EA8'
      _c_53116: '#E89A6A'
      _c_94968: '#E690A8'
      _c_64986: '#26A4D8'
    fonts:
      primary: Century Gothic, Avenir Next, Avenir, Futura, Arial, sans-serif
    text_styles:
      module_title:
        font: primary
        size: 32
        weight: 400
        color: title_color
        align: left
        v_align: top
        line_height: 38
        wrap: true
      module_kicker:
        font: primary
        size: 18
        weight: 400
        color: kicker_color
        align: left
        v_align: middle
      module_hub_label:
        font: primary
        size: 30
        weight: 400
        color: '#E58938'
        align: center
        v_align: middle
        line_height: 36
        wrap: true
      module_hub_detail_heading:
        font: primary
        size: 16
        weight: 700
        color: '#9E1A8C'
        align: left
        v_align: top
      module_hub_detail_bullets:
        font: primary
        size: 13
        weight: 400
        color: '#1A2B3E'
        align: left
        v_align: top
        line_height: 18
      module_sat_label_center:
        font: primary
        size: 14
        weight: 400
        color: '#1A2B3E'
        align: center
        v_align: middle
        line_height: 18
        wrap: true
      module_sat_label_left:
        font: primary
        size: 14
        weight: 400
        color: '#1A2B3E'
        align: left
        v_align: middle
        line_height: 18
        wrap: true
      module_sat_label_right:
        font: primary
        size: 14
        weight: 400
        color: '#1A2B3E'
        align: right
        v_align: middle
        line_height: 18
        wrap: true
      module_icon_warning:
        font: primary
        size: 22
        weight: 700
        color: '#1A1A1A'
        align: center
        v_align: middle
      module_icon_excel:
        font: primary
        size: 24
        weight: 700
        color: '#FFFFFF'
        align: center
        v_align: middle
      module_icon_money:
        font: primary
        size: 22
        weight: 700
        color: '#1A2B3E'
        align: center
        v_align: middle
      module_page_number:
        font: primary
        size: 11
        weight: 400
        color: page_number_color
        align: center
        v_align: middle
  symbols:
    hex_node_plain:
      box:
      - 0
      - 0
      - 150
      - 130
      slots: []
      objects:
      - type: path
        id: hex
        d: M 150 65 L 112.5 130 L 37.5 130 L 0 65 L 37.5 0 L 112.5 0 Z
        fill: $fill
        stroke:
          color: $outline_color
          width: 4
    hex_node_warning:
      box:
      - 0
      - 0
      - 150
      - 130
      slots: []
      objects:
      - type: path
        id: hex
        d: M 150 65 L 112.5 130 L 37.5 130 L 0 65 L 37.5 0 L 112.5 0 Z
        fill: $fill
        stroke:
          color: $outline_color
          width: 4
      - type: rect
        id: icon_plate
        box:
        - 50
        - 45
        - 50
        - 40
        fill: '#EFEFEF'
        stroke:
          color: '#CCCCCC'
          width: 0.5
        radius: 2
      - type: text
        id: icon_glyph
        box:
        - 50
        - 45
        - 50
        - 40
        text: '!'
        style: module_icon_warning
    hex_node_excel:
