# MkDocs configuration for the framegraph documentation portal.
#
# The `docs/portal/` source tree is a BUILD ARTIFACT — generated by
# `python -m framegraph._docsite.build` (run by `make portal`) from the
# package's own docstrings, Pydantic schemas, and bundled examples. Do
# not edit files under docs/portal/ by hand; edit the docstrings instead.
site_name: framegraph
site_description: >-
  YAML-first DSL for semantic-visual diagrams and presentations —
  renders to clean SVG / PDF.
site_url: https://pedroanisio.github.io/framegraph/
repo_url: https://github.com/pedroanisio/framegraph
repo_name: pedroanisio/framegraph
copyright: >-
  Generated from source docstrings via a deterministic, CI-drift-checked
  pipeline. No statement unbacked by a verifiable reference should be
  taken for granted (see DISCLAIMER.md).

docs_dir: docs/portal
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables

# The generated reference pages use only well-formed relative links; the
# imported narrative guides may carry repo-relative links that point
# outside docs_dir, so link checks are downgraded to avoid failing the
# strict build on imported prose. Nav/file-coverage checks stay strict.
validation:
  omitted_files: warn
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: ignore
    absolute_links: ignore
    unrecognized_links: ignore

nav:
  - Home: index.md
  - Guides:
      - Manual: guides/manual.md
      - Authoring fills: guides/authoring-fills.md
      - Publishing: guides/publishing.md
  - Reference:
      - API:
          - Overview: reference/api/index.md
          - framegraph: reference/api/framegraph.md
          - framegraph._schema: reference/api/framegraph-_schema.md
          - framegraph._uml: reference/api/framegraph-_uml.md
          - framegraph._patterns: reference/api/framegraph-_patterns.md
          - framegraph.uml: reference/api/framegraph-uml.md
          - framegraph.layout: reference/api/framegraph-layout.md
      - Schema: reference/schema.md
      - CLI: reference/cli.md
  - Gallery: gallery/index.md
