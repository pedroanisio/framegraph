               slide_title: "repository_summary — sequence diagram (UML)",
               slide_subtitle: "MCP tool dispatch · handlers.py L284–L394 · delegates into frontend/backend/app.py:load_bundle  (verified via cbm file_detail)",
               slide_num: "13"}

        - id: panel
          z: 5
          objects:
            - {type: rect, id: bg, decorative: true, box: [60,140,1800,810],
               fill: uml_panel, stroke: {color: uml_panel_border, width: 0.6}, radius: 6}

        # Lifelines — 5 columns
        - id: lifelines
          z: 10
          objects:
            - {type: uml.lifeline, id: AgentLL,
               box: [120, 170, 220, 720],
               name: ":Agent", actor: true, head_height: 70}

            - {type: uml.lifeline, id: SrvLL,
               box: [420, 170, 240, 720],
