  # ── Slide 11 — UML Class diagram of host-layer dataclasses ───────────
  - id: 11-uml-class
    slide: 12
    title: "Host-layer class diagram (UML)"
    description: "codebase_mapper/models.py: the pure data hub (deg 25, 0 out, 25 in)."
    visual:
      layers:

        - id: chrome
          z: 0
          objects:
            - {type: use, id: ch, decorative: true, symbol: uml_chrome, box: [0,0,1920,1080],
               slide_title: "Host-layer class diagram (UML)",
               slide_subtitle: "models.py — pure dataclasses; FileRecord is the aggregate root, every `*Edge` references files by path",
               slide_num: "12"}

        - id: panel
          z: 5
          objects:
            - {type: rect, id: bg, decorative: true, box: [60,140,1800,810],
               fill: uml_panel, stroke: {color: uml_panel_border, width: 0.6}, radius: 6}

        - id: classes
          z: 10
          objects:
            # ── Aggregate root: FileRecord (top center)
            - type: uml.classifier_box
              id: FileRecord
              box: [780, 180, 360, 240]
              name: FileRecord
              stereotype: dataclass
              attributes:
                - {name: path,          type: str}
                - {name: uri,           type: str}
                - {name: language,      type: "str | None"}
                - {name: type,          type: str}
                - {name: size,          type: int}
                - {name: contentSha256, type: str}
                - {name: importsOut,    type: "list[str]"}
                - {name: importsIn,     type: "list[str]"}

            # ── Edge family: ImportEdge / ImportExternalEdge / DeclaresDependencyEdge / PinsDependencyEdge
            - type: uml.classifier_box
              id: ImportEdge
              box: [80, 470, 260, 110]
              name: ImportEdge
              stereotype: dataclass
              attributes:
                - {name: source, type: str}
                - {name: target, type: str}

            - type: uml.classifier_box
              id: ImportExternalEdge
              box: [380, 470, 280, 110]
              name: ImportExternalEdge
              stereotype: dataclass
              attributes:
                - {name: source,  type: str}
                - {name: package, type: str}

            - type: uml.classifier_box
              id: DeclaresDependencyEdge
              box: [700, 470, 280, 110]
              name: DeclaresDependencyEdge
              stereotype: dataclass
              attributes:
                - {name: manifest, type: str}
                - {name: package,  type: str}

            - type: uml.classifier_box
              id: PinsDependencyEdge
              box: [1020, 470, 280, 110]
              name: PinsDependencyEdge
              stereotype: dataclass
              attributes:
                - {name: lockfile, type: str}
                - {name: package,  type: str}
                - {name: version,  type: str}

            - type: uml.classifier_box
              id: TestsEdge
              box: [1340, 470, 260, 110]
              name: TestsEdge
              stereotype: dataclass
              attributes:
                - {name: test,    type: str}
                - {name: subject, type: str}

            # ── Symbol-xref family (bottom row)
            - type: uml.classifier_box
              id: SymbolXrefEdge
              box: [380, 720, 360, 160]
              name: SymbolXrefEdge
              stereotype: dataclass
              attributes:
                - {name: source_file,    type: str}
                - {name: source_symbol,  type: str}
                - {name: target_file,    type: str}
                - {name: target_symbol,  type: str}
                - {name: kind,           type: str}

            - type: uml.classifier_box
              id: UnresolvedSymbolRef
              box: [820, 720, 360, 160]
              name: UnresolvedSymbolRef
              stereotype: dataclass
              attributes:
                - {name: source_file,   type: str}
                - {name: source_symbol, type: str}
                - {name: name,          type: str}
                - {name: language,      type: str}

            # ── UML note (paper-fold "callout" rect, not a classifier).
            # Renders as a yellow sticky-note panel so it reads as
            # commentary rather than as another dataclass.
            - {type: rect, id: NoteCard_bg, decorative: true,
               box: [1340, 720, 480, 160],
               fill: "#FEF6E8", stroke: {color: "#9A4D2C", width: 0.8},
               radius: 2}
            - {type: rect, id: NoteCard_fold, decorative: true,
               box: [1796, 720, 24, 24],
               fill: "#F4E2C6", stroke: {color: "#9A4D2C", width: 0.8}}
            - {type: text, id: NoteCard_title, decorative: true,
               text: "note ▸  models.py",
               box: [1356, 732, 460, 20],
               style: {font: heading, size: 14, weight: 700, color: "#9A4D2C", align: left}}
            - {type: text, id: NoteCard_body, decorative: true,
               text: "import degree   25 \nimports out     0   (pure data hub)\nimports in     25   (every adapter + plugin reads it)\nsize           2 525 B / 93 LOC\nshape          dataclasses only — no behavior",
               box: [1356, 762, 450, 110],
               style: {font: mono, size: 12, weight: 400, color: "#1A1A1A", align: left, line_height: 17, wrap: true}}

        - id: edges
          z: 20
          objects:
            # ── Aggregation edges (◇ hollow diamond at FileRecord).
            # All 5 aggregation children sit in the MIDDLE row
            # (y=470–580). They route up to FileRecord's south face,
            # distributed across 5 evenly spaced ports so the diamonds
            # don't pile up. Port spacing along the 360 px south face:
            #   x ≈ 780 + i*60  (i=1..5)  →  840, 900, 960, 1020, 1080.
            - {type: connector, id: a_ie,
               from: {object: ImportEdge, side: north},
               to:   {object: FileRecord, side: south, port_index: 1, port_total: 5},
               route: {type: orthogonal},
               stroke: {color: uml_edge, width: 1.0, arrow_end: true, arrow_end_kind: hollow_diamond}}
            - {type: connector, id: a_iee,
               from: {object: ImportExternalEdge, side: north},
               to:   {object: FileRecord, side: south, port_index: 2, port_total: 5},
               route: {type: orthogonal},
               stroke: {color: uml_edge, width: 1.0, arrow_end: true, arrow_end_kind: hollow_diamond}}
            - {type: connector, id: a_dde,
               from: {object: DeclaresDependencyEdge, side: north},
               to:   {object: FileRecord, side: south, port_index: 3, port_total: 5},
               route: {type: orthogonal},
               stroke: {color: uml_edge, width: 1.0, arrow_end: true, arrow_end_kind: hollow_diamond}}
            - {type: connector, id: a_pde,
               from: {object: PinsDependencyEdge, side: north},
               to:   {object: FileRecord, side: south, port_index: 4, port_total: 5},
               route: {type: orthogonal},
               stroke: {color: uml_edge, width: 1.0, arrow_end: true, arrow_end_kind: hollow_diamond}}
            - {type: connector, id: a_te,
               from: {object: TestsEdge, side: north},
               to:   {object: FileRecord, side: south, port_index: 5, port_total: 5},
               route: {type: orthogonal},
               stroke: {color: uml_edge, width: 1.0, arrow_end: true, arrow_end_kind: hollow_diamond}}

            # ── Composition edges (◆ filled diamond).
            # The xref family lives in the BOTTOM row (y=720+) — routing
            # them to FileRecord's south face would cross every aggregation
            # edge above. Anchoring them to FileRecord's WEST face (for
            # SymbolXrefEdge) and EAST face (for UnresolvedSymbolRef)
            # eliminates crossings: composition edges leave horizontally
            # from FileRecord's sides, then route down to the bottom row.
            - {type: connector, id: c_sxe,
               from: {object: SymbolXrefEdge, side: north},
               to:   {object: FileRecord, side: west, offset: 60},
               route: {type: orthogonal},
               stroke: {color: primary, width: 1.4, arrow_end: true, arrow_end_kind: filled_diamond}}
            - {type: connector, id: c_usr,
               from: {object: UnresolvedSymbolRef, side: north},
               to:   {object: FileRecord, side: east, offset: 60},
               route: {type: orthogonal},
               stroke: {color: primary, width: 1.4, arrow_end: true, arrow_end_kind: filled_diamond}}

        - id: legend
          z: 25
          objects:
            # Legend moved below the bottom row of classes (which ends
            # at y=880) and above the caption (y=956). The previous
            # placement at y=170 overlapped FileRecord's header band.
            # Diamond glyphs use uml.marker_glyph so the legend's
            # symbols match the diagram's markers exactly — no Unicode
            # font fallback can produce missing-glyph tofu.
            - {type: uml.marker_glyph, id: lg_hollow, decorative: true,
               kind: hollow_diamond, position: [86, 902], size: 12, color: uml_edge}
            - {type: text, id: lg_hollow_text, decorative: true,
               text: "**hollow diamond** = aggregation  (`FileRecord` is whole, each `*Edge` is part — no lifetime coupling)",
               box: [100, 894, 800, 18],
               style: {font: primary, size: 11, weight: 400, color: text_muted, align: left}}
            - {type: uml.marker_glyph, id: lg_filled, decorative: true,
               kind: filled_diamond, position: [916, 902], size: 12, color: primary}
            - {type: text, id: lg_filled_text, decorative: true,
               text: "**filled diamond** = composition  (xrefs/unresolved are owned by their source `FileRecord`)",
               box: [930, 894, 770, 18],
               style: {font: primary, size: 11, weight: 400, color: text_muted, align: left}}

        - id: caption
          z: 30
          objects:
            - {type: text, id: cap, decorative: true,
               text: "**Source**: `codebase_mapper/models.py` chunks 169–176 (`cbm file_detail`). `FileRecord`, `ImportEdge`, `ImportExternalEdge`, `DeclaresDependencyEdge`, `PinsDependencyEdge`, `TestsEdge`, `SymbolXrefEdge`, `UnresolvedSymbolRef`. Attribute names are illustrative of the dataclass field names visible in the chunks; full signatures are in `models.py` L20–L93.",
               box: [60,956,1800,72], style: uml_caption}

  # ── Slide 13 — UML Sequence diagram: repository_summary call path ────
  - id: 12-uml-sequence
    slide: 13
    title: "repository_summary — sequence diagram (UML)"
