dsl: FrameGraph
version: 1.5
kind: presentation-deck

# ─────────────────────────────────────────────────────────────────────────
# code-base-mapper — Architecture Report (FrameGraph deck)
# Source of facts: cbm MCP bundle `code-base-mapper` @ 715de92, tool 0.5.0.
# Generated 2026-05-14 by Claude Opus 4.7.
# Composed entirely from sidecared FrameGraph patterns (no bespoke SVG).
# ─────────────────────────────────────────────────────────────────────────

$theme: mckinsey
# Slide-grade stylesheet: clone of bundled default.yml with card_body /
# card_label / card_title / table_cell / synthesis bumped to sizes
# readable on a 1920×1080 screen. The bundled `default.yml` is tuned
# for letter-size consulting print at Big-4 density (10pt body) — too
# small for screen-slide use. Chrome / treatments / roles are unchanged.
stylesheet: static/fixture/code-base-mapper.style.yml
brand_text: "code-base-mapper · Architecture Report · 715de92"

deck:
  canvas:
    size: [1920, 1080]

  # Bespoke UML slides reference these; theme tokens are still available
  # because deck.tokens is *merged* with the library $theme tokens.
  #
  # Pattern-slide typography overrides:
  # The bundled `default.yml` stylesheet is tuned for letter-size
  # consulting reports (10pt body, 8pt label, 12pt title — "Big-4
  # density"). At a 1920×1080 screen canvas viewed at presentation
  # distance, those sizes are unreadable. The overrides below bump
  # card text to slide-grade while keeping the structured-card layout.
  tokens:
    colors:
      uml_panel:        "#FFFFFF"
      uml_panel_border: "#D0CEC8"
      uml_classifier:   "#F5F3EF"     # warm off-white (matches surface)
      uml_classifier_b: "#002060"     # mckinsey primary
      uml_iface:        "#FFFFFF"
      uml_iface_b:      "#1A6FA8"
      uml_pkg:          "#EEF2FA"
      uml_pkg_b:        "#002060"
      uml_db:           "#FEF6E8"
      uml_db_b:         "#9A4D2C"
      uml_actor:        "#FFFFFF"
      uml_actor_b:      "#002060"
      uml_edge:         "#1A1A1A"
      uml_edge_muted:   "#6B6B6B"
      uml_caption:      "#6B6B6B"
    text_styles:
      # ── UML bespoke styles (slides 9–11) ──────────────────────
      uml_title:    {font: heading, size: 32, weight: 700, color: primary,   align: left,   line_height: 38}
      uml_subtitle: {font: primary, size: 14, weight: 400, color: text_muted, align: left,  line_height: 18, italic: true}
      uml_caption:  {font: primary, size: 12, weight: 400, color: uml_caption, align: left, line_height: 16, italic: true, wrap: true}
      uml_pkg_lbl:  {font: primary, size: 11, weight: 700, color: primary,   align: left,   line_height: 14}
      uml_note:     {font: primary, size: 11, weight: 400, color: text,      align: left,   line_height: 15, wrap: true}
      uml_msg:      {font: primary, size: 12, weight: 400, color: text,      align: left,   line_height: 16}
      uml_reply:    {font: primary, size: 12, weight: 400, color: text_muted, align: left,  line_height: 16, italic: true}
      uml_step:     {font: primary, size: 10, weight: 700, color: accent,    align: left,   line_height: 13}

      # Pattern-slide card / table / synthesis typography lives in the
      # deck-level stylesheet (static/fixture/code-base-mapper.style.yml),
      # NOT here. `deck.tokens.text_styles` flows into per-slide token
      # resolution but is not what the pattern emitter reads — it reads
      # from `stylesheet.text_styles`. Keep both layers honest.

  symbols:
    # Bespoke chrome for the UML slides. Bespoke and patterned slides
    # can coexist because each slide draws its own chrome.
    uml_chrome:
      box: [0, 0, 1920, 1080]
      slots: [slide_title, slide_subtitle, slide_num]
      objects:
        - {type: rect, id: bg,         box: [0,0,1920,1080], fill: white}
        - {type: rect, id: top_rule,   box: [0,0,1920,8],    fill: primary}
        - {type: text, id: title_text, box: [60,36,1500,42], text: "$slide_title",    style: uml_title}
        - {type: text, id: subtitle,   box: [60,82,1500,22], text: "$slide_subtitle", style: uml_subtitle}
        - {type: text, id: snum,       box: [1760,40,120,22], text: "$slide_num",
           style: {font: primary, size: 12, weight: 700, color: text_muted, align: right}}
        - {type: line, id: title_rule, from: [60,120], to: [1860,120], stroke: {color: border, width: 0.6}}
        - {type: line, id: foot_rule,  from: [60,1040], to: [1860,1040], stroke: {color: border, width: 0.6}}
        - {type: text, id: brand,      box: [60,1050,1200,20],
           text: "code-base-mapper · Architecture Report · 715de92 · UML",
           style: {font: primary, size: 11, weight: 400, color: text_muted, align: left}}
        - {type: text, id: src,        box: [1260,1050,600,20],
           text: "Source: cbm MCP — facts cited from bundle queries (see report)",
           style: {font: primary, size: 11, weight: 400, color: text_muted, align: right}}

slides:
  # ── Slide 1 — SWOT: overall architectural posture ─────────────────────
  - id: 01-swot
    slide: 1
    use: 10
    title: "Architectural SWOT — code-base-mapper @ 715de92"
    synthesis: "Strong **layered model** and **dual REST/MCP surface**, but **test↔subject traceability** and **vocab kinding** are the load-bearing weaknesses to close before the next release."
    fill:
      strengths:
        - "**Layered RDF model**: L1 host facts, L2 chunks+embeddings, L3 SKOS concepts — cleanly separated"
        - "**SHACL conformance = true**; 179 unique blobs; deterministic, content-addressed bundle"
        - "`models.py` is a **pure data hub**: 25 inbound / 0 outbound — acyclic root for the host layer"
        - "Two surfaces (REST FastAPI + MCP stdio/HTTP) share **one bundle store**; MCP imports REST — no duplicate impl"
        - "**9 language adapters** + dedicated Python/TS-JS symbol resolvers (20.7 KB + 23.0 KB)"
      weaknesses:
        - "**tests-edges heuristic under-fires**: only 8 edges for 42 test files (ratio 0.47) — graph can't answer 'tests cover X?'"
        - "**Controlled-vocab coverage**: 1 / 1 427 concepts kinded (only `import_statement`) despite v1-default-on commit"
        - "`handlers.py` concentrates **22 MCP tools** in one 29.3 KB file — **large blast radius**"
        - "`frontend/backend/app.py` is a single **39.7 KB** FastAPI file (largest source file in the repo)"
        - "`__init__.py` fan-out (**deg 30**, 26 outbound) — package surface change touches every adapter"
      opportunities:
        - "Extend `tests_edges.py` (2.8 KB — small) to **bind tests to subjects** via imports or coverage hooks"
        - "Grow `software_primitives.yaml` to lift more concepts into **kinded** domain/structural/relational categories"
        - "**Per-tool split** of `handlers.py` to scope blast radius and shrink `test_handlers.py` (15.0 KB)"
        - "Re-use the L2 embeddings (MiniLM-L6-v2, 384-dim) for **cross-bundle semantic search**"
        - "Vendor schema fixtures already underway (XSD, proto v2) — **pattern** for codifying language quirks"
      threats:
        - "**Bundle-format drift** between tool versions (0.5.0 today) and stored bundles — no version-pinned migration path is visible"
        - "Reliance on **tree-sitter grammars**: per-language adapter rot if grammars move upstream"
        - "Single-file FastAPI + single-file handlers raise **merge-conflict risk** as the MCP surface grows"
        - "Embeddings backend default is offline-friendly but **binds the bundle to one model family**"

  # ── Slide 2 — Diagnostic Summary by architectural dimension ──────────
  - id: 02-diagnostic
    slide: 2
    use: 111
    title: "Diagnostic summary — five architectural dimensions"
    synthesis: "Three **Greens** (layered model, public surfaces, adapter breadth) carry the architecture; one **Red** (test traceability) and one **Amber** (vocab coverage) are the next-quarter targets."
    fill:
      dimensions:
        - "Layered model integrity"
        - "Public surface design (REST + MCP)"
        - "Test↔subject traceability"
        - "Controlled-vocab coverage"
        - "Per-language adapter breadth"
      status:
        headers: [Dimension, Status]
        rows:
          - [Layered model, "Green"]
          - [Public surfaces, "Green"]
          - [Test traceability, "Red"]
          - [Vocab coverage, "Amber"]
          - [Adapter breadth, "Green"]
      findings:
        headers: [Dimension, Finding]
        rows:
          - [Layered model, "L1/L2/L3 are physically separate; SHACL conforms; 968 chunks, 1 427 concepts"]
          - [Public surfaces, "MCP handlers.py imports REST app.py — one impl, two adapters"]
          - [Test traceability, "8 tests-edges for 42 test files — heuristic in tests_edges.py underfires"]
          - [Vocab coverage, "Only import_statement is kinded; loader+yaml wired but yield ≈ 0"]
          - [Adapter breadth, "9 language adapters under codebase_mapper/languages/, Python+TS first-class"]
      implications:
        headers: [Dimension, Implication]
        rows:
          - [Layered model, "Safe to extend per-layer; preserve namespace discipline (cbm/cbml2/cbml3/skos)"]
          - [Public surfaces, "Keep MCP-as-thin-adapter rule; reject parallel impls in handlers.py"]
          - [Test traceability, "Reimplement tests_edges using imports or coverage — current ratio claim is mis-grounded"]
          - [Vocab coverage, "Either expand software_primitives.yaml or relax the matcher; ship measurable kind-yield"]
          - [Adapter breadth, "Promote a 2-tier rule: first-class (Py, TS) vs structural-only (others)"]

  # ── Slide 3 — Layer / Operating Model view (repurposes 183) ──────────
  - id: 03-layers
    slide: 3
    use: 183
    title: "Layered RDF model — L1 host / L2 chunks / L3 concepts"
    synthesis: "Each layer has a **distinct namespace**, owning module, key predicates, and backing tech — **clean separation** that lets each tier evolve without breaking the others."
    fill:
      data_domains:
        - "L1 — Host facts (cbm:)"
        - "L2 — Chunks + embeddings (cbml2:)"
        - "L3 — Concept graph (cbml3:/skos:)"
        - "Symbol cross-references"
        - "Bundle envelope + SHACL"
      domain_owners:
        headers: [Layer, Owning module]
        rows:
          - ["L1 host", "codebase_mapper/ (pipeline.py, models.py, languages/*)"]
          - ["L2 chunks", "plugins/chunks_embeddings/ (chunker, backends, embedder)"]
          - ["L3 concepts", "plugins/concept_graph/ (splitter, concepts, graph_writer)"]
          - ["Xrefs", "plugins/symbol_xrefs/ (python_resolver 20.7 KB, tsjs_resolver 23.0 KB)"]
          - ["Envelope", "rdf_emit.py + emit_bundle.py + reconstruct.py"]
      governance_forums:
        headers: [Layer, Key predicates]
        rows:
          - ["L1 host", "cbm:path, cbm:imports, cbm:hasPhase, cbm:tests"]
          - ["L2 chunks", "cbml2:inFile, cbml2:beginIndex, cbml2:endIndex, cbml2:embeddingRow"]
          - ["L3 concepts", "cbml3:lexicalizes, cbml3:composedOf, skos:related, skos:prefLabel"]
          - ["Xrefs", "SymbolXrefEdge, UnresolvedSymbolRef (from models.py)"]
          - ["Envelope", "build_inventory_graph, build_shacl_graph, build_ontology_mapping_graph"]
      platform_capabilities:
        headers: [Layer, Backing tech]
        rows:
          - ["L1 host", "tree-sitter (ts_setup.py) + per-language adapters"]
          - ["L2 chunks", "sentence-transformers/all-MiniLM-L6-v2 (384-dim)"]
          - ["L3 concepts", "Identifier splitter + co-occurrence (SKOS-compatible)"]
          - ["Xrefs", "Python/TS resolvers + aggregator"]
          - ["Envelope", "rdflib turtle/json-ld emitters; SHACL validator"]
      priority_use_cases:
        headers: [Layer, Primary consumer]
        rows:
          - ["L1 host", "file_detail, list_files, imports_of/imported_by, file_impact"]
          - ["L2 chunks", "semantic_neighbors, chunk_detail, chunk_blob"]
          - ["L3 concepts", "concept_detail, concept_neighborhood"]
          - ["Xrefs", "/symbol_graph endpoint + UI SymbolGraph view"]
          - ["Envelope", "orient_bundle, bundle_summary, repository_summary"]

  # ── Slide 4 — Best Practice Gap (current vs desired) ─────────────────
  - id: 04-gap
    slide: 4
    use: 122
    title: "Best-practice gap — five concrete divergences"
    synthesis: "All five gaps are **single-file or single-module** problems with **bounded blast radius** — none require cross-cutting redesign."
    fill:
      practice_areas:
        title: "Architectural practices under review"
        body: "Five concrete areas where the current implementation diverges from a defensible target state."
      current_practice:
        headers: [Area, Today]
        rows:
          - ["Test-edge graph", "Heuristic in tests_edges.py emits 8 edges for 42 test files"]
          - ["Vocab kinding", "1 / 1 427 concepts kinded; loader wired but matcher near-empty"]
          - ["MCP handlers", "22 tools in one 29.3 KB handlers.py"]
          - ["FastAPI backend", "Single 39.7 KB app.py — all 12 endpoints in one module"]
          - ["LLM output trust", "Not visibly applied to the embedding/concept pipeline"]
      leading_practice:
        headers: [Area, Leading practice]
        rows:
          - ["Test-edge graph", "Imports-based binding OR coverage.py ingest; ratio claim grounded"]
          - ["Vocab kinding", "Coverage > 30% of frequency-top concepts; CI guards regressions"]
          - ["MCP handlers", "One module per tool group (bundle/file/chunk/concept/sparql)"]
          - ["FastAPI backend", "Routers split by resource; shared deps in app.factory"]
          - ["LLM output trust", "Schema-validate every LLM-emitted artifact; reject silently-empty fills"]
      required_change:
        headers: [Area, Required change]
        rows:
          - ["Test-edge graph", "Rewrite tests_edges.py to score by import-overlap; add coverage hook"]
          - ["Vocab kinding", "Expand software_primitives.yaml; add lexical-match CI assertion"]
          - ["MCP handlers", "Split handlers.py along the 22-tool boundary; preserve dispatch table"]
          - ["FastAPI backend", "Extract APIRouter modules per resource; thin app.py to wiring"]
          - ["LLM output trust", "Add PALS-law contract block + validator at every LLM seam (per CLAUDE.md)"]

  # ── Slide 5 — Unknowns Map ───────────────────────────────────────────
  - id: 05-unknowns
    slide: 5
    use: 280
    title: "Unknowns map — known facts, known unknowns, assumptions, open risks"
    synthesis: "What we **measured** (181 files, 968 chunks, 1 427 concepts) gives a strong baseline; what we have **not measured** (coverage %, scale headroom) is the next instrumentation backlog."
    fill:
      known_facts:
        - "**181 files** (Py 103, TS 21, Proto 5); **968 chunks**; **1 427 concepts**; SHACL conforms"
        - "Embeddings backend: `sentence-transformers/all-MiniLM-L6-v2` at **384 dims**"
        - "Two surfaces (REST FastAPI + MCP) backed by **one bundle store**"
        - "Recent commits add static fixtures: **XSD** (5f478c7) + **proto v2** (715de92)"
        - "L3 controlled vocabulary v1 is **'default on'** (commit 41e9423)"
      known_unknowns:
        - "Actual **test-coverage %** (only 0.47 file-ratio reported; 8 tests-edges is unreliable)"
        - "**Bundle-format compatibility window** across `tool_version` bumps"
        - "**Throughput / latency** of `repository_summary` on 10× larger bundles"
        - "OAuth / **auth posture** of the MCP HTTP transport at production load"
        - "Concrete **kind-coverage target** for the controlled vocabulary"
      assumptions:
        - "Per-language adapters can be extended **without touching** `pipeline.py` orchestration"
        - "MCP handlers will continue to **import** `frontend/backend/app.py` rather than fork its impl"
        - "`rdf_emit.py` output is **byte-stable** across runs at the same commit"
        - "MiniLM-L6-v2 embeddings remain serviceable; **no upgrade pressure** in next quarter"
        - "Plugin registration via `register_builtins()` is **sufficient** for all future emitters"
      open_risks:
        - "`tests_edges` under-counting creates **false confidence** in coverage reports"
        - "Single-file `handlers.py` / `app.py` become **merge-conflict hotspots** as MCP surface grows"
        - "Vocab v1 default-on with **near-zero kind yield** is a silent-no-op risk for L3 consumers"
        - "AST_summary_total_bytes (6.05 MB) on 181 files — scaling to **10k files is unverified**"
        - "**Tree-sitter grammar version drift** could silently change parse output between bundles"

  # ── Slide 6 — RAID Log (Risks / Assumptions / Issues / Dependencies) ─
  - id: 06-raid
    slide: 6
    use: 93
    title: "RAID log — risks, assumptions, issues, dependencies"
    synthesis: "Two **open issues** (`handlers.py` size, `tests-edges` under-firing) and one **assumption** (MCP-as-thin-adapter) are the items most worth verifying before the next bundle revision."
    fill:
      risks:
        - "**R1**: Bundle drift across `tool_version` — no migration path visible"
        - "**R2**: `handlers.py` (29.3 KB) merge conflicts as MCP tools grow"
        - "**R3**: `tests_edges` under-fires → coverage claims under-grounded"
        - "**R4**: Vocab kinding stays at 1/1 427 → L3 typing loses value"
        - "**R5**: Embeddings backend single-source (MiniLM-L6-v2)"
      assumptions:
        - "**A1**: MCP handlers stay as **thin adapters** over REST `app.py`"
        - "**A2**: SHACL conformance is **enforced** on every emitted bundle"
        - "**A3**: Plugin registration is the **only** emitter wiring path"
        - "**A4**: Tree-sitter grammars remain **backward-compatible**"
        - "**A5**: 384-dim MiniLM vectors are **enough** for `semantic_neighbors`"
      issues:
        - "**I1**: Only **8 tests-edges** across 42 test files (`cbm:tests` heuristic too narrow)"
        - "**I2**: **1/1 427** concepts kinded despite vocab-v1 default-on"
        - "**I3**: `frontend/backend/app.py` at **39.7 KB** — largest single source file"
        - "**I4**: `handlers.py` at **29.3 KB** with 22 tool handlers in-file"
        - "**I5**: `tests/verify_xrefs.py` at **50.9 KB** — test-of-record but unwieldy"
      dependencies:
        - "**D1**: `tree-sitter` grammars per supported language"
        - "**D2**: `sentence-transformers` (MiniLM-L6-v2) + Python ML stack"
        - "**D3**: `rdflib` for emit + SHACL validation"
        - "**D4**: **FastAPI** for REST surface; **MCP SDK** for tool transport"
        - "**D5**: **React + Vite + Cytoscape** for the UI tier"

  # ── Slide 7 — Decision Log: recent commits as architectural decisions ─
  - id: 07-decisions
    slide: 7
    use: 219
    title: "Architectural decisions — five recent commits, what they imply"
