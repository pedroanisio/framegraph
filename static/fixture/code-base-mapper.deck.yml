  # ── Slide 8 — Early Warning Indicators (drift signals) ───────────────
  - id: 08-ewi
    slide: 8
    use: 297
    title: "Early-warning indicators — five drift signals"
    synthesis: "Two indicators (**test-edge ratio**, **vocab kind coverage**) are already **past their threshold** and need active remediation; the other three give us monitoring runway as the codebase scales."
    fill:
