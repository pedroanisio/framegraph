dsl: FrameGraph
version: 1.5
kind: presentation-deck

# ─────────────────────────────────────────────────────────────────────────
# code-base-mapper — Architecture Report (FrameGraph deck)
# Source of facts: cbm MCP bundle `code-base-mapper` @ 715de92, tool 0.5.0.
# Generated 2026-05-14 by Claude Opus 4.7.
# Composed entirely from sidecared FrameGraph patterns (no bespoke SVG).
# ─────────────────────────────────────────────────────────────────────────

$theme: mckinsey
# Slide-grade stylesheet: clone of bundled default.yml with card_body /
# card_label / card_title / table_cell / synthesis bumped to sizes
# readable on a 1920×1080 screen. The bundled `default.yml` is tuned
# for letter-size consulting print at Big-4 density (10pt body) — too
# small for screen-slide use. Chrome / treatments / roles are unchanged.
brand_text: "code-base-mapper · Architecture Report · 715de92"

deck:
  canvas:
    size: [1920, 1080]

  # Bespoke UML slides reference these; theme tokens are still available
  # because deck.tokens is *merged* with the library $theme tokens.
  #
  # Pattern-slide typography overrides:
  # The bundled `default.yml` stylesheet is tuned for letter-size
  # consulting reports (10pt body, 8pt label, 12pt title — "Big-4
  # density"). At a 1920×1080 screen canvas viewed at presentation
  # distance, those sizes are unreadable. The overrides below bump
  # card text to slide-grade while keeping the structured-card layout.
  tokens:
    colors:
      uml_panel:        "#FFFFFF"
      uml_panel_border: "#D0CEC8"
      uml_classifier:   "#F5F3EF"     # warm off-white (matches surface)
      uml_classifier_b: "#002060"     # mckinsey primary
      uml_iface:        "#FFFFFF"
      uml_iface_b:      "#1A6FA8"
      uml_pkg:          "#EEF2FA"
      uml_pkg_b:        "#002060"
      uml_db:           "#FEF6E8"
      uml_db_b:         "#9A4D2C"
      uml_actor:        "#FFFFFF"
      uml_actor_b:      "#002060"
      uml_edge:         "#1A1A1A"
      uml_edge_muted:   "#6B6B6B"
      uml_caption:      "#6B6B6B"
    text_styles:
      # ── UML bespoke styles (slides 10–12) ─────────────────────
      #
      # These tokens are referenced ONLY by the bespoke UML slides
      # via `style: uml_*`. Each is anchored to a corresponding
      # stylesheet role so the UML slides type-stack the same way
      # pattern slides do:
      #
      #   uml_caption  ←  card_meta      (small italic muted prose)
      #   uml_pkg_lbl  ←  card_label     (small bold accent text)
      #   uml_msg      ←  card_body      (regular body text)
      #   uml_reply    ←  card_body / italic muted (sequence reply)
      #   uml_step     ←  card_label     (small bold accent badge)
      #
      # Sizes are deliberately compact (11–14 px) because the labels
      # sit inside small diagram boxes. The semantic intent — what
      # ROLE each label plays — matches the stylesheet roles above.
      uml_caption:  {font: primary, size: 14, weight: 400, color: text_muted, align: left, line_height: 18, italic: true, wrap: true}
      uml_pkg_lbl:  {font: primary, size: 13, weight: 700, color: accent,    align: left, line_height: 16}
      uml_note:     {font: primary, size: 13, weight: 400, color: text,      align: left, line_height: 17, wrap: true}
      uml_msg:      {font: primary, size: 13, weight: 400, color: text,      align: left, line_height: 17}
      uml_reply:    {font: primary, size: 13, weight: 400, color: text_muted, align: left, line_height: 17, italic: true}
      uml_step:     {font: primary, size: 11, weight: 700, color: accent,    align: left, line_height: 14}

      # Pattern-slide card / table / synthesis typography lives in the
      # deck-level stylesheet (static/fixture/code-base-mapper.style.yml),
      # NOT here. `deck.tokens.text_styles` flows into per-slide token
      # resolution but is not what the pattern emitter reads — it reads
      # from `stylesheet.text_styles`. Keep both layers honest.

  symbols:
    # Unified chrome — visually identical to the stylesheet's
    # `slide_chrome` block applied to pattern slides 1–8 + 13. Used by
    # the bespoke UML slides 10–12 (and section divider + cover, where
    # the chrome is inlined directly because they need bespoke titles).
    # Geometry mirrors `code-base-mapper.style.yml:slide_chrome` so the
    # whole deck reads as one visual identity:
    #   - 4 px top stripe in `accent`
    #   - 52 px title band, 22 px bold heading in `primary`
    #   - 0.5 px separator at y = 56
    #   - 24 px footer band: brand mark left, page number top-right
    uml_chrome:
      box: [0, 0, 1920, 1080]
      slots: [slide_title, slide_subtitle, slide_num]
      objects:
        - {type: rect, id: bg,         box: [0,0,1920,1080], fill: surface}
        - {type: rect, id: top_stripe, box: [0,0,1920,4],    fill: accent}
        # Title box matches the stylesheet's `title_band` exactly:
        # y=8, height=52, margins 32/80 — pixel-aligned with pattern slides.
        - {type: text, id: title_text, box: [32,8,1640,52], text: "$slide_title",
           style: {font: heading, size: 22, weight: 700, color: primary, align: left, v_align: middle, line_height: 26, wrap: true}}
        # Page-number baseline matches the stylesheet's `page_num` slot
        # exactly (y=22.92 in the rendered SVG) so pattern + bespoke
        # slides align pixel-for-pixel. The text painter centers the
        # glyph inside the box top-to-bottom, so y=8 here lands the
        # baseline at the same pixel as stylesheet's y=18 default.
        - {type: text, id: snum,       box: [1740,8,148,22],  text: "$slide_num",
           style: {font: primary, size: 14, weight: 400, color: text_muted, align: right, v_align: middle}}
        - {type: line, id: title_rule, from: [0,56], to: [1920,56], stroke: {color: border, width: 0.5}}
        - {type: text, id: subtitle,   box: [32,68,1640,22], text: "$slide_subtitle",
           style: {font: primary, size: 14, weight: 400, color: text_muted, align: left, italic: true, wrap: true}}
        - {type: line, id: foot_rule,  from: [32,1056], to: [1888,1056], stroke: {color: border, width: 0.5}}
        - {type: text, id: brand,      box: [32,1064,1200,20],
           text: "code-base-mapper · Architecture Report · 715de92",
           style: {font: primary, size: 13, weight: 700, color: text_muted, align: left}}

slides:
  # ── Slide 0 — Cover (pattern 1: Title Slide) ──────────────────────────
  - id: 00-cover
    slide: 0
    use: 1
    title: "code-base-mapper — Architecture Report"
    description: "Cover slide. Subject, source bundle, audience, and date."
    synthesis: "A forensic look — **layered RDF model**, **dual REST/MCP surface**, **9 language adapters** — strengths and the four weaknesses worth closing before the next release."
    labels:
      title: ""
      subtitle: ""
      metadata: ""
    fill:
      title:
        title: "code-base-mapper"
        body: "A forensic look at the architecture"
      subtitle:
        title: "Architecture Report @ 715de92 · tool 0.5.0"
        body: "Composed in FrameGraph · sourced from the cbm MCP bundle"
      metadata:
        Date:   "2026-05-14"
        Source: "cbm MCP bundle"
        Audience: "engineering leads · architecture review"

  # ── Slide 1 — SWOT: overall architectural posture ─────────────────────
  - id: 01-swot
    slide: 1
    use: 10
    title: "Architectural SWOT — code-base-mapper @ 715de92"
    synthesis: "Strong **layered model** and **dual REST/MCP surface**, but **test↔subject traceability** and **vocab kinding** are the load-bearing weaknesses to close before the next release."
    fill:
      strengths:
        - "**Layered RDF model**: L1 host facts, L2 chunks+embeddings, L3 SKOS concepts — cleanly separated"
        - "**SHACL conformance = true**; 179 unique blobs; deterministic, content-addressed bundle"
        - "`models.py` is a **pure data hub**: 25 inbound / 0 outbound — acyclic root for the host layer"
        - "Two surfaces (REST FastAPI + MCP stdio/HTTP) share **one bundle store**; MCP imports REST — no duplicate impl"
        - "**9 language adapters** + dedicated Python/TS-JS symbol resolvers (20.7 KB + 23.0 KB)"
      weaknesses:
        - "**tests-edges heuristic under-fires**: only 8 edges for 42 test files (ratio 0.47) — graph can't answer 'tests cover X?'"
        - "**Controlled-vocab coverage**: 1 / 1 427 concepts kinded (only `import_statement`) despite v1-default-on commit"
        - "`handlers.py` concentrates **22 MCP tools** in one 29.3 KB file — **large blast radius**"
        - "`frontend/backend/app.py` is a single **39.7 KB** FastAPI file (largest source file in the repo)"
        - "`__init__.py` fan-out (**deg 30**, 26 outbound) — package surface change touches every adapter"
      opportunities:
        - "Extend `tests_edges.py` (2.8 KB — small) to **bind tests to subjects** via imports or coverage hooks"
        - "Grow `software_primitives.yaml` to lift more concepts into **kinded** domain/structural/relational categories"
        - "**Per-tool split** of `handlers.py` to scope blast radius and shrink `test_handlers.py` (15.0 KB)"
        - "Re-use the L2 embeddings (MiniLM-L6-v2, 384-dim) for **cross-bundle semantic search**"
        - "Vendor schema fixtures already underway (XSD, proto v2) — **pattern** for codifying language quirks"
      threats:
        - "**Bundle-format drift** between tool versions (0.5.0 today) and stored bundles — no version-pinned migration path is visible"
        - "Reliance on **tree-sitter grammars**: per-language adapter rot if grammars move upstream"
        - "Single-file FastAPI + single-file handlers raise **merge-conflict risk** as the MCP surface grows"
        - "Embeddings backend default is offline-friendly but **binds the bundle to one model family**"

  # ── Slide 2 — Diagnostic Summary by architectural dimension ──────────
  - id: 02-diagnostic
    slide: 2
    use: 111
    title: "Diagnostic summary — five architectural dimensions"
    synthesis: "Three **Greens** (layered model, public surfaces, adapter breadth) carry the architecture; one **Red** (test traceability) and one **Amber** (vocab coverage) are the next-quarter targets."
    fill:
      dimensions:
        - "Layered model integrity"
        - "Public surface design (REST + MCP)"
        - "Test↔subject traceability"
        - "Controlled-vocab coverage"
        - "Per-language adapter breadth"
      status:
        headers: [Dimension, Status]
        rows:
          - [Layered model, "Green"]
          - [Public surfaces, "Green"]
          - [Test traceability, "Red"]
          - [Vocab coverage, "Amber"]
          - [Adapter breadth, "Green"]
      findings:
        headers: [Dimension, Finding]
        rows:
          - [Layered model, "L1/L2/L3 are physically separate; SHACL conforms; 968 chunks, 1 427 concepts"]
          - [Public surfaces, "MCP handlers.py imports REST app.py — one impl, two adapters"]
          - [Test traceability, "8 tests-edges for 42 test files — heuristic in tests_edges.py underfires"]
          - [Vocab coverage, "Only import_statement is kinded; loader+yaml wired but yield ≈ 0"]
          - [Adapter breadth, "9 language adapters under codebase_mapper/languages/, Python+TS first-class"]
      implications:
        headers: [Dimension, Implication]
        rows:
          - [Layered model, "Safe to extend per-layer; preserve namespace discipline (cbm/cbml2/cbml3/skos)"]
          - [Public surfaces, "Keep MCP-as-thin-adapter rule; reject parallel impls in handlers.py"]
          - [Test traceability, "Reimplement tests_edges using imports or coverage — current ratio claim is mis-grounded"]
          - [Vocab coverage, "Either expand software_primitives.yaml or relax the matcher; ship measurable kind-yield"]
          - [Adapter breadth, "Promote a 2-tier rule: first-class (Py, TS) vs structural-only (others)"]

  # ── Slide 3 — Layer / Operating Model view (repurposes 183) ──────────
  - id: 03-layers
    slide: 3
    use: 183
    title: "Layered RDF model — L1 host / L2 chunks / L3 concepts"
    synthesis: "Each layer has a **distinct namespace**, owning module, key predicates, and backing tech — **clean separation** that lets each tier evolve without breaking the others."
    fill:
      data_domains:
        - "L1 — Host facts (cbm:)"
        - "L2 — Chunks + embeddings (cbml2:)"
        - "L3 — Concept graph (cbml3:/skos:)"
        - "Symbol cross-references"
        - "Bundle envelope + SHACL"
      domain_owners:
        headers: [Layer, Owning module]
        rows:
          - ["L1 host", "codebase_mapper/ (pipeline.py, models.py, languages/*)"]
          - ["L2 chunks", "plugins/chunks_embeddings/ (chunker, backends, embedder)"]
          - ["L3 concepts", "plugins/concept_graph/ (splitter, concepts, graph_writer)"]
          - ["Xrefs", "plugins/symbol_xrefs/ (python_resolver 20.7 KB, tsjs_resolver 23.0 KB)"]
          - ["Envelope", "rdf_emit.py + emit_bundle.py + reconstruct.py"]
      governance_forums:
        headers: [Layer, Key predicates]
        rows:
          - ["L1 host", "cbm:path, cbm:imports, cbm:hasPhase, cbm:tests"]
          - ["L2 chunks", "cbml2:inFile, cbml2:beginIndex, cbml2:endIndex, cbml2:embeddingRow"]
          - ["L3 concepts", "cbml3:lexicalizes, cbml3:composedOf, skos:related, skos:prefLabel"]
          - ["Xrefs", "SymbolXrefEdge, UnresolvedSymbolRef (from models.py)"]
          - ["Envelope", "build_inventory_graph, build_shacl_graph, build_ontology_mapping_graph"]
      platform_capabilities:
        headers: [Layer, Backing tech]
        rows:
          - ["L1 host", "tree-sitter (ts_setup.py) + per-language adapters"]
          - ["L2 chunks", "sentence-transformers/all-MiniLM-L6-v2 (384-dim)"]
          - ["L3 concepts", "Identifier splitter + co-occurrence (SKOS-compatible)"]
          - ["Xrefs", "Python/TS resolvers + aggregator"]
          - ["Envelope", "rdflib turtle/json-ld emitters; SHACL validator"]
      priority_use_cases:
        headers: [Layer, Primary consumer]
        rows:
          - ["L1 host", "file_detail, list_files, imports_of/imported_by, file_impact"]
          - ["L2 chunks", "semantic_neighbors, chunk_detail, chunk_blob"]
          - ["L3 concepts", "concept_detail, concept_neighborhood"]
          - ["Xrefs", "/symbol_graph endpoint + UI SymbolGraph view"]
          - ["Envelope", "orient_bundle, bundle_summary, repository_summary"]

  # ── Slide 4 — Best Practice Gap (current vs desired) ─────────────────
  - id: 04-gap
    slide: 4
    use: 122
    title: "Best-practice gap — five concrete divergences"
    synthesis: "All five gaps are **single-file or single-module** problems with **bounded blast radius** — none require cross-cutting redesign."
    fill:
