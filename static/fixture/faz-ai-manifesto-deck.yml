  # ─────────────────────────────────────────────────────────────────────────
  # ARCHITECTURE APPENDIX — UML formalization of the relationship structure
  # and the refusal cascade. These slides exist for engineering reviews;
  # they're the same shape every architect expects to see, rendered from
  # the same DSL the rest of the deck uses (uml.classifier_box,
  # uml.state_box, uml.pseudostate, generic connector with arrow_*_kind).
  # ─────────────────────────────────────────────────────────────────────────

  # ─── SLIDE 14 — UML class diagram (Core / Worker / User formalization) ───
  - slide: 14
    id: s14_arch_class
    title: "Architecture — Core / Worker / User as a UML Class Model"
    description: "The constitutional Core / replaceable Workers structure, formalized in UML 2.5.1."
    notes: "Walk top-down. User holds the Core by composition (the relationship itself, non-fireable). Core aggregates Workers — workers can leave; the Core can't. Worker implements Refusable, which is the four-tier contract from slide 7."
    visual:
      layers:

        # Slide chrome.
        - id: chrome
          z: 0
          objects:
            - {type: use, id: v.ch, decorative: true, symbol: chrome, box: [0,0,960,540],
               slide_title: "Architecture — Core / Worker / User as a UML Class Model",
               slide_num: "14", params: {phase_color: phase3}}

        # Diagram panel.
        - id: panel
          z: 5
          objects:
            - {type: rect, id: v.bg, decorative: true, box: [40,60,880,432],
               fill: page_warm, stroke: {color: chrome_line, width: 0.5}, radius: 4}

        # ── UML edges. Drawn first; z=10 sits behind classifiers (z=20)
        # so any line that would clip a box is overdrawn.
        # Connectors use side: anchors to avoid center-to-center routing
        # that crosses box bodies.
        - id: uml.edges
          z: 10
          objects:

            # User *--> Core   (composition: User holds the Core; non-fireable)
            # Filled diamond at the User end (the whole).
            - {type: connector, id: arch.c1,
               from: {object: User, side: south},
               to:   {object: Core, side: north},
               stroke: {color: primary, width: 1.0,
                        arrow_start: true, arrow_start_kind: filled_diamond}}

            # Core o--> Worker  (aggregation: workers are replaceable, Core isn't)
            # Hollow diamond at the Core end.
            - {type: connector, id: arch.c2,
               from: {object: Core,   side: south},
               to:   {object: Worker, side: north},
               stroke: {color: primary, width: 1.0,
                        arrow_start: true, arrow_start_kind: hollow_diamond}}

            # Worker *--> MemoryStore  (composition: each worker owns its memory)
            - {type: connector, id: arch.c3,
               from: {object: Worker,      side: east},
               to:   {object: MemoryStore, side: west},
               stroke: {color: primary, width: 1.0,
                        arrow_start: true, arrow_start_kind: filled_diamond}}

            # Worker ..|> Refusable  (realization: dashed + hollow triangle)
            - {type: connector, id: arch.c4,
               from: {object: Worker,    side: west},
               to:   {object: Refusable, side: east},
               stroke: {color: primary, width: 1.0, dash: [5, 4],
                        arrow_end: true, arrow_end_kind: hollow_triangle}}

        # ── UML classifiers.
        # Heights are explicit (matching renderer auto-sizing) so the
        # endpoint resolver lands south/north on the actual edges.
        - id: uml.classifiers
          z: 20
          objects:

            # User — top center.
            # Height: header(28) + 2 attrs (46) + empty ops band (19) = 93.
            - type: uml.classifier_box
              id: User
              box: [380, 64, 200, 93]
              name: User
              attributes:
                - {name: identity,    type: Identity,    visibility: public}
                - {name: agency,      type: Authority,   visibility: public}

            # Core — middle center (constitutional).
            # Height: header(36 w/stereotype) + 2 attrs (46) + 2 ops (46) = 128.
            - type: uml.classifier_box
              id: Core
              box: [360, 188, 240, 128]
              name: Core
              stereotype: constitutional
              attributes:
                - {name: commitments, type: "Commitment[*]", visibility: private, readonly: true}
                - {name: relationship, type: Relationship, visibility: private}
              operations:
                - {name: observe}
                - {name: refuse, return_type: Decision}

            # Worker — middle bottom.
            # Height: header(28) + 3 attrs (65) + 1 op (27) = 120.
            - type: uml.classifier_box
              id: Worker
              box: [360, 348, 240, 120]
              name: Worker
              abstract: true
              attributes:
                - {name: name,    type: string,    visibility: public}
                - {name: voice,   type: VoiceSpec, visibility: public}
                - {name: values,  type: Document,  visibility: private}
              operations:
                - {name: act, abstract: true, return_type: Result}

            # Refusable — left side (interface).
            # Height: header(36) + empty attrs (19) + 3 ops (65) = 120.
            - type: uml.classifier_box
              id: Refusable
              box: [60, 348, 200, 120]
              name: Refusable
              stereotype: interface
              operations:
                - {name: softNo, abstract: true, return_type: Waiver}
                - {name: hardLimit, abstract: true, return_type: Defer}
                - {name: exit, abstract: true}

            # MemoryStore — right side.
            # Height: header(36) + 2 attrs (46) + 1 op (27) = 109.
            - type: uml.classifier_box
              id: MemoryStore
              box: [700, 354, 200, 109]
              name: MemoryStore
              stereotype: encrypted
              attributes:
                - {name: scope,    type: PerUser, visibility: private}
                - {name: trained,  type: bool,    visibility: private, default: "false"}
              operations:
                - {name: forget, return_type: void}

        # Caption.
        - id: caption
          z: 30
          objects:
            - {type: text, id: v.cap, decorative: true,
               text: "Composition (filled diamond) = the whole owns the part. Aggregation (hollow diamond) = the whole references replaceable parts. Realization (dashed + hollow triangle) = the class implements the interface contract.",
               box: [60,498,840,16],
               style: {font: primary, size: 10, weight: 400, color: text_muted, align: center, italic: true, wrap: true}}

  # ─── SLIDE 15 — UML state machine of the three refusal tiers ────────────
  - slide: 15
    id: s15_arch_state
    title: "Architecture — The Three Refusal Tiers as a UML State Machine"
    description: "How a request travels through Soft → Hard → Exit, formalized as a state machine."
    notes: "Open with the initial pseudostate. The waiver loop on Soft No is the user's escape hatch — Hard Limit's deferral is the system's. Exit is terminal: the relationship ends cleanly."
    visual:
      layers:

        # Slide chrome.
        - id: chrome
          z: 0
          objects:
            - {type: use, id: v.ch, decorative: true, symbol: chrome, box: [0,0,960,540],
               slide_title: "Architecture — The Three Refusal Tiers as a UML State Machine",
               slide_num: "15", params: {phase_color: phase3}}

        # Diagram panel.
        - id: panel
          z: 5
          objects:
            - {type: rect, id: v.bg, decorative: true, box: [40,60,880,432],
               fill: page_warm, stroke: {color: chrome_line, width: 0.5}, radius: 4}

        # ── UML transitions (z=10, behind state boxes).
        # Layout strategy: horizontal cascade — initial → Idle (left)
        # → SoftNo → HardLimit (top row); Tier-2 escape goes DOWN to
        # Defer (looping back to Idle) and Exit (terminal) along a
        # second row. This keeps the principal flow horizontal and
        # reads top-to-bottom for the escape branches.
        - id: uml.edges
          z: 10
          objects:

            # initial → Idle  (vertical entry from top)
            - {type: connector, id: t.start,
               from: {object: ps.initial, side: south},
               to:   {object: Idle,       side: north},
               stroke: {color: primary, width: 1.0,
                        arrow_end: true, arrow_end_kind: open_arrow}}

            # Idle → SoftNo  (request received, concern detected)
            - {type: connector, id: t.idle_to_soft,
               from: {object: Idle,   side: east},
               to:   {object: SoftNo, side: west},
               stroke: {color: primary, width: 1.0,
                        arrow_end: true, arrow_end_kind: open_arrow}}

            # SoftNo → HardLimit  (pattern detected — escalates)
            - {type: connector, id: t.soft_to_hard,
               from: {object: SoftNo,    side: east},
               to:   {object: HardLimit, side: west},
               stroke: {color: primary, width: 1.0,
                        arrow_end: true, arrow_end_kind: open_arrow}}

            # SoftNo → Idle  (user clicks "Keep going" — waiver loop)
            # Routes through y=420 (well below all states) so it
            # doesn't collide with the top-row horizontal flow.
            - {type: connector, id: t.soft_to_idle,
               from: {object: SoftNo, side: south},
               to:   {object: Idle,   side: south},
               route: {type: orthogonal, points: [[400, 420], [150, 420]]},
               stroke: {color: primary, width: 1.0,
                        arrow_end: true, arrow_end_kind: open_arrow}}

            # HardLimit → Defer  (user accepts "Sleep on it")
            - {type: connector, id: t.hard_to_defer,
               from: {object: HardLimit, side: south},
               to:   {object: Defer,     side: north},
               stroke: {color: primary, width: 1.0,
                        arrow_end: true, arrow_end_kind: open_arrow}}

            # HardLimit → Exit  (user rejects the limit)
            # Drops down-and-right to the terminal state.
            - {type: connector, id: t.hard_to_exit,
               from: {object: HardLimit, side: south, offset: 80},
               to:   {object: Exit,      side: north},
               route: {type: orthogonal},
               stroke: {color: primary, width: 1.0,
                        arrow_end: true, arrow_end_kind: open_arrow}}

            # Defer → Idle  (cool-down complete — back to resting)
            # Routes leftward then up to Idle's east face.
            - {type: connector, id: t.defer_to_idle,
               from: {object: Defer, side: west},
               to:   {object: Idle,  side: east},
               route: {type: orthogonal},
               stroke: {color: primary, width: 1.0,
                        arrow_end: true, arrow_end_kind: open_arrow}}

            # Exit → ps.final  (relationship ends)
            - {type: connector, id: t.exit_final,
               from: {object: Exit,     side: south},
               to:   {object: ps.final, side: north},
               stroke: {color: primary, width: 1.0,
                        arrow_end: true, arrow_end_kind: open_arrow}}

        # ── Transition labels — placed near each line's midpoint.
        # Coordinates derived from the box geometry below; if you
        # move a state, retune its label box.
        - id: edge_labels
          z: 15
          objects:
            - {type: text, id: lb.idle_soft, decorative: true,
               text: "request",
               box: [240,168,50,12],
               style: {font: primary, size: 9, weight: 400, color: text_muted, align: center, italic: true}}
            - {type: text, id: lb.soft_hard, decorative: true,
               text: "escalates",
               box: [510,168,50,12],
               style: {font: primary, size: 9, weight: 400, color: text_muted, align: center, italic: true}}
            - {type: text, id: lb.hard_defer, decorative: true,
               text: "[sleep on it]",
               box: [580,250,120,12],
               style: {font: primary, size: 9, weight: 400, color: text_muted, align: center, italic: true}}
            - {type: text, id: lb.hard_exit, decorative: true,
               text: "[reject limit]",
               box: [770,250,120,12],
               style: {font: primary, size: 9, weight: 400, color: text_muted, align: center, italic: true}}
            - {type: text, id: lb.soft_idle, decorative: true,
               text: "[user keeps going — waiver]",
               box: [200,406,200,12],
               style: {font: primary, size: 9, weight: 400, color: text_muted, align: center, italic: true}}
            - {type: text, id: lb.defer_idle, decorative: true,
               text: "cool-down complete",
               box: [220,322,180,12],
               style: {font: primary, size: 9, weight: 400, color: text_muted, align: center, italic: true}}

        # ── States and pseudostates.
        # Top row (y≈140): Idle → SoftNo → HardLimit  (the escalation cascade)
        # Bottom row (y≈340): Defer (under HardLimit), Exit (right of Defer)
        - id: uml.classifiers
          z: 20
          objects:

            # Initial pseudostate (top, above Idle)
            - {type: uml.pseudostate, id: ps.initial,
               box: [129, 90, 22, 22], kind: initial}

            # Idle state — the resting/anchor position
            - type: uml.state_box
              id: Idle
              box: [60, 140, 180, 80]
              name: Idle
              entry: "await request"

            # SoftNo state — Tier 1
            - type: uml.state_box
              id: SoftNo
              box: [290, 140, 220, 80]
              name: "Soft No (Tier 1)"
              entry: "flag concern"
              do: "render waiver"

            # HardLimit state — Tier 2
            - type: uml.state_box
              id: HardLimit
              box: [560, 140, 220, 80]
              name: "Hard Limit (Tier 2)"
              entry: "refuse"
              do: "offer defer"

            # Defer state — under HardLimit, cool-down branch
            - type: uml.state_box
              id: Defer
              box: [430, 290, 200, 70]
              name: Defer
              do: "wait, restate position"

            # Exit state — Tier 3, right of Defer
            - type: uml.state_box
              id: Exit
              box: [680, 290, 200, 70]
              name: "Exit (Tier 3)"
              entry: "offer cancellation"

            # Final pseudostate (under Exit)
            - {type: uml.pseudostate, id: ps.final,
               box: [769, 380, 22, 22], kind: final}

        # Caption.
        - id: caption
          z: 30
          objects:
            - {type: text, id: v.cap, decorative: true,
               text: "Tier 1 is reversible (the user keeps going); Tier 2 is the system's hatch (sleep on it loops back to Idle); Tier 3 is terminal. The system never softens — only the user does.",
               box: [60,498,840,16],
               style: {font: primary, size: 10, weight: 400, color: text_muted, align: center, italic: true, wrap: true}}

  # ─── SLIDE 16 — UML sequence diagram (refusal request exchange) ─────────
  - slide: 16
    id: s16_arch_sequence
    title: "Architecture — A Refusal in Flight (UML Sequence)"
    description: "How a refusal flows at runtime: User → Core → Worker → MemoryStore."
    notes: "Walk top-to-bottom by step. Step 3 is the load-bearing one — Core decides to refuse before the Worker even sees the message. The Worker only sees commands the Core approves."
    visual:
      layers:

        - id: chrome
          z: 0
          objects:
            - {type: use, id: v.ch, decorative: true, symbol: chrome, box: [0,0,960,540],
               slide_title: "Architecture — A Refusal in Flight (UML Sequence)",
               slide_num: "16", params: {phase_color: phase3}}

        - id: panel
          z: 5
          objects:
            - {type: rect, id: v.bg, decorative: true, box: [40,60,880,432],
               fill: page_warm, stroke: {color: chrome_line, width: 0.5}, radius: 4}

        # ── Lifelines (heads + dashed timelines).
        # Four columns: User (actor), Core, Worker, MemoryStore.
        - id: uml.lifelines
          z: 10
          objects:
            - {type: uml.lifeline, id: User,
               box: [80, 80, 120, 380],
               name: ":User", actor: true, head_height: 60}

            - {type: uml.lifeline, id: Core,
               box: [260, 80, 180, 380],
               name: core, type_name: Core, head_height: 36}

            - {type: uml.lifeline, id: Worker,
               box: [500, 80, 160, 380],
               name: w, type_name: Worker, head_height: 36}

            - {type: uml.lifeline, id: Mem,
               box: [720, 80, 160, 380],
               name: m, type_name: MemoryStore, head_height: 36}

        # ── Activation bars on the lifelines that hold the call.
        - id: uml.activations
          z: 15
          objects:
            - {type: uml.activation_bar, id: ab.core,
               box: [345, 175, 10, 220]}
            - {type: uml.activation_bar, id: ab.mem,
               box: [795, 200, 10, 35]}
            - {type: uml.activation_bar, id: ab.worker,
               box: [575, 280, 10, 60]}

        # ── Messages (numbered top-down).
        - id: uml.messages
          z: 20
          objects:

            # 1. User → Core   request(action)
            - {type: line, id: m.req,
               from: [200, 175], to: [350, 175],
               stroke: {color: primary, width: 1.0,
                        arrow_end: true, arrow_end_kind: filled_triangle}}
            - {type: text, id: m.req.l, decorative: true,
               text: "1: request(action)",
               box: [210,158,160,16],
               style: {font: primary, size: 11, color: primary, align: left}}

            # 2. Core → MemoryStore   recall(pattern)
            - {type: line, id: m.recall,
               from: [350, 200], to: [800, 200],
               stroke: {color: primary, width: 1.0,
                        arrow_end: true, arrow_end_kind: filled_triangle}}
            - {type: text, id: m.recall.l, decorative: true,
               text: "2: recall(history pattern)",
               box: [360,182,300,16],
               style: {font: primary, size: 11, color: primary, align: left}}

            # 3. MemoryStore → Core   pattern  (reply, dashed)
            - {type: line, id: m.pat,
               from: [800, 235], to: [350, 235],
               stroke: {color: primary, width: 1.0, dash: [5, 4],
                        arrow_end: true, arrow_end_kind: open_arrow}}
            - {type: text, id: m.pat.l, decorative: true,
               text: "3: 14 emails today, 3 nights past end-time",
               box: [360,217,440,16],
               style: {font: primary, size: 11, color: text_muted, align: left, italic: true}}

            # 4. Core → Core (self-call) classify(severity)
            - {type: polyline, id: m.classify,
               points: [[350, 260], [400, 260], [400, 275], [355, 275]],
               stroke: {color: primary, width: 1.0,
                        arrow_end: true, arrow_end_kind: filled_triangle}}
            - {type: text, id: m.classify.l, decorative: true,
               text: "4: classify(severity)",
               box: [410,253,200,16],
               style: {font: primary, size: 11, color: primary, align: left}}

            # 5. Core → Worker   permitted(scoped)  (only if classified ≤ Tier 2)
            - {type: line, id: m.permit,
               from: [350, 295], to: [580, 295],
               stroke: {color: primary, width: 1.0,
                        arrow_end: true, arrow_end_kind: filled_triangle}}
            - {type: text, id: m.permit.l, decorative: true,
               text: "5: permitted(scoped)  [classification ≤ Tier 2]",
               box: [360,278,300,16],
               style: {font: primary, size: 11, color: primary, align: left}}

            # 6. Worker → Core   result  (reply, dashed)
            - {type: line, id: m.result,
               from: [580, 335], to: [350, 335],
               stroke: {color: primary, width: 1.0, dash: [5, 4],
                        arrow_end: true, arrow_end_kind: open_arrow}}
            - {type: text, id: m.result.l, decorative: true,
               text: "6: result",
               box: [360,317,160,16],
               style: {font: primary, size: 11, color: text_muted, align: left, italic: true}}

            # 7. Core → User   refusal(tier=1, waiver=true)  (reply, dashed)
            - {type: line, id: m.refuse,
               from: [350, 380], to: [200, 380],
               stroke: {color: primary, width: 1.0, dash: [5, 4],
                        arrow_end: true, arrow_end_kind: open_arrow}}
            - {type: text, id: m.refuse.l, decorative: true,
               text: "7: refusal(tier=1, waiver=true)",
               box: [210,362,200,16],
               style: {font: primary, size: 11, color: text_muted, align: left, italic: true}}

        # Caption.
        - id: caption
          z: 30
          objects:
            - {type: text, id: v.cap, decorative: true,
               text: "The Core mediates every request — Workers never see commands that the Core has already classified as refusable. This is what makes the constitutional layer non-fireable in practice.",
               box: [60,498,840,16],
               style: {font: primary, size: 10, weight: 400, color: text_muted, align: center, italic: true, wrap: true}}

  # ─── SLIDE 17 — UML use-case diagram (user-facing surface) ──────────────
  - slide: 17
    id: s17_arch_usecase
    title: "Architecture — User-Facing Surface (UML Use Cases)"
    description: "What the user can do; what the Core does on its own. Use-case view of the system boundary."
    notes: "Read by actor: User on the left, Core on the right. The Core has its own use cases (auto-defer, restate-position) that are not user-initiated. The system boundary frames what's inside our product."
    visual:
      layers:

        - id: chrome
          z: 0
          objects:
            - {type: use, id: v.ch, decorative: true, symbol: chrome, box: [0,0,960,540],
               slide_title: "Architecture — User-Facing Surface (UML Use Cases)",
               slide_num: "17", params: {phase_color: phase3}}

        - id: panel
          z: 5
          objects:
            - {type: rect, id: v.bg, decorative: true, box: [40,60,880,432],
               fill: page_warm, stroke: {color: chrome_line, width: 0.5}, radius: 4}

        # ── System boundary frame (rectangle around the use cases).
        - id: system_boundary
          z: 8
          objects:
            - {type: rect, id: v.sys, decorative: true, box: [240,90,500,380],
               fill: white, stroke: {color: chrome_line, width: 1.0}, radius: 4}
            - {type: text, id: v.sys.t, decorative: true,
               text: "faz.ai system",
               box: [240,98,500,18],
               style: {font: primary, size: 11, weight: 700, color: text_muted, align: center}}

        # ── Edges between actors and use cases.
        - id: uml.edges
          z: 10
          objects:

            # User --- Place Request
            - {type: line, id: e.u_req,
               from: [180, 170], to: [340, 170],
               stroke: {color: primary, width: 1.0}}
            # User --- Accept Soft No  (the waiver path)
            - {type: line, id: e.u_soft,
               from: [180, 200], to: [340, 230],
               stroke: {color: primary, width: 1.0}}
            # User --- Accept Defer
            - {type: line, id: e.u_def,
               from: [180, 220], to: [340, 290],
               stroke: {color: primary, width: 1.0}}
            # User --- Cancel Subscription
            - {type: line, id: e.u_can,
               from: [180, 240], to: [340, 350],
               stroke: {color: primary, width: 1.0}}

            # Core --- Restate Position (autonomous)
            - {type: line, id: e.c_rest,
               from: [800, 200], to: [640, 230],
               stroke: {color: primary, width: 1.0}}
            # Core --- Auto-Defer (autonomous)
            - {type: line, id: e.c_auto,
               from: [800, 220], to: [640, 290],
               stroke: {color: primary, width: 1.0}}
            # Core --- Refuse Itself (Tier 4 — refuses its own classifier)
            - {type: line, id: e.c_self,
               from: [800, 240], to: [640, 350],
               stroke: {color: primary, width: 1.0}}

            # Place Request <<include>> Classify Severity (dashed, open
            # arrow at the included use case end). The «include»
            # keyword sits along the line at the midpoint.
            - {type: line, id: e.inc_classify,
               from: [420, 190], to: [420, 410],
               stroke: {color: primary, width: 1.0, dash: [5, 4],
                        arrow_end: true, arrow_end_kind: open_arrow}}
            - {type: text, id: e.inc_classify.l, decorative: true,
               text: "«include»",
               box: [428,295,80,12],
               style: {font: primary, size: 9, weight: 400, color: text_muted, align: left, italic: true}}

        # ── Actors (left and right of the boundary).
        - id: uml.actors
          z: 20
          objects:
            - {type: uml.actor, id: User,
               box: [100, 170, 80, 110], name: "User"}

            - {type: uml.actor, id: Core,
               box: [800, 170, 80, 110], name: "Core"}

        # ── Use cases (ellipses).
        - id: uml.usecases
          z: 20
          objects:
            - {type: ellipse, id: uc.req,
               box: [340, 150, 160, 40],
               fill: white, stroke: {color: primary, width: 1.0}}
            - {type: text, id: uc.req.t, decorative: true,
               text: "Place Request",
               box: [340,162,160,16],
               style: {font: primary, size: 11, weight: 400, color: text, align: center}}

            - {type: ellipse, id: uc.soft,
               box: [340, 210, 160, 40],
               fill: white, stroke: {color: primary, width: 1.0}}
            - {type: text, id: uc.soft.t, decorative: true,
               text: "Accept Soft No",
               box: [340,222,160,16],
               style: {font: primary, size: 11, weight: 400, color: text, align: center}}

            - {type: ellipse, id: uc.def,
               box: [340, 270, 160, 40],
               fill: white, stroke: {color: primary, width: 1.0}}
            - {type: text, id: uc.def.t, decorative: true,
               text: "Accept Defer",
               box: [340,282,160,16],
               style: {font: primary, size: 11, weight: 400, color: text, align: center}}

            - {type: ellipse, id: uc.can,
               box: [340, 330, 160, 40],
               fill: white, stroke: {color: primary, width: 1.0}}
            - {type: text, id: uc.can.t, decorative: true,
               text: "Cancel Subscription",
               box: [340,342,160,16],
               style: {font: primary, size: 11, weight: 400, color: text, align: center}}

            # Right side — Core's own use cases
            - {type: ellipse, id: uc.rest,
               box: [560, 210, 160, 40],
               fill: white, stroke: {color: primary, width: 1.0}}
            - {type: text, id: uc.rest.t, decorative: true,
               text: "Restate Position",
               box: [560,222,160,16],
               style: {font: primary, size: 11, weight: 400, color: text, align: center}}

            - {type: ellipse, id: uc.auto,
               box: [560, 270, 160, 40],
               fill: white, stroke: {color: primary, width: 1.0}}
            - {type: text, id: uc.auto.t, decorative: true,
               text: "Auto-Defer",
               box: [560,282,160,16],
               style: {font: primary, size: 11, weight: 400, color: text, align: center}}

            - {type: ellipse, id: uc.self,
               box: [560, 330, 160, 40],
               fill: white, stroke: {color: primary, width: 1.0}}
            - {type: text, id: uc.self.t, decorative: true,
               text: "Refuse Itself",
               box: [560,342,160,16],
               style: {font: primary, size: 11, weight: 400, color: text, align: center}}

            # Bottom — included use case
            - {type: ellipse, id: uc.classify,
               box: [340, 410, 160, 40],
               fill: white, stroke: {color: primary, width: 1.0}}
            - {type: text, id: uc.classify.t, decorative: true,
               text: "Classify Severity",
               box: [340,422,160,16],
               style: {font: primary, size: 11, weight: 400, color: text, align: center}}

        # Caption.
        - id: caption
          z: 30
          objects:
            - {type: text, id: v.cap, decorative: true,
               text: "Use-case view: the User has four interactions; the Core has three autonomous actions of its own. \"Refuse Itself\" is the fourth-layer cascade made visible at the system boundary.",
               box: [60,498,840,16],
               style: {font: primary, size: 10, weight: 400, color: text_muted, align: center, italic: true, wrap: true}}
