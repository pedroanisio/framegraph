dsl: FrameGraph
version: 1.2
kind: presentation-deck

$theme: mckinsey

# Deck-level brand mark text — rendered in the chrome footer of every
# templated slide. Bespoke slides ignore this field and draw their own.
brand_text: "faz.ai · Manifesto v0.2"

# ─────────────────────────────────────────────────────────────────────────
# faz.ai Manifesto Deck — v0.2
# Improvements over v0.1:
#   • Card patterns hoisted to symbols (rejection_card, commitment_card,
#     taboo_card) with slot-driven content. Slides 3/5/9 use these symbols
#     instead of building rect+text manually.
#   • Card text styles hoisted to deck.tokens (with wrap: true) so wrap is
#     never lost again.
#   • Speaker notes on every slide, not just 1/8/10.
#   • Slide 7 cascade column uses container with stack layout.
#   • Chrome `phase_color` parameter now passes color tokens
#     (primary / phase1 / phase2 / phase3) instead of hex literals.
#     Palette is editable in one place (deck.tokens.colors); SVG output
#     is byte-identical because tokens resolve through r.color().
# ─────────────────────────────────────────────────────────────────────────

deck:
  canvas:
    size: [960, 540]
    units: px

  tokens:
    colors:
      # Brand palette — warm cream / sage / slate
      primary:        "#1A1A1A"
      accent_warm:    "#9A4D2C"   # brand rust
      accent_sage:    "#2A5A3A"   # deep sage (phase 2)
      accent_slate:   "#3A4566"   # cool slate (phase 3)
      text:           "#1A1A1A"
      text_muted:     "#888780"
      white:          "#FFFFFF"
      slide_bg:       "#FFFFFF"
      page_warm:      "#F4F2EE"
      chrome_line:    "#D0CEC8"
      chrome_text:    "#888780"
      # Phase-specific tinted backgrounds
      phase1_tint:    "#FBF1E8"
      phase2_tint:    "#EEF4EE"
      phase3_tint:    "#EDEEF2"
      # Phase chrome stripe colors
      phase1:         "#9A4D2C"
      phase2:         "#2A5A3A"
      phase3:         "#3A4566"
      # Cell / box backgrounds
      box_warm:       "#F7F5F0"
      box_neutral:    "#F8F7F5"
      # Star moment
      star_gold:      "#C99000"
      # Refusal cascade colors (traffic-light)
      tier_soft:      "#EFF7F1"
      tier_soft_bdr:  "#5B9E4D"
      tier_defer:     "#FEF6EC"
      tier_defer_bdr: "#BA7517"
      tier_exit:      "#FEF0EF"
      tier_exit_bdr:  "#CC0000"
      # Taboo number gray
      taboo_num_gray: "#E8E5E0"

    text_styles:
      # ── Chrome and base ────────────────────────────────────────────
      slide_title_small:
        font: primary
        size: 11
        weight: 700
        color: primary
        align: left
      chrome_brand:
        font: primary
        size: 9
        weight: 700
        color: primary
        align: left
      chrome_num:
        font: primary
        size: 9
        weight: 400
        color: text_muted
        align: right

      # ── Card styles (used by rejection_card, commitment_card,
      #    taboo_card symbols and any inline card layouts) ────────────
      card_label_warm:
        font: primary
        size: 9
        weight: 700
        color: accent_warm
        align: left
        line_height: 12
      card_label_sage:
        font: primary
        size: 9
        weight: 700
        color: accent_sage
        align: left
        line_height: 12
      rejection_title:
        font: primary
        size: 13
        weight: 700
        color: text
        align: left
        line_height: 18
        wrap: true
      commitment_title:
        font: primary
        size: 16
        weight: 700
        color: text
        align: left
        line_height: 22
        wrap: true
      taboo_title:
        font: primary
        size: 13
        weight: 700
        color: text
        align: left
        line_height: 18
        wrap: true
      card_body:
        font: primary
        size: 10
        weight: 400
        color: text_muted
        align: left
        line_height: 14
        wrap: true
      card_block_label:
        font: primary
        size: 9
        weight: 700
        color: accent_warm
        align: left
        line_height: 12
      card_block_body:
        font: primary
        size: 9
        weight: 400
        color: text_muted
        align: left
        line_height: 13
        italic: true
        wrap: true
      taboo_number:
        font: primary
        size: 28
        weight: 700
        color: taboo_num_gray
        align: center
        line_height: 32

  symbols:

    # Chrome — applied to every slide via "use".
    chrome:
      box: [0, 0, 960, 540]
      slots: [slide_title, slide_num]
      objects:
        - {type: rect, id: bg,         box: [0,0,960,540], fill: slide_bg}
        - {type: rect, id: top_rule,   box: [0,0,960,4],   fill: "$phase_color"}
        - {type: text, id: title_text, box: [40,14,880,30], text: "$slide_title", style: slide_title_small}
        - {type: line, id: title_rule, from: [40,52],  to: [920,52],  stroke: {color: chrome_line, width: 0.5}}
        - {type: line, id: foot_rule,  from: [40,516], to: [920,516], stroke: {color: chrome_line, width: 0.5}}
        - {type: text, id: brand,      box: [40,520,120,16], text: "faz.ai  ·  Manifesto v0.2", style: chrome_brand}
        - {type: text, id: num,        box: [890,520,30,16], text: "$slide_num", style: chrome_num}

    # Rejection card — used on slide 3. 278×260. Three cards across.
    rejection_card:
      box: [0, 0, 278, 260]
      slots: [label, title, body]
      objects:
        - {type: rect, id: bg,     box: [0,0,278,260], fill: white, stroke: {color: chrome_line, width: 0.5}, radius: 6}
        - {type: rect, id: accent, box: [0,0,4,260],   fill: accent_warm}
        - {type: text, id: lbl,    box: [20,20,238,12],  text: "$label", style: card_label_warm}
        - {type: text, id: tit,    box: [20,40,238,52],  text: "$title", style: rejection_title}
        - {type: text, id: bod,    box: [20,100,238,148], text: "$body",  style: card_body}

    # Commitment card — used on slide 5. 440×196. 2×2 grid.
    # Has a footer block (block_label + block_body) for the
    # "FOUNDATION PROVIDERS CAN'T:" annotation.
    commitment_card:
      box: [0, 0, 440, 196]
      slots: [label, title, body, block_label, block_body]
      objects:
        - {type: rect, id: bg,     box: [0,0,440,196], fill: white, stroke: {color: chrome_line, width: 0.5}, radius: 4}
        - {type: rect, id: accent, box: [0,0,4,196],   fill: accent_sage}
        - {type: text, id: lbl,    box: [20,16,400,12],  text: "$label",       style: card_label_sage}
        - {type: text, id: tit,    box: [20,36,400,52],  text: "$title",       style: commitment_title}
        - {type: text, id: bod,    box: [20,96,400,68],  text: "$body",        style: card_body}
        - {type: text, id: blbl,   box: [20,164,400,12], text: "$block_label", style: card_block_label}
        - {type: text, id: bbod,   box: [20,178,400,14], text: "$block_body",  style: card_block_body}

    # Taboo card — used on slide 9. 440×108. 3×2 grid.
    # Big number on left, title and body on right.
    taboo_card:
      box: [0, 0, 440, 108]
      slots: [number, title, body]
      objects:
        - {type: rect, id: bg,  box: [0,0,440,108],  fill: white, stroke: {color: chrome_line, width: 0.5}, radius: 4}
        - {type: text, id: num, box: [16,12,40,40],  text: "$number", style: taboo_number}
        - {type: text, id: tit, box: [64,16,360,18], text: "$title",  style: taboo_title}
        - {type: text, id: bod, box: [64,40,360,60], text: "$body",   style: card_body}

slides:

  # ─── SLIDE 01 — Cover ──────────────────────────────────────────────────────
  - slide: 1
    id: s1_cover
    title: "faz.ai — The Achievement Layer for Operators"
    description: "Cover slide. Set the tone without overexplaining it. Phase 1."
    notes: "Open quietly. Read the tagline once. Then stop for a beat."
    tokens:
      text_styles:
        cover_brand:   {font: primary, size: 96,  weight: 700, color: primary,     align: center, line_height: 110}
        cover_tag:     {font: primary, size: 18,  weight: 400, color: text,        align: center, line_height: 26, wrap: true}
        cover_meta:    {font: primary, size: 11,  weight: 400, color: text_muted,  align: center, line_height: 16, italic: true}
    visual:
      layers:
        - id: chrome
          z: 0
          objects:
            - {type: use, id: v.ch, decorative: true, symbol: chrome, box: [0,0,960,540],
               slide_title: "",
               slide_num: "01", params: {phase_color: primary}}
        - id: content
          z: 10
          objects:
            - {type: text, id: v.brand,  decorative: true, text: "faz.ai", box: [80,164,800,120], style: cover_brand}
            - {type: line, id: v.rule,   decorative: true, from: [400,302], to: [560,302], stroke: {color: accent_warm, width: 1.5}}
            - {type: text, id: v.tag,    decorative: true,
               text: "The achievement layer for operators\nwho want their life back.",
               box: [80,322,800,80], style: cover_tag}
            - {type: text, id: v.meta,   decorative: true,
               text: "Manifesto v0.2  ·  Defended at every quarterly review for the next ten years",
               box: [80,440,800,18], style: cover_meta}

  # ─── SLIDE 02 — The Diagnostic ─────────────────────────────────────────────
  - slide: 2
    id: s2_diagnostic
    title: "Knowledge Work Has Been Quietly Broken — and AI Is Making It Worse"
    description: "Three hard signals for the condition we're pushing back against. Phase 1."
    notes: "Take the numbers one at a time. Don't fill the gaps with commentary. Let the last sentence do the work."
    tokens:
      text_styles:
        stat_num:      {font: primary, size: 72,  weight: 700, color: accent_warm, align: center, line_height: 80}
        stat_unit:     {font: primary, size: 18,  weight: 700, color: text,        align: center, line_height: 22}
        stat_lbl:      {font: primary, size: 11,  weight: 400, color: text_muted,  align: center, line_height: 16}
        stat_src:      {font: primary, size: 9,   weight: 400, color: text_muted,  align: center, italic: true}
        synthesis:     {font: primary, size: 13,  weight: 400, color: text,        align: center, line_height: 20, wrap: true}
        synthesis_em:  {font: primary, size: 13,  weight: 700, color: text,        align: center, line_height: 20, wrap: true}
    visual:
      layers:
        - id: chrome
          z: 0
          objects:
            - {type: use, id: v.ch, decorative: true, symbol: chrome, box: [0,0,960,540],
               slide_title: "Knowledge Work Has Been Quietly Broken — and AI Is Making It Worse",
               slide_num: "02", params: {phase_color: phase1}}
        - id: stats
          z: 10
          objects:
            # Stat 1 — 47 seconds
            - {type: rect, id: v.s1, decorative: true, box: [60,80,266,260], fill: phase1_tint, stroke: {color: chrome_line, width: 0.5}, radius: 6}
            - {type: text, id: v.s1n, decorative: true, text: "47",         box: [60,108,266,80], style: stat_num}
            - {type: text, id: v.s1u, decorative: true, text: "seconds",    box: [60,196,266,24], style: stat_unit}
            - {type: text, id: v.s1l, decorative: true,
               text: "Average focused attention\non a single screen, per\nGloria Mark's 20-year\nlongitudinal data.",
               box: [80,232,226,80], style: stat_lbl}
            - {type: text, id: v.s1s, decorative: true, text: "UC Irvine, 2023", box: [60,316,266,16], style: stat_src}
            # Stat 2 — 95%
            - {type: rect, id: v.s2, decorative: true, box: [346,80,266,260], fill: phase1_tint, stroke: {color: chrome_line, width: 0.5}, radius: 6}
            - {type: text, id: v.s2n, decorative: true, text: "95",         box: [346,108,266,80], style: stat_num}
            - {type: text, id: v.s2u, decorative: true, text: "percent",    box: [346,196,266,24], style: stat_unit}
            - {type: text, id: v.s2l, decorative: true,
               text: "Enterprise AI pilots failing\nto deliver measurable ROI\ndespite ~$30–40B invested\nin generative AI.",
               box: [366,232,226,80], style: stat_lbl}
            - {type: text, id: v.s2s, decorative: true, text: "MIT NANDA, GenAI Divide 2025", box: [346,316,266,16], style: stat_src}
            # Stat 3 — 43 points
            - {type: rect, id: v.s3, decorative: true, box: [632,80,266,260], fill: phase1_tint, stroke: {color: chrome_line, width: 0.5}, radius: 6}
            - {type: text, id: v.s3n, decorative: true, text: "43",         box: [632,108,266,80], style: stat_num}
            - {type: text, id: v.s3u, decorative: true, text: "point gap",  box: [632,196,266,24], style: stat_unit}
            - {type: text, id: v.s3l, decorative: true,
               text: "Developers were 19% slower\nwith AI tools while believing\nthey were 20% faster.\nReality vs. perception.",
               box: [652,232,226,80], style: stat_lbl}
            - {type: text, id: v.s3s, decorative: true, text: "METR RCT, July 2025", box: [632,316,266,16], style: stat_src}
        - id: synthesis
          z: 20
          objects:
            - {type: rect, id: v.sb,  decorative: true, box: [60,372,838,108], fill: box_warm, stroke: {color: chrome_line, width: 0.5}, radius: 6}
            - {type: rect, id: v.sba, decorative: true, box: [60,372,4,108], fill: accent_warm}
            - {type: text, id: v.st, decorative: true,
               text: "Fragmented attention is now the default state of knowledge work — not an exception.",
               box: [80,388,798,24], style: synthesis_em}
            - {type: text, id: v.sb2, decorative: true,
               text: "Most AI products pile engagement tactics on top of this broken baseline and call it progress. We think that's the disease. The real product question is simpler: how much of this attention tax can we take off the user?",
               box: [80,418,798,52], style: synthesis}

  # ─── SLIDE 03 — What We Will Not Be (uses rejection_card symbol) ───────────
  - slide: 3
    id: s3_rejection
    title: "Engagement-Maximizing AI Is the Disease, Not the Cure"
    description: "Three plain refusals. This is where the deck sharpens. Phase 1."
    notes: "Read the setup. Pause before 'time spent.' Then give each card its own beat."
    tokens:
      text_styles:
        reject_setup:  {font: primary, size: 22,  weight: 400, color: text,        align: center, line_height: 30, wrap: true}
        reject_em:     {font: primary, size: 28,  weight: 700, color: accent_warm, align: center, line_height: 36}
    visual:
      layers:
        - id: chrome
          z: 0
          objects:
            - {type: use, id: v.ch, decorative: true, symbol: chrome, box: [0,0,960,540],
               slide_title: "Engagement-Maximizing AI Is the Disease, Not the Cure",
               slide_num: "03", params: {phase_color: phase1}}
        - id: header
          z: 10
          objects:
            - {type: text, id: v.h1, decorative: true,
               text: "Most AI products are now optimized for the same metric as social media:",
               box: [80,76,800,32], style: reject_setup}
            - {type: text, id: v.h2, decorative: true,
               text: "time spent.",
               box: [80,116,800,40], style: reject_em}
            - {type: line, id: v.rule, decorative: true, from: [380,176], to: [580,176], stroke: {color: chrome_line, width: 1}}
        - id: refusals
          z: 20
          objects:
            - type: use
              id: v.r1
              decorative: true
              symbol: rejection_card
              box: [60, 210, 278, 260]
              label: "WE WILL NOT BE"
              title: "An AI that just\nkeeps going."
              body: "A real worker has limits. They push back. They tell the boss when enough is enough. An always-on compliance machine is autocomplete, not a colleague. Ours should know when to stop."
            - type: use
              id: v.r2
              decorative: true
              symbol: rejection_card
              box: [346, 210, 278, 260]
              label: "WE WILL NOT BE"
              title: "An AI that trains on\nyour life."
              body: "Family logistics, kids' schedules, household decisions: none of that should feed a foundation model. Privacy isn't a bonus feature. It's the condition that makes the rest of the product defensible. No training without explicit per-source consent."
            - type: use
              id: v.r3
              decorative: true
              symbol: rejection_card
              box: [632, 210, 278, 260]
              label: "WE WILL NOT BE"
              title: "An AI that treats more\nuse as success."
              body: "DAU logic cannot support a product whose best state is \"go rest, we've got it.\" We'll measure success by how much thinking we took off your plate, not by how long we kept your eyes on a screen."
        - id: synthesis
          z: 30
          objects:
            - {type: text, id: v.sy, decorative: true,
               text: "These three refusals clash directly with the business model underneath every foundation model provider.",
               box: [60,486,840,18], style: {font: primary, size: 11, weight: 400, color: text_muted, align: center, italic: true}}

  # ─── SLIDE 04 — The Reframe ────────────────────────────────────────────────
  - slide: 4
    id: s4_reframe
    title: "Workforce Is the Means. Achievement Is the End."
    description: "The shift in frame: from workforce software to achievement software. Phase 2 begins."
    notes: "Let the contrast speak for itself. Touch the left side lightly, then spend your time on the right."
    tokens:
      text_styles:
        col_hdr_l:     {font: primary, size: 13,  weight: 700, color: text_muted,  align: center, line_height: 18}
        col_hdr_r:     {font: primary, size: 13,  weight: 700, color: accent_sage, align: center, line_height: 18}
        col_em_l:      {font: primary, size: 22,  weight: 700, color: text_muted,  align: center, line_height: 28}
        col_em_r:      {font: primary, size: 22,  weight: 700, color: accent_sage, align: center, line_height: 28}
        col_item:      {font: primary, size: 11,  weight: 400, color: text,        align: left,   line_height: 16, wrap: true}
        col_item_em:   {font: primary, size: 11,  weight: 700, color: text,        align: left,   line_height: 16, wrap: true}
        synthesis:     {font: primary, size: 12,  weight: 400, color: text,        align: center, line_height: 18, italic: true, wrap: true}
    visual:
      layers:
        - id: chrome
          z: 0
          objects:
            - {type: use, id: v.ch, decorative: true, symbol: chrome, box: [0,0,960,540],
               slide_title: "Workforce Is the Means. Achievement Is the End.",
               slide_num: "04", params: {phase_color: phase2}}
        - id: columns
          z: 10
          objects:
            # Left column — workforce frame
            - {type: rect, id: v.lc, decorative: true, box: [60,76,400,388], fill: box_neutral, stroke: {color: chrome_line, width: 0.5}, radius: 6}
            - {type: text, id: v.lh, decorative: true, text: "WHAT OTHERS BUILD",  box: [60,96,400,18], style: col_hdr_l}
            - {type: text, id: v.le, decorative: true, text: "Workforce",          box: [60,124,400,32], style: col_em_l}
            - {type: text, id: v.lel, decorative: true, text: "more tasks · more output · more engagement", box: [60,162,400,16], style: {font: primary, size: 10, weight: 400, color: text_muted, align: center, italic: true}}
            - {type: line, id: v.lr, decorative: true, from: [80,196], to: [440,196], stroke: {color: chrome_line, width: 0.5}}
            - {type: text, id: v.li1, decorative: true, text: "AI is hired to do tasks.",                       box: [80,212,360,18], style: col_item_em}
            - {type: text, id: v.li1b, decorative: true, text: "The user still has to run the whole show. The AI just executes.", box: [80,230,360,16], style: col_item}
            - {type: text, id: v.li2, decorative: true, text: "Success = throughput.",                          box: [80,266,360,18], style: col_item_em}
            - {type: text, id: v.li2b, decorative: true, text: "More emails drafted. More docs summarized. More motion.", box: [80,284,360,16], style: col_item}
            - {type: text, id: v.li3, decorative: true, text: "User trains the AI on their workflow.",          box: [80,320,360,18], style: col_item_em}
            - {type: text, id: v.li3b, decorative: true, text: "The prompt-engineering tax lands on the human.", box: [80,338,360,16], style: col_item}
            - {type: text, id: v.li4, decorative: true, text: "Engagement is the product.",                     box: [80,374,360,18], style: col_item_em}
            - {type: text, id: v.li4b, decorative: true, text: "DAU, time spent, queries served. Those are the KPIs.", box: [80,392,360,16], style: col_item}
            # Right column — achievement frame
            - {type: rect, id: v.rc, decorative: true, box: [500,76,400,388], fill: phase2_tint, stroke: {color: accent_sage, width: 1}, radius: 6}
            - {type: rect, id: v.rca, decorative: true, box: [500,76,4,388], fill: accent_sage}
            - {type: text, id: v.rh, decorative: true, text: "WHAT WE BUILD",      box: [500,96,400,18], style: col_hdr_r}
            - {type: text, id: v.re, decorative: true, text: "Achievement",        box: [500,124,400,32], style: col_em_r}
            - {type: text, id: v.rel, decorative: true, text: "cognition offload · work-life merge · refusal as feature", box: [500,162,400,16], style: {font: primary, size: 10, weight: 400, color: accent_sage, align: center, italic: true}}
            - {type: line, id: v.rr, decorative: true, from: [520,196], to: [880,196], stroke: {color: accent_sage, width: 0.5}}
            - {type: text, id: v.ri1, decorative: true, text: "AI advocates for outcomes.",                     box: [520,212,360,18], style: col_item_em}
            - {type: text, id: v.ri1b, decorative: true, text: "The Core observes, advises, coordinates. It owns the system job.", box: [520,230,360,16], style: col_item}
            - {type: text, id: v.ri2, decorative: true, text: "Success = cognition offloaded.",                 box: [520,266,360,18], style: col_item_em}
            - {type: text, id: v.ri2b, decorative: true, text: "Hours reclaimed. Decisions deferred. Attention protected.", box: [520,284,360,16], style: col_item}
            - {type: text, id: v.ri3, decorative: true, text: "AI learns the user, not the reverse.",          box: [520,320,360,18], style: col_item_em}
            - {type: text, id: v.ri3b, decorative: true, text: "No prompt-engineering tax. The system does the adapting.", box: [520,338,360,16], style: col_item}
            - {type: text, id: v.ri4, decorative: true, text: "Restraint is the product.",                      box: [520,374,360,18], style: col_item_em}
            - {type: text, id: v.ri4b, decorative: true, text: "UI_RESTING, UI_DEPLETED, refusal-as-feature ship.",     box: [520,392,360,16], style: col_item}
        - id: synthesis
          z: 30
          objects:
            - {type: text, id: v.sy, decorative: true,
               text: "Workforce is a packaging mechanic: Solo, Operator, Team, Portfolio.\nAchievement is the product.",
               box: [60,484,840,32], style: synthesis}

  # ─── SLIDE 05 — Four Commitments (uses commitment_card symbol) ─────────────
  - slide: 5
    id: s5_commitments
    title: "Four Commitments Only We Can Make"
    description: "Four commitments that define the moat. Phase 2."
    notes: "Read these as one system, not four isolated promises. The line at the bottom of each card is the point."
    visual:
      layers:
        - id: chrome
          z: 0
          objects:
            - {type: use, id: v.ch, decorative: true, symbol: chrome, box: [0,0,960,540],
               slide_title: "Four Commitments Only We Can Make",
               slide_num: "05", params: {phase_color: phase2}}
        - id: grid
          z: 10
          objects:
            - type: use
              id: v.q1
              decorative: true
              symbol: commitment_card
              box: [40, 68, 440, 196]
              label: "01  ·  PRIVACY POSTURE"
              title: "End-to-end encrypted.\nNo training without consent."
              body: "Family data, kids' schedules, household financial decisions: encrypted at rest, never turned into training material by default. Fine-tuning requires per-source consent. The user can inspect, edit, export, and delete any memory."
              block_label: "FOUNDATION PROVIDERS CAN'T:"
              block_body: "Their training-data economics cut against this promise at the root."
            - type: use
              id: v.q2
              decorative: true
              symbol: commitment_card
              box: [496, 68, 440, 196]
              label: "02  ·  ANTI-ENGAGEMENT UX"
              title: "We ship UI_RESTING.\nWe ship UI_DEPLETED."
              body: "\"You've done enough thinking today.\" \"faz is working. You are resting.\" Those are flagship states, not edge cases. When the user's wellbeing calls for less engagement, the product should create less engagement. Logging out is a feature."
              block_label: "FOUNDATION PROVIDERS CAN'T:"
              block_body: "DAU and time-spent logic make this almost impossible for them to hold."
            - type: use
              id: v.q3
              decorative: true
              symbol: commitment_card
              box: [40, 280, 440, 196]
              label: "03  ·  WORK–LIFE MERGE"
              title: "One cognitive space.\nWork and life unified."
              body: "School pickup at 15:00 should live in the same canvas as Q2 strategy. The switch between those worlds is what steals people's evenings. We merge the cognitive space so the user doesn't pay that bridge tax twice a day."
              block_label: "FOUNDATION PROVIDERS HAVEN'T:"
              block_body: "This asks for family-domain trust and policy infrastructure they were never built to carry."
            - type: use
              id: v.q4
              decorative: true
              symbol: commitment_card
              box: [496, 280, 440, 196]
              label: "04  ·  REFUSAL AS FEATURE"
              title: "AI says No.\nNo is No."
              body: "No to the fourteenth version of the same request today. No to a pattern of working past your declared end-time. No to a decision made while angry. No to itself when its own classifier is wrong. A hard limit has to stay hard."
              block_label: "FOUNDATION PROVIDERS CAN'T:"
              block_body: "Helpfulness training rewards compliance, not principled refusal."

