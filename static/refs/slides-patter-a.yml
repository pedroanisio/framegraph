slide_template_patterns:
- id: 1
  name: Title Slide
  layout_disposition: Full-bleed or clean centered composition with a large title, optional subtitle, logo, date, and presenter
    name.
  zones:
  - role: title
    size: large
    placement: &id001
      anchor:
        h: center
        v: middle
  - role: subtitle
    size: medium
    placement:
      relative:
        relation: below
        target: title
  - role: metadata
    size: small
    placement:
      anchor:
        h: left
        v: bottom
- id: 2
  name: Section Divider
  layout_disposition: Minimal slide separating major sections, usually with a large section number and title.
  zones:
  - role: section_number
    size: large
    placement: &id028
      anchor:
        h: left
        v: top
  - role: section_title
    size: large
    placement: &id023
      anchor:
        h: center
        v: middle
  - role: decorative_element
    size: variable
    placement:
      anchor:
        h: center
        v: middle
- id: 3
  name: Agenda Slide
  layout_disposition: Vertical numbered list of topics, often with the current section highlighted.
  zones:
  - role: heading
    size: medium
    placement: &id002
      anchor:
        h: center
        v: top
  - role: agenda_items
    size: large
    placement: *id001
  - role: progress_indicator
    size: small
    placement: &id022
      anchor:
        h: right
        v: bottom
- id: 4
  name: Executive Summary
  layout_disposition: Top headline followed by three to five key summary blocks or cards.
  zones:
  - role: headline
    size: large
    placement: *id002
  - role: summary_cards
    size: equal
    placement: &id009
      anchor:
        h: center
        v: middle
  - role: takeaway
    size: medium
    placement: &id006
      anchor:
        h: center
        v: bottom
- id: 5
  name: Problem Statement
  layout_disposition: Large problem headline with supporting evidence, pain points, or context blocks.
  zones:
  - role: problem_headline
    size: large
    placement: &id003
      anchor:
        h: left
        v: top
  - role: evidence
    size: medium
    placement: &id010
      anchor:
        h: right
        v: bottom
  - role: pain_points
    size: medium
    placement:
      anchor:
        h: center
        v: bottom
    shape: list
- id: 6
  name: Solution Overview
  layout_disposition: Central solution concept surrounded by benefits, capabilities, or supporting pillars.
  zones:
  - role: solution_name
    size: large
    placement: *id001
  - role: benefits
    size: medium
    placement:
      relative:
        relation: around
        target: solution_name
    shape: card
  - role: visual
    size: medium
    placement:
      anchor:
        h: left
        v: middle
- id: 7
  name: Before / After
  layout_disposition: Two-column contrast layout showing current state versus future state.
  zones:
  - role: before
    size: medium
    placement: &id007
      anchor:
        h: left
        v: middle
  - role: after
    size: medium
    placement: &id008
      anchor:
        h: right
        v: middle
  - role: transition_arrow
    size: small
    placement: *id001
- id: 8
  name: Comparison Table
  layout_disposition: Rows of criteria compared across two or more options.
  zones:
  - role: heading
    size: medium
    placement: *id002
  - role: table
    size: large
    placement: *id001
  - role: highlight
    size: contextual
    placement:
      region: matrix_body
- id: 9
  name: Feature Matrix
  layout_disposition: Grid comparing products, plans, or capabilities against feature rows.
  zones:
  - role: feature_rows
    size: medium
    placement: &id013
      anchor:
        h: left
        v: middle
    shape: list
  - role: option_columns
    size: equal
    placement: &id014
      anchor:
        h: center
        v: top
  - role: availability_cells
    size: equal
    placement: &id017
      region: matrix_body
- id: 10
  name: SWOT Analysis
  layout_disposition: 'Four-quadrant matrix: strengths, weaknesses, opportunities, and threats.'
  zones:
  - role: strengths
    size: equal
    placement: *id003
  - role: weaknesses
    size: equal
    placement: &id018
      anchor:
        h: right
        v: top
  - role: opportunities
    size: equal
    placement: &id025
      anchor:
        h: left
        v: bottom
  - role: threats
    size: equal
    placement: &id026
      anchor:
        h: right
        v: bottom
- id: 11
  name: Roadmap
  layout_disposition: Horizontal or vertical sequence of phases over time.
  zones:
  - role: time_axis
    size: full
    placement: &id011
      anchor:
        h: center
        v: bottom
  - role: phases
    size: medium
    placement: &id004
      relative:
        relation: 'on'
        target: timeline_axis
    shape: card
  - role: milestones
    size: small
    placement:
      relative:
        relation: inside
        target: phases
- id: 12
  name: Timeline
  layout_disposition: Linear chronological layout with events placed along a time axis.
  zones:
  - role: timeline_axis
    size: full
    placement:
      anchor:
        h: center
        v: middle
  - role: event_markers
    size: small
    placement: *id004
  - role: event_descriptions
    size: medium
    placement:
      relative:
        relation: around
        target: timeline_axis
- id: 13
  name: Milestone Tracker
  layout_disposition: Progress-oriented sequence showing completed, active, and upcoming milestones.
  zones:
  - role: milestone_sequence
    size: equal
    placement: *id001
  - role: status_indicators
    size: small
    placement:
      relative:
        relation: 'on'
        target: milestone_sequence
  - role: dates
    size: small
    placement:
      relative:
        relation: below
        target: milestone_sequence
- id: 14
  name: Process Flow
  layout_disposition: Step-by-step flow connected by arrows or connectors.
  zones:
  - role: process_steps
    size: equal
    placement:
      anchor:
        h: left
        v: middle
    shape: card
  - role: connectors
    size: small
    placement: &id024
      relative:
        relation: between
        target: process_steps
  - role: explanation
    size: contextual
    placement:
      relative:
        relation: below
        target: process_steps
- id: 15
  name: Workflow Diagram
  layout_disposition: Operational flow showing actors, systems, decisions, and handoffs.
  zones:
  - role: actors
    size: variable
    placement:
      region: swimlanes
  - role: workflow_nodes
    size: medium
    placement:
      relative:
        relation: inside
        target: actors
    shape: card
  - role: connectors
    size: small
    placement: &id015
      relative:
        relation: between
        target: nodes
    shape: connector
- id: 16
  name: Funnel Diagram
  layout_disposition: Descending stacked segments representing conversion stages.
  zones:
  - role: funnel_stages
    size: equal
    placement: &id005
      anchor:
        h: center
        v: middle
  - role: metrics
    size: medium
    placement:
      relative:
        relation: inside
        target: funnel_stages
  - role: stage_labels
    size: small
    placement:
      anchor:
        h: left
        v: middle
- id: 17
  name: Flywheel Diagram
  layout_disposition: Circular loop showing reinforcing stages or feedback cycles.
  zones:
  - role: circular_flow
    size: large
    placement: *id001
  - role: cycle_steps
    size: equal
    placement:
      relative:
        relation: around
        target: circular_flow
  - role: central_concept
    size: medium
    placement: *id001
- id: 18
  name: Pyramid Diagram
  layout_disposition: Stacked hierarchy from broad base to focused top.
  zones:
  - role: hierarchy_layers
    size: equal
    placement: *id005
  - role: labels
    size: medium
    placement: &id021
      relative:
        relation: inside
        target: system_layers
  - role: explanation
    size: contextual
    placement:
      anchor:
        h: right
        v: middle
- id: 19
  name: Venn Diagram
  layout_disposition: Overlapping circles showing shared and distinct attributes.
  zones:
  - role: circle_a
    size: large
    placement:
      relative:
        relation: left_of
        target: intersection
  - role: circle_b
    size: large
    placement:
      relative:
        relation: right_of
        target: intersection
  - role: intersection
    size: medium
    placement:
      relative:
        relation: inside
        target: intersection
  - role: labels
    size: small
    placement:
      relative:
        relation: inside
        target: circle_a
- id: 20
  name: Matrix / 2x2 Grid
  layout_disposition: Two-axis grid dividing content into four conceptual zones.
  zones:
  - role: x_axis
    size: full
    placement: *id006
  - role: y_axis
    size: full
    placement: &id012
      anchor:
        h: left
        v: middle
  - role: quadrants
    size: equal
    placement:
      region: matrix_body
- id: 21
  name: Quadrant Analysis
  layout_disposition: Four-quadrant analysis with items plotted by two variables.
  zones:
  - role: axis_labels
    size: small
    placement:
      anchor:
        h: left
        v: middle
  - role: plotted_items
    size: small
    placement:
      region: quadrant
    shape: marker
  - role: recommended_zone
    size: contextual
    placement:
      region: quadrant
- id: 22
  name: Scorecard
  layout_disposition: Compact evaluation table with criteria, scores, status, and notes.
  zones:
  - role: criteria
    size: medium
    placement: *id007
  - role: scores
    size: medium
    placement:
      anchor:
        h: center
        v: middle
    shape: metric
  - role: status
    size: small
    placement: *id008
    shape: icon
  - role: notes
    size: small
    placement:
      anchor:
        h: right
        v: middle
- id: 23
  name: KPI Dashboard
  layout_disposition: Dashboard grid with key metrics, charts, and status indicators.
  zones:
  - role: kpi_cards
    size: equal
    placement: &id019
      anchor:
        h: center
        v: top
  - role: charts
    size: large
    placement: *id009
  - role: insights
    size: medium
    placement:
      anchor:
        h: right
        v: bottom
- id: 24
  name: Metrics Snapshot
  layout_disposition: Large numeric indicators with short labels and trends.
  zones:
  - role: metric_numbers
    size: xl
    placement: &id016
      anchor:
        h: center
        v: middle
  - role: labels
    size: small
    placement:
      relative:
        relation: below
        target: metric_numbers
  - role: trend_indicators
    size: small
    placement:
      relative:
        relation: near
        target: metric_numbers
- id: 25
  name: Data Chart Slide
  layout_disposition: Single dominant chart with title, legend, and insight annotation.
  zones:
  - role: chart
    size: xl
    placement: *id001
  - role: title
    size: medium
    placement: *id002
  - role: legend
    size: small
    placement: *id010
  - role: insight_annotation
    size: medium
    placement:
      relative:
        relation: near
        target: chart
- id: 26
  name: Bar Chart Slide
  layout_disposition: Categorical comparison using horizontal or vertical bars.
  zones:
  - role: bar_chart
    size: large
    placement: *id001
  - role: category_axis
    size: full
    placement:
      anchor:
        h: left
        v: bottom
    shape: axis
  - role: value_axis
    size: full
    placement: *id011
    shape: axis
  - role: callout
    size: medium
    placement:
      relative:
        relation: near
        target: bar_chart
- id: 27
  name: Line Chart Slide
  layout_disposition: Trend visualization over time with one or more lines.
  zones:
  - role: line_chart
    size: large
    placement: *id001
  - role: time_axis
    size: full
    placement: *id006
  - role: value_axis
    size: full
    placement: *id012
  - role: trend_annotation
    size: medium
    placement:
      relative:
        relation: near
        target: line_chart
- id: 28
  name: Pie / Donut Chart Slide
  layout_disposition: Circular proportion chart with labels and a central or side insight.
  zones:
  - role: chart
    size: large
    placement:
      anchor:
        h: left
        v: middle
  - role: labels
    size: small
    placement:
      relative:
        relation: around
        target: chart
  - role: key_takeaway
    size: medium
    placement:
      relative:
        relation: inside
        target: chart
- id: 29
  name: Waterfall Chart Slide
  layout_disposition: Sequential bars showing positive and negative contributions to a final value.
  zones:
  - role: waterfall_chart
    size: large
    placement: *id001
  - role: start_value
    size: medium
    placement:
      region: waterfall_start
    shape: bar
  - role: changes
    size: variable
    placement:
      anchor:
        h: center
        v: middle
  - role: end_value
    size: medium
    placement:
      region: waterfall_end
    shape: bar
- id: 30
  name: Heatmap Slide
  layout_disposition: Grid where intensity indicates magnitude, risk, score, or frequency.
  zones:
  - role: matrix_grid
    size: large
    placement: *id001
  - role: row_labels
    size: small
    placement: *id013
  - role: column_labels
    size: small
    placement: *id014
  - role: color_legend
    size: small
    placement: *id010
- id: 31
  name: Map / Geographic Slide
  layout_disposition: Map-centered slide with regional markers, labels, or overlays.
  zones:
  - role: map
    size: xl
    placement:
      anchor:
        h: center
        v: middle
  - role: markers
    size: small
    placement:
      region: map_overlay
  - role: regional_metrics
    size: medium
    placement:
      anchor:
        h: right
        v: middle
- id: 32
  name: Org Chart
  layout_disposition: Hierarchical tree of people, teams, or reporting relationships.
  zones:
  - role: root_node
    size: medium
    placement: &id020
      anchor:
        h: center
        v: top
    shape: card
  - role: child_nodes
    size: medium
    placement:
      anchor:
        h: center
        v: bottom
    shape: card
  - role: connectors
    size: small
    placement: *id015
    shape: connector
- id: 33
  name: Team Introduction
  layout_disposition: Grid of profile cards with photo, name, role, and short bio.
  zones:
  - role: profile_cards
    size: equal
    placement: *id016
  - role: photos
    size: medium
    placement:
      relative:
        relation: inside
        target: profile_cards
  - role: names_roles
    size: small
    placement:
      relative:
        relation: below
        target: photos
  - role: heading
    size: medium
    placement: *id002
- id: 34
  name: Role & Responsibility Matrix
  layout_disposition: Matrix mapping roles to responsibilities, often using RACI symbols.
  zones:
  - role: roles
    size: equal
    placement: *id014
  - role: responsibilities
    size: equal
    placement: *id013
  - role: assignment_cells
    size: equal
    placement: *id017
- id: 35
