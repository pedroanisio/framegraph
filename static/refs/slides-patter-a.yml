  layout_disposition: Map of stakeholders positioned by influence, interest, or relationship.
  zones:
  - role: stakeholder_nodes
    size: variable
    placement:
      region: canvas
  - role: grouping_regions
    size: large
    placement:
      region: background
  - role: relationship_lines
    size: small
    placement: *id015
- id: 36
  name: Customer Persona
  layout_disposition: Profile layout with customer photo, demographics, needs, pains, and goals.
  zones:
  - role: persona_image
    size: large
    placement: *id012
  - role: demographics
    size: medium
    placement: *id018
  - role: needs_pains_goals
    size: medium
    placement:
      anchor:
        h: right
        v: bottom
    shape: card
  - role: quote
    size: medium
    placement:
      relative:
        relation: near
        target: persona_image
- id: 37
  name: Customer Journey Map
