  zones:
  - role: actor
    size: medium
    placement: *id012
  - role: scenario
    size: large
    placement: *id020
  - role: flow_steps
    size: large
    placement: *id001
    shape: sequence
  - role: outcome
    size: medium
    placement: *id010
- id: 39
