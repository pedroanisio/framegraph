          body: "pre-trained multimodal reasoning substrate"
          ports:
            north: [515, 402]
            east:  [680, 422]
            south: [515, 442]
        - type: component
          component: substrate_layer
          id: v.substrate.adaptation_grounding
          bind: substrate.adaptation_grounding
          box: [281, 448, 399, 40]      # v1.1: was y=429, now 448 (6px gap between rows)
          title: "Adaptation & Grounding Layer"
          body: "system prompts · fine-tuning · embeddings · RAG · memory · guardrails"
          ports:
            north: [515, 448]
            south: [515, 488]
        - type: component
          component: substrate_layer
          id: v.substrate.training_sources
          bind: substrate.training_sources
          box: [281, 494, 399, 40]      # v1.1: was y=471, now 494 (6px gap between rows)
          title: "Training & Knowledge Sources"
          body: "web · code · books · dialogue · enterprise data · synthetic data"
          ports:
            north: [515, 494]
            east:  [680, 514]

    # ------------------------------------------------------------------
    - id: feedback_annotation
      z: 70
      objects:
        - type: rect                     # v1.1: feedback loop now has a bounding box
          id: v.feedback.container
          bind: feedback.genai_loop
          box: [735, 378, 190, 120]
          radius: 6
          fill: feedback_fill
          stroke:
            color: dashed_blue
            width: 1
        - type: text
          id: v.feedback.title
          bind: feedback.genai_loop
          text: "GenAI feedback loop"
          box: [735, 383, 190, 17]
          style: heading
        - type: text
          id: v.feedback.body
          bind: feedback.genai_loop
          text: "multi-agent systems · chained models\nself-generated context\nsynthetic-data feedback"
          box: [735, 402, 190, 42]
          style: tiny
        - type: text                     # v1.1: repositioned to avoid overlap with feedback box
          id: v.training_influence.label
          bind: edge.training_sources_to_model
          text: "pre-training /\npost-training\ninfluence"
          box: [700, 456, 76, 52]
          style: body

    # ------------------------------------------------------------------
    - id: connectors
      z: 80
      objects:
        - type: connector
          id: v.conn.humans_to_orchestration
          bind: edge.humans_to_orchestration
          from: {object: v.actors.humans, port: east}
          to:   {object: v.orchestration.container, port: west_humans}
          route: {type: straight}
          stroke_style: direct_flow
        - type: connector
          id: v.conn.systems_to_orchestration
          bind: edge.systems_to_orchestration
          from: {object: v.actors.systems, port: east}
          to:   {object: v.orchestration.container, port: west_systems}
          route: {type: straight}
          stroke_style: direct_flow
        - type: connector
          id: v.conn.orchestration_to_human_outputs
          bind: edge.orchestration_to_human_outputs
          from: {object: v.orchestration.container, port: east_human_outputs}
          to:   {object: v.outcomes.human_facing_outputs, port: west}
          route: {type: straight}
          stroke_style: direct_flow
        - type: connector
          id: v.conn.orchestration_to_system_actions
          bind: edge.orchestration_to_system_actions
          from: {object: v.orchestration.container, port: east_system_actions}
          to:   {object: v.outcomes.system_facing_actions, port: west}
          route: {type: straight}
          stroke_style: direct_flow
        - type: connector
          id: v.conn.genai_systems_to_orchestration
          bind: edge.genai_systems_to_orchestration
          from: {object: v.actors.genai_systems, port: east}
          to:   {object: v.orchestration.container, port: west_genai}
          route: {type: straight}
          stroke_style: genai_loop
        - type: connector
          id: v.conn.orchestration_to_genai_outputs
          bind: edge.orchestration_to_genai_outputs
          from: {object: v.orchestration.container, port: east_genai_outputs}
          to:   {object: v.outcomes.genai_facing_outputs, port: west}
          route: {type: straight}
          stroke_style: genai_loop
        - type: connector                # v1.1: endpoint updated to reach feedback container
          id: v.conn.genai_outputs_to_feedback
          bind: edge.genai_outputs_to_feedback
          from: {object: v.outcomes.genai_facing_outputs, port: south}
          to:   {point: [737, 390]}
          route:
            type: orthogonal
            points: [[804, 364], [804, 390], [737, 390]]
          stroke_style: genai_loop
        - type: connector               # v1.1: endpoint updated for new substrate positions
          id: v.conn.runtime_grounding
          bind: edge.orchestration_to_foundation_model
          from: {object: v.orchestration.container, port: bottom_dependency}
          to:   {object: v.substrate.foundation_model, port: north}
          route: {type: straight}
          stroke_style: dependency
          label:
            text: "runtime grounding"
            box: [526, 363, 110, 16]
            style: tiny_left
        - type: connector               # v1.1: route updated for new substrate row positions
          id: v.conn.training_influence
          bind: edge.training_sources_to_model
          from: {object: v.substrate.training_sources, port: east}
          to:   {object: v.substrate.foundation_model, port: east}
          route:
            type: orthogonal
            points: [[680, 514], [698, 514], [698, 422], [680, 422]]
          stroke_style: influence

    # ------------------------------------------------------------------
    - id: legend
      z: 90
      objects:
        - type: rect
          id: v.legend.background
          bind: legend.main
          box: [21, 557, 913, 29]       # v1.1: moved down with taller canvas
          fill: legend_gray
        - type: legend
          id: v.legend.main
          bind: legend.main
          box: [55, 563, 870, 18]
          item_gap: 30
          items:
            - id: legend.direct_flow
              bind: DirectMediationFlow
              sample:
                type: line
                from: [57, 572]
                to:   [99, 572]
                stroke_style: direct_flow
              label:
                text: "direct mediation flow"
                box: [104, 565, 140, 16]
                style: legend
            - id: legend.genai_loop
              bind: RecursiveGenAIFlow
              sample:
                type: line
                from: [245, 572]
                to:   [283, 572]
                stroke_style: genai_loop
              label:
                text: "GenAI-to-GenAI recursive loop"
                box: [289, 565, 205, 16]
                style: legend
            - id: legend.dependency
              bind: GroundingDependency
              sample:
                type: line
                from: [485, 562]
                to:   [485, 582]
                stroke_style: dependency
              label:
                text: "dependency / grounding relationship"
                box: [493, 565, 235, 16]
                style: legend
            - id: legend.cross_cutting_control
              bind: ControlApplication
              sample:
                type: rounded_rect
                box:  [716, 566, 34, 13]
                radius: 3
                fill: governance_blue
                stroke:
                  color: governance_border
                  width: 1
              label:
                text: "cross-cutting control layer"
                box: [756, 565, 190, 16]
                style: legend

validation:
  required:
    - "semantic.nodes[*].id"
    - "semantic.edges[*].id"
    - "visual.layers[*].objects[*].id"
  rules:
    - "All non-decorative visual objects should have bind."
    - "All connectors should bind to a semantic edge."
    - "All connector endpoints should resolve to a declared port or point."
    - "Layer z values determine paint order; higher z paints on top."
    - "Manual text newlines are significant and should be preserved."
