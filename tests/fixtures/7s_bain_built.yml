  - id: center_circle
    z: 28
    objects:
    - type: ellipse
      id: v.circle.sv
      bind: node.shared_values
      box:
      - 420
      - 245
      - 120
      - 100
      fill: panel
      stroke_style: center_outline
      outer_ring:
        color: border_strong
        width: 2
        offset: 5
  - id: node_circles
    z: 30
    objects:
    - type: use
      id: v.node.str
      bind: node.structure
      symbol: s_node
      box:
      - 440
      - 80
      - 80
      - 80
      icon_glyph: structure
      params:
        fill: primary
    - type: use
      id: v.node.sy
      bind: node.systems
      symbol: s_node
      box:
      - 592
      - 168
      - 80
      - 80
      icon_glyph: systems
      params:
