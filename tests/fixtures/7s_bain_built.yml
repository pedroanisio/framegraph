dsl: FrameGraph
version: 1.1
kind: hybrid-semantic-visual-diagram
$theme: mckinsey
scene:
  id: mckinsey_7s
  name: McKinsey 7S — Bain style
  description: Seven interdependent factors — rendered in consulting firm style.
  canvas:
    size:
    - 960
    - 560
    units: px
  rendering_contract:
    coordinate_mode: absolute
    semantics:
      decorative_objects_may_omit_bind: true
semantic:
  ontology:
    node_types:
      SevenS:
        meaning: One of the seven S elements.
    edge_types:
      Interdependency:
        meaning: Bidirectional interdependency.
        directionality: bidirectional
  nodes:
  - id: node.shared_values
    type: SevenS
    label: Shared Values
  - id: node.structure
    type: SevenS
    label: Structure
  - id: node.systems
    type: SevenS
    label: Systems
  - id: node.strategy
    type: SevenS
    label: Strategy
  - id: node.style
    type: SevenS
    label: Style
  - id: node.staff
    type: SevenS
    label: Staff
  - id: node.skills
    type: SevenS
    label: Skills
  edges:
  - id: e.sv_str
    type: Interdependency
    from: node.shared_values
    to: node.structure
  - id: e.sv_sy
    type: Interdependency
    from: node.shared_values
    to: node.systems
  - id: e.sv_stg
    type: Interdependency
    from: node.shared_values
    to: node.strategy
  - id: e.sv_sty
    type: Interdependency
    from: node.shared_values
    to: node.style
  - id: e.sv_sta
    type: Interdependency
    from: node.shared_values
    to: node.staff
  - id: e.sv_sk
    type: Interdependency
    from: node.shared_values
    to: node.skills
  - id: e.str_sy
    type: Interdependency
    from: node.structure
    to: node.systems
  - id: e.sy_sty
    type: Interdependency
    from: node.systems
    to: node.style
  - id: e.sty_sta
    type: Interdependency
    from: node.style
    to: node.staff
  - id: e.sta_sk
    type: Interdependency
    from: node.staff
    to: node.skills
  - id: e.sk_stg
    type: Interdependency
    from: node.skills
    to: node.strategy
  - id: e.stg_str
    type: Interdependency
    from: node.strategy
    to: node.structure
visual:
  tokens:
    colors:
      primary: '#CC0000'
      primary_light: '#FF4444'
      secondary: '#003366'
      accent: '#FF6600'
      surface: '#FFFFFF'
      surface_tinted: '#FFF5F5'
      panel: '#F5E6E6'
      text: '#1A1A1A'
      text_muted: '#666666'
      border: '#E0CCCC'
      border_strong: '#CC0000'
      white: '#FFFFFF'
      data_1: '#CC0000'
      data_2: '#003366'
      data_3: '#FF6600'
      data_4: '#F5C6C6'
      data_5: '#5B9E4D'
      data_6: '#6AAFE6'
    fonts:
      primary: Arial, Helvetica, sans-serif
      heading: Arial, Helvetica, sans-serif
    glyph_map:
      structure: ≡
      systems: ⚙
      strategy: ♟
      staff: ⊕
      skills: ★
      style: ◆
    text_styles:
      slide_title:
        font: heading
        size: 22
        weight: 700
        color: primary
        align: left
        line_height: 26
      node_label:
        font: primary
        size: 13
        weight: 700
        color: text
        align: center
      node_desc:
        font: primary
        size: 9
        weight: 400
        color: text_muted
        align: center
        italic: true
      center_label:
        font: primary
        size: 13
        weight: 700
        color: secondary
        align: center
        line_height: 16
      icon_label:
        font: primary
        size: 22
        weight: 700
        color: white
        align: center
      title:
        font: heading
        size: 20
        weight: 700
        color: primary
        align: left
    stroke_styles:
      web:
        color: border
        width: 0.8
      circle_outline:
        color: primary
        width: 2.0
      center_outline:
        color: secondary
        width: 1.5
      accent_rule:
        color: primary
        width: 4.0
  layers:
  - id: background
    z: 0
    objects:
    - type: rect
      id: v.bg
      decorative: true
      box:
      - 0
      - 0
      - 960
      - 560
      fill: surface
    - type: rect
      id: v.slide
      decorative: true
      box:
      - 10
      - 15
      - 940
      - 534
      fill: white
      stroke:
        color: border
        width: 1
  - id: title_layer
    z: 10
    objects:
    - type: text
      id: v.title
      decorative: true
      text: McKinsey 7S Framework  ·  Bain style
      box:
      - 40
      - 24
      - 700
      - 26
      style: title
