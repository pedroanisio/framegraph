dsl: FrameGraph
version: 1.2
kind: presentation-deck

$theme: mckinsey

deck:
  canvas:
    size: [960, 540]
    units: px
  tokens:
    colors:
      phase1:       "#E35205"
      phase2:       "#009A44"
      phase3:       "#002060"
      chrome_line:  "#E0DDD8"
      chrome_text:  "#8C8A86"
      slide_bg:     "#FFFFFF"
      cell_win:     "#EAF6EE"
      cell_win_bdr: "#5B9E4D"
      cell_mid:     "#F5F3EF"
      cell_loss:    "#FEF6EC"
      cell_loss_bdr: "#BA7517"
      cell_risk:    "#FEF0EF"
      cell_risk_bdr: "#CC0000"
      cell_hdr:     "#EEF3FB"
      star_gold:    "#C99000"
      bar_fill:     "#002060"
      bar_fill_2:   "#E35205"
      grid_line:    "#EEE"
      tag_bg:       "#F0F0F0"
      tag_text:     "#555"
    text_styles:
      slide_title_small:
        font: primary
        size: 11
        weight: 700
        color: primary
        align: left
      chrome_brand:
        font: primary
        size: 9
        weight: 700
        color: primary
        align: left
      chrome_num:
        font: primary
        size: 9
        weight: 400
        color: text_muted
        align: right
      body_label:
        font: primary
        size: 9
        weight: 400
        color: text_muted
        align: left
      body_label_r:
        font: primary
        size: 9
        weight: 400
        color: text_muted
        align: right
      section_hdr:
        font: primary
        size: 11
        weight: 700
        color: primary
        align: left
      kicker:
        font: primary
        size: 10
        weight: 700
        color: accent_warm
        align: left
      caption:
        font: primary
        size: 9
        weight: 400
        color: text_muted
        align: center
        italic: true

  symbols:
    chrome:
      box: [0, 0, 960, 540]
      slots: [slide_title, slide_num]
      objects:
        - {type: rect, id: bg,         box: [0,0,960,540], fill: slide_bg}
        - {type: rect, id: top_rule,   box: [0,0,960,4],   fill: "$phase_color"}
        - {type: text, id: title_text, box: [40,14,880,30], text: "$slide_title", style: slide_title_small}
        - {type: line, id: title_rule, from: [40,52],  to: [920,52],  stroke: {color: chrome_line, width: 0.5}}
        - {type: line, id: foot_rule,  from: [40,516], to: [920,516], stroke: {color: chrome_line, width: 0.5}}
        - {type: text, id: brand,      box: [40,520,120,16], text: "Ginga One", style: chrome_brand}
        - {type: text, id: num,        box: [890,520,30,16], text: "$slide_num", style: chrome_num}

slides:

  # ─── SLIDE 01 — Opening Provocation ────────────────────────────────────────
  - slide: 1
    id: s1_opening
    title: "SP Enterprises Are Investing in Mobile and Not Getting Mobile Outcomes"
    description: "Opening provocation. Low density, high impact."
    tokens:
      text_styles:
        h_setup:  {font: primary, size: 32, weight: 700, color: primary,     align: center, line_height: 40}
        h_reveal: {font: primary, size: 32, weight: 700, color: accent_warm, align: center, line_height: 40}
        stakes:   {font: primary, size: 13, weight: 400, color: text_muted,  align: center, line_height: 20}
    visual:
      layers:
        - id: chrome
          z: 0
          objects:
            - {type: use, id: v.ch, decorative: true, symbol: chrome, box: [0,0,960,540],
               slide_title: "SP Enterprises Are Investing in Mobile and Not Getting Mobile Outcomes",
               slide_num: "01", params: {phase_color: "#E35205"}}
        - id: content
          z: 10
          objects:
            - {type: text, id: v.setup,  decorative: true, text: "Your mobile backlog is not a technology problem.", box: [80,148,800,52], style: h_setup}
            - {type: text, id: v.reveal, decorative: true, text: "It's a specialization problem.", box: [80,216,800,52], style: h_reveal}
            - {type: line, id: v.rule,   decorative: true, from: [320,284], to: [640,284], stroke: {color: "#D0CEC8", width: 1}}
            - {type: text, id: v.stakes, decorative: true,
               text: "SP enterprise mobile investment is growing 20–30% YoY.\nDelivery quality and velocity are not keeping pace.\nThis deck names why — and proposes a specific solution.",
               box: [180,300,600,72], style: stakes}

  # ─── SLIDE 02 — Market Context ─────────────────────────────────────────────
  - slide: 2
    id: s2_market
    title: "Mobile Is Now the Primary Commerce Surface in SP — Delivery Is Not Keeping Up"
    description: "Market context. Chart + stakes para. Phase 1."
    tokens:
      text_styles:
        chart_title: {font: primary, size: 13, weight: 700, color: primary,   align: left}
        axis_label:  {font: primary, size: 8,  weight: 400, color: text_muted, align: center}
        bar_val:     {font: primary, size: 9,  weight: 700, color: white,      align: center}
        callout_h:   {font: primary, size: 14, weight: 700, color: primary,    align: left,   line_height: 20}
        callout_b:   {font: primary, size: 11, weight: 400, color: text_muted, align: left,   line_height: 17}
        source_note: {font: primary, size: 8,  weight: 400, color: text_muted, align: left,   italic: true}
    visual:
      layers:
        - id: chrome
          z: 0
          objects:
            - {type: use, id: v.ch, decorative: true, symbol: chrome, box: [0,0,960,540],
               slide_title: "Mobile Is Now the Primary Commerce Surface in SP — Delivery Is Not Keeping Up",
               slide_num: "02", params: {phase_color: "#E35205"}}
        - id: chart_area
          z: 10
          objects:
            # Chart title
            - {type: text, id: v.ct, decorative: true, text: "SP E-commerce via mobile channel (YoY index, 2020 = 100)", box: [56,68,480,18], style: chart_title}
            # Grid lines
            - {type: line, id: v.g1, decorative: true, from: [56,380], to: [536,380], stroke: {color: "#EEEEEE", width: 0.5}}
            - {type: line, id: v.g2, decorative: true, from: [56,322], to: [536,322], stroke: {color: "#EEEEEE", width: 0.5}}
            - {type: line, id: v.g3, decorative: true, from: [56,264], to: [536,264], stroke: {color: "#EEEEEE", width: 0.5}}
            - {type: line, id: v.g4, decorative: true, from: [56,206], to: [536,206], stroke: {color: "#EEEEEE", width: 0.5}}
            - {type: line, id: v.g5, decorative: true, from: [56,148], to: [536,148], stroke: {color: "#EEEEEE", width: 0.5}}
            - {type: line, id: v.g0, decorative: true, from: [56,438], to: [536,438], stroke: {color: "#CCCCCC", width: 0.8}}
            # Y-axis labels
            - {type: text, id: v.y5, decorative: true, text: "250", box: [28,144,24,12], style: axis_label}
            - {type: text, id: v.y4, decorative: true, text: "200", box: [28,202,24,12], style: axis_label}
            - {type: text, id: v.y3, decorative: true, text: "150", box: [28,260,24,12], style: axis_label}
            - {type: text, id: v.y2, decorative: true, text: "100", box: [28,318,24,12], style: axis_label}
            - {type: text, id: v.y1, decorative: true, text: "50",  box: [28,376,24,12], style: axis_label}
            # Bars  (each bar: width=68, gap=20; x0=60)
            # 2020: 100 → height=58  y=380
            - {type: rect, id: v.b1, decorative: true, box: [60,380,68,58],   fill: bar_fill}
            - {type: text, id: v.v1, decorative: true, text: "100", box: [60,382,68,14], style: bar_val}
            - {type: text, id: v.x1, decorative: true, text: "2020", box: [60,442,68,12], style: axis_label}
            # 2021: 127 → height=73.7  y=306.3  →  y=306, h=74
            - {type: rect, id: v.b2, decorative: true, box: [148,306,68,74],  fill: bar_fill}
            - {type: text, id: v.v2, decorative: true, text: "127", box: [148,308,68,14], style: bar_val}
            - {type: text, id: v.x2, decorative: true, text: "2021", box: [148,442,68,12], style: axis_label}
            # 2022: 158 → height=91.6  y=288.4  →  y=288, h=92 (but 580*0.58=92 wait let me recalc)
            # Scale: 250 units = 290px (from y=148 to y=438). 1 unit = 1.16px
            # 2022: 158 → 158*1.16=183.3 → h=183, y=438-183=255
            - {type: rect, id: v.b3, decorative: true, box: [236,255,68,183], fill: bar_fill}
            - {type: text, id: v.v3, decorative: true, text: "158", box: [236,257,68,14], style: bar_val}
            - {type: text, id: v.x3, decorative: true, text: "2022", box: [236,442,68,12], style: axis_label}
            # 2023: 196 → 196*1.16=227 → h=227, y=438-227=211
            - {type: rect, id: v.b4, decorative: true, box: [324,211,68,227], fill: bar_fill}
            - {type: text, id: v.v4, decorative: true, text: "196", box: [324,213,68,14], style: bar_val}
            - {type: text, id: v.x4, decorative: true, text: "2023", box: [324,442,68,12], style: axis_label}
            # 2024: 242 → 242*1.16=281 → h=281, y=438-281=157
            - {type: rect, id: v.b5, decorative: true, box: [412,157,68,281], fill: bar_fill}
            - {type: text, id: v.v5, decorative: true, text: "242", box: [412,159,68,14], style: bar_val}
            - {type: text, id: v.x5, decorative: true, text: "2024", box: [412,442,68,12], style: axis_label}
            # Source
            - {type: text, id: v.src, decorative: true, text: "Source: ABComm / Ebit 2024; indices illustrative, directional only.", box: [56,468,480,14], style: source_note}

        - id: callout
          z: 20
          objects:
            - {type: rect, id: v.cbox, decorative: true, box: [576,68,348,400], fill: "#F7F5F0", stroke: {color: chrome_line, width: 0.5}, radius: 6}
            - {type: rect, id: v.cbar, decorative: true, box: [576,68,4,400],   fill: phase1}
            - {type: text, id: v.ch1, decorative: true, text: "2.4× growth in 4 years.", box: [592,90,316,28],  style: callout_h}
            - {type: text, id: v.cb1, decorative: true,
               text: "Mobile commerce in SP has compounded at roughly 25% annually. The channel is not emerging — it is primary.",
               box: [592,124,316,52], style: callout_b}
            - {type: line, id: v.sep1, decorative: true, from: [592,186], to: [900,186], stroke: {color: chrome_line, width: 0.5}}
            - {type: text, id: v.ch2, decorative: true, text: "Delivery has not kept pace.", box: [592,202,316,20], style: callout_h}
            - {type: text, id: v.cb2, decorative: true,
               text: "Mobile engineering teams in SP retail, logistics, and industrial report shipping velocity 30–50% below plan on average. The investment is real. The outcomes are not.",
               box: [592,230,316,72], style: callout_b}
            - {type: line, id: v.sep2, decorative: true, from: [592,316], to: [900,316], stroke: {color: chrome_line, width: 0.5}}
            - {type: text, id: v.ch3, decorative: true, text: "The gap is widening.", box: [592,332,316,20], style: callout_h}
            - {type: text, id: v.cb3, decorative: true,
               text: "Each quarter without a specialised delivery team raises the cost of recovery. This is the problem the next four slides quantify.",
               box: [592,358,316,52], style: callout_b}

  # ─── SLIDE 03 — Failure Patterns ───────────────────────────────────────────
  - slide: 3
    id: s3_patterns
    title: "Four Failure Patterns — One Root Cause"
    description: "Problem diagnosis. 4-quadrant layout."
    tokens:
      text_styles:
        quad_num:  {font: primary, size: 28, weight: 700, color: "#E8E5E0", align: left}
        quad_h:    {font: primary, size: 13, weight: 700, color: primary,   align: left, line_height: 18}
        quad_b:    {font: primary, size: 11, weight: 400, color: text_muted, align: left, line_height: 16}
        root_h:    {font: primary, size: 14, weight: 700, color: white,      align: center}
        root_b:    {font: primary, size: 11, weight: 400, color: white,      align: center, line_height: 16}
    visual:
      layers:
        - id: chrome
          z: 0
          objects:
            - {type: use, id: v.ch, decorative: true, symbol: chrome, box: [0,0,960,540],
               slide_title: "Four Failure Patterns — One Root Cause",
               slide_num: "03", params: {phase_color: "#E35205"}}
        - id: quads
          z: 10
          objects:
            # Q1 top-left
            - {type: rect, id: v.q1, decorative: true, box: [40,64,420,192],  fill: "#FAFAF8", stroke: {color: chrome_line, width: 0.5}, radius: 4}
            - {type: text, id: v.q1n, decorative: true, text: "01", box: [52,72,60,36], style: quad_num}
            - {type: text, id: v.q1h, decorative: true, text: "Generalist teams, mobile context",  box: [52,116,396,20], style: quad_h}
            - {type: text, id: v.q1b, decorative: true,
               text: "Teams assembled from web or backend engineers ship mobile features that ignore platform conventions, offline behaviour, and rendering performance.",
               box: [52,140,396,60], style: quad_b}
            # Q2 top-right
            - {type: rect, id: v.q2, decorative: true, box: [500,64,420,192], fill: "#FAFAF8", stroke: {color: chrome_line, width: 0.5}, radius: 4}
            - {type: text, id: v.q2n, decorative: true, text: "02", box: [512,72,60,36], style: quad_num}
            - {type: text, id: v.q2h, decorative: true, text: "Ramp-up consuming the sprint",    box: [512,116,396,20], style: quad_h}
            - {type: text, id: v.q2b, decorative: true,
               text: "Each new engagement starts from zero domain knowledge. Three to six sprints are lost to context-building before delivery begins.",
               box: [512,140,396,60], style: quad_b}
            # Q3 bottom-left
            - {type: rect, id: v.q3, decorative: true, box: [40,272,420,192], fill: "#FAFAF8", stroke: {color: chrome_line, width: 0.5}, radius: 4}
            - {type: text, id: v.q3n, decorative: true, text: "03", box: [52,280,60,36], style: quad_num}
            - {type: text, id: v.q3h, decorative: true, text: "Platform churn masking as progress", box: [52,324,396,20], style: quad_h}
            - {type: text, id: v.q3b, decorative: true,
               text: "Framework migrations (React Native → Flutter → Kotlin/Swift) absorb 40–60% of budget without shipping user-facing value.",
               box: [52,348,396,60], style: quad_b}
            # Q4 bottom-right
            - {type: rect, id: v.q4, decorative: true, box: [500,272,420,192], fill: "#FAFAF8", stroke: {color: chrome_line, width: 0.5}, radius: 4}
            - {type: text, id: v.q4n, decorative: true, text: "04", box: [512,280,60,36], style: quad_num}
            - {type: text, id: v.q4h, decorative: true, text: "Scope managed, quality deferred",   box: [512,324,396,20], style: quad_h}
            - {type: text, id: v.q4b, decorative: true,
               text: "Crash rates, accessibility gaps, and App Store rating decay accumulate in silence while velocity metrics look healthy.",
               box: [512,348,396,60], style: quad_b}
        - id: root_cause
          z: 20
          objects:
            - {type: rect, id: v.rc, decorative: true, box: [200,478,560,44], fill: primary, radius: 4}
            - {type: text, id: v.rch, decorative: true, text: "Root cause: no mobile specialization depth in the delivery team.", box: [200,478,560,44], style: root_h}

  # ─── SLIDE 04 — Compounding Debt ───────────────────────────────────────────
  - slide: 4
    id: s4_debt
    title: "Mobile Technical Debt Compounds — the Cost of Inaction Is Not Linear"
    description: "Tension / urgency. Stylised line chart."
    tokens:
      text_styles:
        chart_title: {font: primary, size: 13, weight: 700, color: primary,   align: left}
        legend_lbl:  {font: primary, size: 9,  weight: 700, color: text_muted, align: left}
        axis_lbl:    {font: primary, size: 8,  weight: 400, color: text_muted, align: center}
        callout_h:   {font: primary, size: 14, weight: 700, color: primary,    align: left, line_height: 20}
        callout_b:   {font: primary, size: 11, weight: 400, color: text_muted, align: left, line_height: 17}
        note:        {font: primary, size: 8,  weight: 400, color: text_muted, align: left, italic: true}
    visual:
      layers:
        - id: chrome
          z: 0
          objects:
            - {type: use, id: v.ch, decorative: true, symbol: chrome, box: [0,0,960,540],
               slide_title: "Mobile Technical Debt Compounds — the Cost of Inaction Is Not Linear",
               slide_num: "04", params: {phase_color: "#E35205"}}
        - id: chart
          z: 10
          objects:
            - {type: text, id: v.ct, decorative: true, text: "Relative recovery cost over time (stylised — directional only)", box: [56,68,480,18], style: chart_title}
            # Axes
            - {type: line, id: v.ax, decorative: true, from: [56,438], to: [536,438], stroke: {color: "#CCCCCC", width: 0.8}}
            - {type: line, id: v.ay, decorative: true, from: [56,108], to: [56,438],  stroke: {color: "#CCCCCC", width: 0.8}}
            # X-axis labels
            - {type: text, id: v.xq1, decorative: true, text: "Q1", box: [56,442,88,12],  style: axis_lbl}
            - {type: text, id: v.xq2, decorative: true, text: "Q2", box: [176,442,88,12], style: axis_lbl}
            - {type: text, id: v.xq3, decorative: true, text: "Q3", box: [296,442,88,12], style: axis_lbl}
            - {type: text, id: v.xq4, decorative: true, text: "Q4", box: [416,442,88,12], style: axis_lbl}
            # "No action" curve — red, steep
            - {type: polyline, id: v.p1, decorative: true,
               points: [[56,388],[176,338],[296,258],[416,148],[536,108]],
               stroke: {color: "#CC0000", width: 2, arrow_end: false}}
            # "Late intervention" — amber, moderate
            - {type: polyline, id: v.p2, decorative: true,
               points: [[56,388],[176,338],[296,298],[416,278],[536,258]],
               stroke: {color: "#BA7517", width: 2, arrow_end: false}}
            # "Engage now" — green, flat
            - {type: polyline, id: v.p3, decorative: true,
               points: [[56,388],[176,368],[296,348],[416,328],[536,318]],
               stroke: {color: "#009A44", width: 2.5, arrow_end: false}}
            # Legend
            - {type: rect, id: v.l1c, decorative: true, box: [56,456,12,4], fill: "#CC0000"}
            - {type: text, id: v.l1t, decorative: true, text: "No action", box: [74,452,120,12], style: legend_lbl}
            - {type: rect, id: v.l2c, decorative: true, box: [186,456,12,4], fill: "#BA7517"}
            - {type: text, id: v.l2t, decorative: true, text: "Late intervention (Q3+)", box: [204,452,160,12], style: legend_lbl}
            - {type: rect, id: v.l3c, decorative: true, box: [366,456,12,4], fill: "#009A44"}
            - {type: text, id: v.l3t, decorative: true, text: "Engage now", box: [384,452,120,12], style: legend_lbl}
            - {type: text, id: v.note, decorative: true,
               text: "Illustrative. Curve is stylised. Exact figures depend on context and are quantified during the Discovery Pilot.",
               box: [56,476,480,16], style: note}
        - id: callout
          z: 20
          objects:
            - {type: rect, id: v.cbox, decorative: true, box: [576,68,348,420], fill: "#F7F5F0", stroke: {color: chrome_line, width: 0.5}, radius: 6}
            - {type: rect, id: v.cbar, decorative: true, box: [576,68,4,420], fill: "#CC0000"}
            - {type: text, id: v.ch1, decorative: true, text: "30–50% per quarter.", box: [592,88,316,24], style: callout_h}
            - {type: text, id: v.cb1, decorative: true,
               text: "Unaddressed mobile technical debt in SP retail and logistics compounds at this rate. Teams that delay specialisation by two quarters face 2× the recovery cost.",
               box: [592,118,316,64], style: callout_b}
            - {type: line, id: v.sep, decorative: true, from: [592,194], to: [900,194], stroke: {color: chrome_line, width: 0.5}}
            - {type: text, id: v.ch2, decorative: true, text: "The intervention window is narrow.", box: [592,210,316,24], style: callout_h}
            - {type: text, id: v.cb2, decorative: true,
               text: "The cost curves diverge sharply after Q2. A specialised team engaged now is not a premium — it is the cheaper option over an 18-month horizon.",
               box: [592,242,316,64], style: callout_b}
            - {type: line, id: v.sep2, decorative: true, from: [592,318], to: [900,318], stroke: {color: chrome_line, width: 0.5}}
            - {type: text, id: v.ch3, decorative: true, text: "This is what the next slide proposes.", box: [592,334,316,24], style: callout_h}
            - {type: text, id: v.cb3, decorative: true,
               text: "Not a general mobile vendor. Not another generalist SI. A 13-year specialist in SP mobile — already embedded in your industry.",
               box: [592,364,316,52], style: callout_b}

  # ─── SLIDE 05 — Claim: Who Is Ginga One ────────────────────────────────────
  - slide: 5
    id: s5_claim
    title: "Ginga One — São Paulo's Longest-Running Mobile Boutique"
    description: "Pivot from problem to solution. Introduce Ginga One."
    tokens:
      text_styles:
        claim_h:   {font: primary, size: 28, weight: 700, color: primary, align: center, line_height: 36}
        claim_sub: {font: primary, size: 14, weight: 400, color: text_muted, align: center, line_height: 22}
        stat_num:  {font: primary, size: 36, weight: 700, color: primary, align: center}
        stat_lbl:  {font: primary, size: 10, weight: 400, color: text_muted, align: center, line_height: 14}
        tag_txt:   {font: primary, size: 10, weight: 700, color: primary, align: center}
    visual:
      layers:
        - id: chrome
          z: 0
          objects:
            - {type: use, id: v.ch, decorative: true, symbol: chrome, box: [0,0,960,540],
               slide_title: "Ginga One — São Paulo's Longest-Running Mobile Boutique",
               slide_num: "05", params: {phase_color: "#009A44"}}
        - id: content
          z: 10
          objects:
            - {type: text, id: v.h, decorative: true,
               text: "We do one thing.\nMobile. For SP enterprises.",
               box: [120,76,720,80], style: claim_h}
            - {type: line, id: v.rule, decorative: true, from: [320,170], to: [640,170], stroke: {color: chrome_line, width: 1}}
            - {type: text, id: v.sub, decorative: true,
               text: "Founded 2012. 13 years of uninterrupted mobile delivery across retail, logistics, and industrial sectors in São Paulo.",
               box: [120,182,720,40], style: claim_sub}
            # Three stats
            - {type: rect, id: v.s1, decorative: true, box: [80,248,240,160], fill: "#F7F5F0", stroke: {color: chrome_line, width: 0.5}, radius: 6}
            - {type: text, id: v.sn1, decorative: true, text: "13",  box: [80,268,240,52], style: stat_num}
            - {type: text, id: v.sl1, decorative: true, text: "years of mobile-only\ndelivery in São Paulo", box: [80,328,240,36], style: stat_lbl}
            - {type: rect, id: v.s2, decorative: true, box: [360,248,240,160], fill: "#F7F5F0", stroke: {color: chrome_line, width: 0.5}, radius: 6}
