  - id: 319
    name: Trust Boundary Map
    consulting_use: "Clarifies where data, systems, users, and vendors cross trust boundaries."
    layout_disposition: "System map with trust zones and boundary crossings."
    zones:
      - role: trust_zones
        position: background_regions
        size: containers
      - role: systems
        position: inside_zones
        size: nodes
      - role: boundary_crossings
        position: between_zones
        size: connectors
      - role: controls
        position: on_crossings
        size: labels

  - id: 320
    name: Governance by Risk Tier
    consulting_use: "Matches governance intensity to risk level."
    layout_disposition: "Risk tiers as rows with required controls, approvals, and monitoring."
    zones:
      - role: risk_tiers
        position: left_axis
        size: rows
      - role: required_controls
        position: center_left
        size: cells
      - role: approval_level
        position: center
        size: cells
      - role: monitoring_frequency
        position: center_right
        size: cells
      - role: escalation_rule
        position: right_column
        size: cells

  - id: 321
    name: Operating Cadence Map
    consulting_use: "Shows the rhythm of meetings, decisions, reviews, and reporting."
    layout_disposition: "Cadence calendar with daily, weekly, monthly, quarterly, and annual routines."
    zones:
      - role: cadence_levels
        position: left_axis
        size: rows
      - role: routines
        position: timeline_body
        size: cards
      - role: decision_outputs
        position: right_column
        size: list
      - role: escalation_links
        position: between_levels
        size: arrows

  - id: 322
    name: Metrics Integrity Slide
    consulting_use: "Validates whether KPIs are reliable, owned, and decision-useful."
    layout_disposition: "Metric quality table with definition, source, owner, latency, and use case."
    zones:
      - role: metrics
        position: left_column
        size: rows
      - role: definitions
        position: center_left
        size: text_cells
      - role: data_sources
        position: center
        size: cells
      - role: owners
        position: center_right
        size: cells
      - role: decision_use
        position: right_column
        size: text_cells

  - id: 323
    name: Minimum Viable Governance
    consulting_use: "Defines the lightest governance model sufficient for risk and quality."
    layout_disposition: "Governance controls organized by must-have, should-have, and optional layers."
    zones:
      - role: must_have_controls
        position: bottom_layer
        size: wide_band
      - role: should_have_controls
        position: middle_layer
        size: medium_band
      - role: optional_controls
        position: top_layer
        size: narrow_band
      - role: rationale
        position: right_panel
        size: notes

  - id: 324
    name: Complexity Reduction Slide
    consulting_use: "Identifies where complexity can be removed without losing value."
    layout_disposition: "Complexity sources mapped to simplification actions and expected benefits."
    zones:
      - role: complexity_sources
        position: left_column
        size: cards
      - role: simplification_actions
        position: center_column
        size: cards
      - role: retained_value
        position: right_column
        size: metric_cards
      - role: removal_risk
        position: bottom
        size: warning_notes

  - id: 325
    name: Executive Synthesis Slide
    consulting_use: "Final high-density synthesis combining conclusion, rationale, risk, and action."
    layout_disposition: "Single dominant conclusion supported by rationale, implications, risks, and next actions."
    zones:
      - role: conclusion
        position: top
