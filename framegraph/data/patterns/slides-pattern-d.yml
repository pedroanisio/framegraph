        position: columns
        size: equal
      - role: value_pools
        position: top_of_columns
        size: metric_cards
      - role: initiatives
        position: column_body
        size: bullet_lists
      - role: total_value_potential
        position: bottom
        size: highlighted_band

  - id: 161
