big4_consulting_slide_template_patterns_extension_75:
  - id: 151
    name: Transformation North Star
    consulting_use: "Aligns leadership around the future-state ambition."
    layout_disposition: "A large aspirational statement supported by strategic pillars and measurable outcomes."
    zones:
      - role: north_star_statement
        position: top_center
        size: dominant
      - role: strategic_pillars
        position: middle_row
        size: equal_cards
      - role: measurable_outcomes
        position: bottom_row
        size: metric_cards
      - role: visual_anchor
        position: background_or_center
        size: subtle_large

  - id: 152
    name: Strategic Imperatives
    consulting_use: "Summarizes the few must-win priorities for the organization."
    layout_disposition: "Three to six imperative cards arranged horizontally with rationale and implications."
    zones:
      - role: imperative_cards
        position: center_row
        size: equal_cards
      - role: rationale
        position: inside_each_card
        size: short_text
      - role: business_implication
        position: card_footer
        size: small
      - role: headline
        position: top
        size: large

  - id: 153
    name: Strategic Pillars
    consulting_use: "Groups the strategy into stable thematic pillars."
    layout_disposition: "Vertical or horizontal pillars supporting an overarching ambition."
    zones:
      - role: ambition
        position: top
        size: wide_band
      - role: pillars
        position: center
        size: equal_columns
      - role: initiatives
        position: below_each_pillar
        size: bullet_lists
      - role: outcomes
        position: bottom
        size: metric_row

  - id: 154
    name: Strategic Choices Cascade
    consulting_use: "Frames strategy as linked choices: where to play, how to win, capabilities, systems."
    layout_disposition: "Stacked cascade from ambition to choices to capabilities and management systems."
    zones:
      - role: aspiration
        position: top
        size: wide_block
      - role: where_to_play
        position: upper_middle
        size: block
      - role: how_to_win
        position: middle
        size: block
      - role: required_capabilities
        position: lower_middle
        size: block
      - role: management_systems
        position: bottom
        size: block

  - id: 155
    name: Strategy on a Page
    consulting_use: "Condenses full strategy into a single executive summary."
    layout_disposition: "One-page framework with vision, priorities, initiatives, KPIs, and governance."
    zones:
      - role: vision
        position: top
        size: dominant_band
      - role: strategic_priorities
        position: left_column
        size: cards
      - role: key_initiatives
        position: center
        size: grouped_cards
      - role: kpis
        position: right_column
        size: metric_cards
      - role: governance
        position: bottom
        size: horizontal_band

  - id: 156
    name: Ambition to Execution Map
    consulting_use: "Connects high-level ambition to executable initiatives."
    layout_disposition: "Vertical chain from ambition to outcomes, pillars, initiatives, owners, and metrics."
    zones:
      - role: ambition
        position: top
        size: large
      - role: outcomes
        position: upper_middle
        size: metric_cards
      - role: pillars
        position: middle
        size: columns
      - role: initiatives
        position: lower_middle
        size: cards
      - role: owners_metrics
        position: bottom
        size: table

  - id: 157
    name: Strategic Trade-Offs
    consulting_use: "Makes explicit what the organization will and will not do."
    layout_disposition: "Two-column or paired-card layout contrasting choices and exclusions."
    zones:
      - role: will_do
        position: left_column
        size: large_card
      - role: will_not_do
        position: right_column
        size: large_card
      - role: rationale
        position: bottom
        size: explanation_band
      - role: decision_principle
        position: top
        size: headline

  - id: 158
    name: Where to Play / How to Win
    consulting_use: "Defines target markets and competitive advantage."
    layout_disposition: "Two-panel strategy slide with market choices on the left and advantage choices on the right."
    zones:
      - role: where_to_play
        position: left_panel
        size: half_width
      - role: how_to_win
        position: right_panel
        size: half_width
      - role: proof_points
        position: bottom
        size: small_cards
      - role: implication
        position: top_or_bottom_callout
        size: highlighted

  - id: 159
    name: Strategic Coherence Check
    consulting_use: "Tests whether strategy elements reinforce one another."
    layout_disposition: "Matrix showing alignment between objectives, capabilities, initiatives, and KPIs."
    zones:
      - role: strategy_elements
        position: left_axis
        size: rows
      - role: alignment_dimensions
        position: top_axis
        size: columns
      - role: coherence_scores
        position: matrix_body
        size: cells
      - role: misalignment_notes
        position: right_panel
        size: callouts

  - id: 160
    name: Enterprise Value Creation Agenda
    consulting_use: "Frames value creation across revenue, margin, capital, risk, and organization."
    layout_disposition: "Multi-column agenda with value pools and linked initiatives."
    zones:
