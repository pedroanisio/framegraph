# FrameGraph Stylesheet — default
#
# Universal contract. Any deck whose slides are pattern references
# (`use: <id>` + `fill:`) renders as a *designed* deck — chrome,
# typography, and card structure all inherited from this stylesheet.
# Theme tokens (colors, fonts) come from `$theme:`; structure stays
# constant across themes; the deck author writes data only.
#
# This file references ONLY universal token names — the ones every
# bundled token pack guarantees:
#
#   colors:  primary, secondary, accent, text, text_muted,
#            surface, surface_tinted, panel, border, border_strong,
#            white, data_1..data_5
#   fonts:   primary, heading
#
# ── Resolution ──
#
# For each zone the framework matches `roles[]` top-to-bottom; the
# first rule whose `match` block applies wins. Most-specific rules
# come first. Match keys: content_type, size, h, v, role,
# placement_kind. Omitted keys are wildcards.
#
# ── Layers ──
#
#   slide_chrome   → header strip, footer band, page number, brand mark
#   treatments     → reusable card primitives (referenced by `roles`)
#   text_styles    → reusable typography (referenced by treatments / roles)
#   roles          → which treatment+typography to apply to each zone
#   zone_labels    → small heading band above every zone
#   synthesis_band → optional bottom band rendered when slide declares `synthesis:`

_meta:
  type:    stylesheet
  id:      default
  version: 2.0
  name:    "Default — universal designed-by-default stylesheet"

# ─────────────────────────────────────────────────────────────────
# Typography — eight named styles cover every chrome and card slot.
# Every color/font field references theme tokens. Themes swap freely.
# ─────────────────────────────────────────────────────────────────
text_styles:
  # Slide-chrome typography
  slide_title_band:
    font: heading
    size: 22
    weight: bold
    color: primary
    line_height: 26
    wrap: true
    v_align: middle
    align: left
  page_num:
    font: primary
    size: 10
    weight: 400
    color: text_muted
    align: right
    v_align: middle
  brand_mark:
    font: primary
    size: 10
    weight: bold
    color: text_muted
    align: left
    v_align: middle

  # Card-level slots
  card_number:
    font: heading
    size: 22
    weight: 300
    color: text_muted
    align: left
    v_align: top
    line_height: 22
  card_label:
    font: primary
    size: 8
    weight: bold
    color: accent
    align: left
    v_align: top
    line_height: 10
  card_title:
    font: heading
    size: 12
    weight: bold
    color: text
    align: left
    v_align: top
    line_height: 16
    wrap: true
  card_body:
    # Big-4 density default: 10pt with 1.3 line-height. Lets a
    # 4-item list or 5-row table fit a narrow card without
    # truncation or visual crush.
    font: primary
    size: 10
    weight: 400
    color: text
    align: left
    v_align: top
    line_height: 13
    wrap: true
  card_body_small:
    font: primary
    size: 9
    weight: 400
    color: text_muted
    align: left
    v_align: top
    line_height: 12
    wrap: true

  # Synthesis band typography
  synthesis_em:
    font: heading
    size: 13
    weight: bold
    color: white
    align: left
    line_height: 18
    wrap: true
  synthesis_body:
    font: primary
    size: 10
    weight: 400
    color: white
    align: left
    line_height: 14
    wrap: true

  # Table sub-styles — Big-4 density defaults
  table_header:
    font: primary
    size: 9
    weight: bold
    color: text
    align: left
    v_align: middle
  table_cell:
    font: primary
    size: 9
    weight: 400
    color: text
    align: left
    v_align: top
    line_height: 12
    wrap: true

  # Metric KPI display
  kpi_value:
    font: heading
    size: 36
    weight: bold
    color: primary
    align: left
    v_align: top
    line_height: 40
  kpi_label:
    font: primary
    size: 10
    weight: 400
    color: text_muted
    align: left

  # Axis label (charts)
  axis_label:
    font: primary
    size: 9
    weight: 400
    color: text_muted
    align: center

# ─────────────────────────────────────────────────────────────────
# Slide chrome — applied to every templated slide. The deck author
# never declares chrome; the stylesheet does. Theme provides colors.
# ─────────────────────────────────────────────────────────────────
slide_chrome:
  enabled: true

  # Top band — colored stripe + slide title
  top_stripe:
    height:    4
    color:     accent

  title_band:
    height:    52              # px reserved at the top of the canvas
    typography: slide_title_band
    margin_left:  32
    margin_right: 80           # leaves room for page number
    y_offset:     8            # below the stripe

  # Separator under the title band
  title_separator:
    color:     border
    width:     0.5
    y_offset:  56              # from canvas top

  # Footer
  footer:
    height:        24          # px reserved at the bottom of the canvas
    margin_left:   32
    margin_right:  32
    rule_color:    border
    rule_width:    0.5
    rule_y_offset: 0           # from top of footer band

  # Page number — top-right
  page_number:
    typography:    page_num
    format:        "{n:02d}"
    x_from_right:  32
    y:             18           # baseline-ish; renderer centers

  # Brand mark — bottom-left footer text. Defaults to deck.brand_text.
  brand_mark:
    typography:    brand_mark
    x:             32
    y_offset:      8           # within footer

# ─────────────────────────────────────────────────────────────────
# Synthesis band — optional bottom band rendered when a slide has
# `synthesis: "..."`. Single-line emphasis on a dark fill.
# ─────────────────────────────────────────────────────────────────
synthesis_band:
  enabled:        true
  height:         72
  margin_bottom:  36           # space between band and footer
  margin_left:    32
  margin_right:   32
  fill_color:     text         # solid dark
  accent_bar:
    side:         left
    width:        4
    color:        accent
  corner_radius:  4
  padding:        [14, 24, 14, 24]
  emphasis_typography: synthesis_em
  body_typography:     synthesis_body

# ─────────────────────────────────────────────────────────────────
# Treatments — reusable card primitives. The structured `card`
# treatment defines the universal slot grid: accent_bar, number,
# label, title, body. Every emitter renders into this grid.
# ─────────────────────────────────────────────────────────────────
treatments:
  card:
    # Big-4 density: tight padding, small label, body comes right
    # below it. A 4-bullet list at 10pt fits a 90px-tall card.
    fill_color:    surface
    stroke_color:  border
    stroke_width:  0.5
    corner_radius: 4
    accent_bar:
      side:        left
      width:       4
      color:       accent
    slots:
      number:      { typography: card_number, height: 22, x_offset: 16, width: 32, optional: true }
      label:       { typography: card_label,  height: 10, gap_below: 4 }
      title:       { typography: card_title,  height: 18, gap_below: 4, optional: true }
      body:        { typography: card_body,                gap_above: 0 }
    padding:       [10, 14, 10, 18]

  card_compact:
    fill_color:    surface
    stroke_color:  border
    stroke_width:  0.5
    corner_radius: 4
    accent_bar:
      side:        left
      width:       3
      color:       accent
    slots:
      label:       { typography: card_label,  height: 11, gap_below: 4 }
      body:        { typography: card_body_small }
    padding:       [10, 14, 10, 18]

  card_metric:
    fill_color:    surface_tinted
    stroke_color:  border
    stroke_width:  0
    corner_radius: 4
    accent_bar:
      side:        left
      width:       3
      color:       accent
    slots:
      label:       { typography: card_label,  height: 11, gap_below: 4 }
      kpi_value:   { typography: kpi_value,   height: 40, gap_below: 0 }
      kpi_trend:   { typography: card_body_small, optional: true }
    padding:       [12, 16, 12, 18]

  table:
    fill_color:    surface
    stroke_color:  border
    stroke_width:  0.5
    corner_radius: 4
    accent_bar:
      side:        left
      width:       3
      color:       accent
    slots:
      label:       { typography: card_label, height: 11, gap_below: 6 }
      table:       { header_typography: table_header, cell_typography: table_cell, header_fill: surface_tinted }
    padding:       [10, 0, 0, 18]   # right/bottom 0 — table uses full width

  chart:
    fill_color:    surface
    stroke_color:  border
    stroke_width:  0.5
    corner_radius: 4
    accent_bar:
      side:        left
      width:       3
      color:       accent
    slots:
      label:       { typography: card_label, height: 11, gap_below: 6 }
      chart:       { palette: [primary, accent, secondary, data_4, data_5] }
    padding:       [10, 14, 10, 18]

  divider:
    fill_color:   border
    stroke_color: border
    stroke_width: 1

# ─────────────────────────────────────────────────────────────────
# Zone labels — disabled by default now that the structured `card`
# treatment carries its own label slot. Patterns whose zones use a
# bare (untreated) emission can still opt in.
# ─────────────────────────────────────────────────────────────────
zone_labels:
  enabled: false

# ─────────────────────────────────────────────────────────────────
# Roles — match (content_type, size, placement) to a treatment.
# ─────────────────────────────────────────────────────────────────
roles:

  # ── title_body ────────────────────────────────────────────────
  - match: { content_type: title_body, size: xl }
    treatment: card
  - match: { content_type: title_body, size: full }
    treatment: card
  - match: { content_type: title_body, size: large }
    treatment: card
  - match: { content_type: title_body, size: medium }
    treatment: card
  - match: { content_type: title_body, size: small }
    treatment: card_compact
  - match: { content_type: title_body }
    treatment: card

  # ── list_items ────────────────────────────────────────────────
  - match: { content_type: list_items, size: small }
    treatment: card_compact
  - match: { content_type: list_items }
    treatment: card

  # ── metric ────────────────────────────────────────────────────
  - match: { content_type: metric }
    treatment: card_metric

  # ── key_value ─────────────────────────────────────────────────
  - match: { content_type: key_value }
    treatment: card_compact

  # ── comparison ────────────────────────────────────────────────
  - match: { content_type: comparison }
    treatment: card

  # ── table_data ────────────────────────────────────────────────
  - match: { content_type: table_data }
    treatment: table

  # ── chart_data ────────────────────────────────────────────────
  - match: { content_type: chart_data }
    treatment: chart

  # ── axis_label ────────────────────────────────────────────────
  - match: { content_type: axis_label }
    treatment: null
    typography: axis_label

  # ── image ─────────────────────────────────────────────────────
  - match: { content_type: image }
    treatment: card

  # ── decorative ────────────────────────────────────────────────
  - match: { content_type: decorative }
    treatment: divider
