# ─────────────────────────────────────────────────────────────────────────
# Cover / title slide — minimal layout with a wide RIGHT sidebar.
#
# Layout (default canvas 960×540):
#   • White field, left-aligned title block on the left ~78% of the slide.
#   • Thin vertical accent stripe on the seam.
#   • Wide solid color pane (≈ 22% width) on the RIGHT edge.
#     Geometric mirror of `sections/agenda_left_pane` — same pane width
#     and stripe thickness, only the side is flipped.
#   • Centered page-number numeral in the footer band.
#
# Use this for workshop / chapter / section covers where the deck wants a
# quiet, typographic opening — no imagery, no gradient. Reference design:
#   examples/101-GTDS-CAO_France_Entity_Migration_to_Oracle-Project_Kickoff
#     /docusign-workshop-1.1 cover slide.
#
# Slots (content)
# ─────────────
#   title         Required.  Headline, e.g. "Docusign Workshop 1.1".
#   subtitle      Optional.  One-line tagline below the title.
#   page_number   Optional.  Footer numeral (e.g. "1" or "01").
#
# Params (style + geometry)
# ─────────────
#   bg_color              Slide field fill.                   default: #FFFFFF
#   title_color           Title text color.                   default: #1A2B3E
#   subtitle_color        Subtitle text color.                default: #8A8A8A
#   accent_color          Vertical accent stripe color.       default: #E51A4C
#   right_pane_color      Far-right wide pane fill.           default: #1A2B3E
#   page_number_color     Footer numeral color.               default: #8A8A8A
#
# The symbol is canvas-sized at 960×540. Callers that re-render at a
# different canvas size MUST re-instantiate the symbol with a matching
# `box:` and recompute the right-rail X coordinates accordingly.
# ─────────────────────────────────────────────────────────────────────────

_meta:
  type: symbol_pack
  id: covers.cover_minimal_sidebar
  version: 1.0.0
  description: >-
    Minimalist title / cover slide. Left-aligned typography on a white
    field, accented by a thin vertical stripe and a wide solid color
    pane on the right edge. Mirrored sibling of
    `sections/agenda_left_pane` — same pane width (212 px on a 960 px
    canvas) and stripe thickness, only the side is flipped. Optional
    centered footer page number.
  slots: [title, subtitle, page_number]
  params:
    - bg_color
    - title_color
    - subtitle_color
    - accent_color
    - right_pane_color
    - page_number_color
  schema: cover_minimal_sidebar.schema.json
  canvas:
    size: [960, 540]
    units: px

symbols:

  cover_minimal_sidebar:
    box: [0, 0, 960, 540]
    slots: [title, subtitle, page_number]
    objects:

      # Background field
      - type: rect
        id: bg
        box: [0, 0, 960, 540]
        fill: "$bg_color"

      # Thin vertical accent stripe on the seam (mirror of agenda)
      - type: rect
        id: accent_stripe
        box: [744, 0, 4, 540]
        fill: "$accent_color"

      # Wide solid pane on the RIGHT (212 px — mirror of agenda's left pane)
      - type: rect
        id: right_pane
        box: [748, 0, 212, 540]
        fill: "$right_pane_color"

      # Title — left-aligned, vertically centered on the visible left field
      - type: text
        id: title_text
        box: [60, 240, 660, 76]
        text: "$title"
        style: cover_minimal_title

      # Subtitle — directly under the title
      - type: text
        id: subtitle_text
        box: [60, 322, 660, 36]
        text: "$subtitle"
        style: cover_minimal_subtitle

      # Footer page number — centered horizontally on the slide
      - type: text
        id: page_number_text
        box: [0, 510, 960, 18]
        text: "$page_number"
        style: cover_minimal_page_number
